  <script>
    if (window.Arcade && Arcade.i18n) {
      Arcade.i18n.applyStatic();
      document.title = '404' + Arcade.i18n.t('app.titleSuffix');
      var d = document.querySelector('meta[name="description"]');
      if (d) d.setAttribute('content', Arcade.i18n.t('app.desc404'));
      var btns = document.querySelectorAll('.lang-btn');
      for (var i = 0; i < btns.length; i++) {
        if (btns[i].getAttribute('data-lang') === Arcade.i18n.getLang()) btns[i].classList.add('on');
        btns[i].addEventListener('click', function () {
          Arcade.i18n.setLang(this.getAttribute('data-lang'));
        });
      }
    }
    /* 404 背景音乐：大厅主旋律（尊重音乐开关设置） */
    if (window.Arcade && Arcade.music) {
      var ms = null;
      try { ms = JSON.parse(localStorage.getItem('arcade_settings') || 'null'); } catch (e) { ms = null; }
      Arcade.music.setEnabled(!ms || ms.music !== false);
      Arcade.music.play('lobby');
    }
  </script>
