  <script src="assets/js/core/i18n.js"></script>

  <script src="assets/js/nav.js"></script>
  <script>
    (function () {
      if (!window.Arcade || !Arcade.i18n) return;
      Arcade.i18n.applyStatic();
      document.title = (Arcade.i18n.getLang() === 'en' ? 'Privacy Notice' : '隐私说明') + Arcade.i18n.t('app.titleSuffix');
      var isEn = Arcade.i18n.getLang() === 'en';
      var copy = isEn ? window.PRIVACY_COPY.en : window.PRIVACY_COPY.zh;
      var host = document.getElementById('pv-body');
      if (host) {
        host.innerHTML = copy.map(function (sec) {
          return '<div class="pv-sec">' + sec[0] + '</div><div class="pv-p' + (sec[2] ? ' pv-box' : '') + '">' + sec[1] + '</div>';
