  <script>

    if (window.Arcade && Arcade.i18n) {
      Arcade.i18n.applyStatic();
      document.title = T('nav.artifacts') + Arcade.i18n.t('app.titleSuffix');
      var d = document.querySelector('meta[name="description"]');
      if (d) d.setAttribute('content', Arcade.i18n.t('artifacts.pageDesc'));
    }
    var st = window.Arcade && Arcade.stories;
    var tl = document.getElementById('ar-timeline');
    var count = document.getElementById('ar-count');
    if (!st) { tl.textContent = 'stories 模块未加载'; }
    else {
      count.textContent = T('artifacts.countF').replace('{u}', st.artifactsCount()).replace('{t}', (window.ARTIFACTS || []).length);
      (window.ARTIFACTS || []).forEach(function (art) {
        var unlocked = st.isArtifactUnlocked(art.id);
        var el = document.createElement('div');
        el.className = 'ar-item' + (unlocked ? ' unlocked' : '');
        if (unlocked) {
          var nature = art.nature || 'dramatized';
          el.innerHTML = '<div class="ar-name">📎 ' + T('sta.' + art.id + '.name') + '</div>' +
            '<div class="ar-era">' + T('sta.' + art.id + '.era') + '</div>' +
            '<div class="ar-nature ar-nature-' + nature + '">' + T('artifacts.nature.' + nature) + '</div>' +
            '<div class="ar-desc">' + T('sta.' + art.id + '.desc') + '</div>' +
            '<div class="ar-text">' + T('sta.' + art.id + '.text') + '</div>';
        } else {
          var g = null;
          (window.GAMES || []).forEach(function (x) { if (x.id === art.unlockGameId) g = x; });
          var gameHtml = g
            ? '<a class="ar-golink" href="games/' + g.id + '/index.html">🎮 ' + T('g.' + g.id + '.t') + '</a>'
            : (art.unlockGameId || '');
          /* C7：解锁游戏不在本章时，附「前往章节」提示 */
          var homeCh = null;
          (window.STORIES || []).forEach(function (c) { if (c.id === art.chapterId) homeCh = c; });
          var inHome = false;
          if (homeCh && homeCh.games) homeCh.games.forEach(function (gid) { if (gid === art.unlockGameId) inHome = true; });
          var chTip = '';
          if (homeCh && !inHome && homeCh.id !== 'quantum') {
            chTip = ' <a class="ar-golink" href="story.html?id=' + homeCh.id + '">📜 ' + T(homeCh.titleKey) + '</a>';
          }
          el.innerHTML = '<div class="ar-name">🔒 ' + T('sta.' + art.id + '.name') + '</div>' +
            '<div class="ar-unlock">' + T('artifacts.need') + '：' + gameHtml + chTip + '</div>';
        }
        tl.appendChild(el);
      });
    }
  </script>
  <script>
    /* 密件册背景音乐：破译主题曲 */
    if (window.Arcade && Arcade.music && Arcade.settings) {
      Arcade.music.setEnabled(Arcade.settings.get().music !== false);
      Arcade.music.play('cipher');
    }
