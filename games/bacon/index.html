  <style>
    .bc-wrap { padding: 14px 10px 24px; width: min(680px, 98vw); text-align: center; }
    .bc-pick { padding: 18px 10px; }
    .bc-pick-t { font-family: var(--font-pixel); font-size: 16px; letter-spacing: 2px; color: var(--neon-pink); text-shadow: 0 0 12px rgba(255,45,149,0.5); }
    .bc-pick-d { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 10px 0 14px; }
    .bc-pick-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .bc-pick-btns .mode-btn { flex-direction: column; gap: 4px; padding: 10px 14px; }
    .bc-pick-btns small { font-size: 10px; color: var(--text-dim); }

    .bc-panel { margin-top: 10px; }
    .bc-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin: 6px 2px; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: linear-gradient(90deg, rgba(255,45,149,0.08), rgba(0,240,255,0.05)); border: 1px solid rgba(255,45,149,0.3); border-radius: 8px; }
    .bc-flavor { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 8px 0; padding: 10px 12px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; text-align: left; }
    .bc-lbl { font-family: var(--font-pixel); font-size: 11px; color: var(--neon-cyan); text-align: left; margin: 12px 2px 6px; letter-spacing: 1px; }

    /* 伪装文本区：每个字符可点击标记 */
    .bc-cipher {
      font-size: 17px; line-height: 2.1; letter-spacing: 2px;
      padding: 14px 16px; margin: 8px 0; min-height: 64px;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(0,240,255,0.25); border-radius: 10px;
      text-align: left; user-select: none; cursor: pointer;
    }
    .bc-ch { display: inline-block; padding: 7px 4px; margin: 1px 0; border-radius: 5px; border: 1px solid transparent; transition: background .12s, border-color .12s, transform .12s; }
    .bc-ch:hover { background: rgba(0,240,255,0.10); transform: translateY(-1px); }
    .bc-ch.plain { font-weight: 400; }
    .bc-ch.bold { font-weight: 700; }
    .bc-ch.marked { background: rgba(255,230,0,0.16); border-color: rgba(255,230,0,0.5); }
    .bc-ch.correct { background: rgba(57,255,20,0.14); border-color: rgba(57,255,20,0.5); }
    .bc-ch.wrong { background: rgba(255,45,149,0.20); border-color: rgba(255,45,149,0.6); }
    .bc-ch .bc-tag { font-size: 9px; font-weight: 400; color: var(--neon-yellow); margin-left: 1px; }
    .bc-ch.bold .bc-tag { color: var(--neon-pink); }

    /* 逐位解码区 */
    .bc-bits { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; margin: 8px 0; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; min-height: 44px; align-items: center; }
    .bc-bitgrp { display: inline-flex; align-items: center; gap: 2px; padding: 3px 6px; border-radius: 6px; background: rgba(0,240,255,0.06); border: 1px solid rgba(0,240,255,0.2); font-family: var(--font-pixel); font-size: 12px; }
    .bc-bitgrp .bc-bit { color: var(--neon-cyan); }
    .bc-bitgrp .bc-bit.b { color: var(--neon-pink); }
    .bc-bitgrp .bc-dec { margin-left: 6px; color: var(--neon-yellow); }
    .bc-bitgrp.unknown .bc-dec { color: var(--text-dim); }

    .bc-msg { font-size: 12px; color: var(--text-main); min-height: 22px; text-align: left; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px; margin: 6px 0; }
    .bc-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
    .bc-key { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); padding: 6px 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; }
    .bc-key .k { font-size: 14px; }
    .bc-key .k.pl { font-weight: 400; }
    .bc-key .k.bd { font-weight: 700; }

    .bc-daily-hint { font-size: 11px; color: var(--neon-yellow); margin-top: 6px; }

    @media (max-width: 480px) {
      .bc-cipher { font-size: 15px; letter-spacing: 1px; }
    }
  </style>
