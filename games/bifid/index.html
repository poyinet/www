  <style>
    .bf-wrap { padding: 14px 10px 24px; width: min(640px, 98vw); text-align: center; }
    .bf-tabs { flex-wrap: wrap; display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .bf-tab { flex: 1; max-width: 200px; }
    .bf-keyrow { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
    .bf-keyinput {
      width: 170px; font-family: var(--font-pixel); font-size: 13px; text-align: center;
      color: var(--neon-purple); background: rgba(185,103,255,0.06);
      border: 2px solid rgba(185,103,255,0.4); border-radius: 8px; padding: 9px; outline: none;
    }
    .bf-keyinput:focus { border-color: var(--neon-purple); box-shadow: 0 0 12px rgba(185,103,255,0.35); }
    .bf-grid {
      display: grid; grid-template-columns: repeat(5, 46px); gap: 4px;
      background: var(--bg-panel); border: 1px solid rgba(0,240,255,0.3); border-radius: 10px;
      padding: 8px; width: fit-content; margin: 0 auto;
    }
    .bf-cell {
      width: 46px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 6px; background: rgba(0,240,255,0.05); border: 1px solid rgba(0,240,255,0.2);
    }
    .bf-cell .ch { font-family: var(--font-pixel); font-size: 14px; color: var(--neon-cyan); text-shadow: 0 0 6px rgba(0,240,255,.4); }
    .bf-cell .num { font-size: 9px; color: var(--text-dim); }
    .bf-cell.head { background: rgba(185,103,255,0.08); border-color: rgba(185,103,255,0.35); }
    .bf-cell.head .num { color: var(--neon-purple); }
    .bf-input {
      width: 100%; font-family: var(--font-pixel); font-size: 14px; text-align: center;
      color: var(--neon-yellow); background: rgba(255,230,0,0.05);
      border: 2px solid rgba(255,230,0,0.35); border-radius: 8px; padding: 10px; outline: none;
    }
    .bf-input:focus { border-color: var(--neon-yellow); box-shadow: 0 0 12px rgba(255,230,0,0.3); }
    .bf-output {
      font-family: var(--font-pixel); font-size: 14px; line-height: 1.8; color: var(--neon-green);
      background: rgba(57,255,20,0.06); border: 1px solid rgba(57,255,20,0.3); border-radius: 8px;
      padding: 10px 8px; word-break: break-word; min-height: 40px; text-shadow: 0 0 8px rgba(57,255,20,.4);
    }
    .bf-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin: 6px 2px; flex-wrap: wrap; gap: 6px; }
    .bf-msg { min-height: 20px; font-size: 13px; color: var(--neon-pink); margin: 8px 0; line-height: 1.7; }
    .bf-cipher {
      font-family: var(--font-pixel); font-size: 15px; line-height: 1.9; color: var(--neon-pink);
      background: rgba(255,45,149,0.06); border: 1px solid rgba(255,45,149,0.3); border-radius: 8px;
      padding: 12px 10px; word-break: break-word; margin: 8px 0; text-shadow: 0 0 8px rgba(255,45,149,.4);
    }
    .bf-hint { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 6px 0; }
    .bf-hint b { color: var(--neon-purple); }
    .bf-chalinput {
      width: 140px; font-family: var(--font-pixel); font-size: 15px; text-align: center;
      color: var(--neon-green); background: rgba(57,255,20,0.05);
      border: 2px solid rgba(57,255,20,0.4); border-radius: 8px; padding: 9px; outline: none;
    }
    .bf-posrow { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; margin: 8px 0; }
    .bf-pos {
      width: 34px; height: 38px; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-pixel); font-size: 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-dim); background: transparent;
    }
    .bf-pos.ok { color: var(--neon-green); border-color: rgba(57,255,20,0.5); background: rgba(57,255,20,0.08); }
    @media (max-width: 480px) {

      .bf-cell .ch { font-size: 12px; }
