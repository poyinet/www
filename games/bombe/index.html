  <style>.seo-h1{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}</style>

  <style>
    .bm-wrap { padding: 14px 10px 24px; width: min(720px, 98vw); text-align: center; }
    .bm-tabs { flex-wrap: wrap; display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .bm-tab { flex: 1; max-width: 200px; }
    .bm-machine {
      position: relative; width: 100%; border-radius: 12px; overflow: hidden;
      background: linear-gradient(180deg, #1a1a2e, #0d0d18);
      border: 1px solid rgba(185,103,255,0.3);
      box-shadow: 0 0 24px rgba(185,103,255,0.12); padding: 14px; margin: 8px 0;
    }
    .bm-bank {
      display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 6px 0;
    }
    .bm-drum {
      width: 74px; padding: 8px 4px; border-radius: 8px; text-align: center;
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12);
    }
    .bm-drum .dlabel { font-size: 9px; color: var(--text-dim); letter-spacing: 1px; }
    .bm-drum .dletter {
      font-family: var(--font-pixel); font-size: 22px; color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0,240,255,0.6); margin: 2px 0;
    }
    .bm-drum .darrow { font-size: 11px; color: var(--neon-purple); cursor: pointer; border: none; background: none; }
    .bm-drum.scanning .dletter { animation: drumspin 0.3s linear infinite; }
    @keyframes drumspin { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .bm-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin: 6px 2px; flex-wrap: wrap; gap: 6px; }
    .bm-msg { min-height: 20px; font-size: 13px; color: var(--neon-pink); margin: 8px 0; line-height: 1.7; }
    .bm-crib {
      font-family: var(--font-pixel); font-size: 15px; letter-spacing: 3px; color: var(--neon-yellow);
      background: rgba(255,230,0,0.06); border: 1px solid rgba(255,230,0,0.35); border-radius: 8px;
      padding: 10px; margin: 6px 0; text-shadow: 0 0 8px rgba(255,230,0,.4); word-break: break-all;
    }
    .bm-cipher {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 2px; color: var(--neon-pink);
      background: rgba(255,45,149,0.06); border: 1px solid rgba(255,45,149,0.3); border-radius: 8px;
      padding: 10px; margin: 6px 0; text-shadow: 0 0 8px rgba(255,45,149,.4); word-break: break-all;
    }
    .bm-result {
      font-family: var(--font-pixel); font-size: 12px; line-height: 1.9; color: var(--neon-green);
      background: rgba(57,255,20,0.06); border: 1px solid rgba(57,255,20,0.3); border-radius: 8px;
      padding: 10px; margin: 6px 0; min-height: 38px; text-align: left; word-break: break-all;
    }
    .bm-result .cand { display: inline-block; margin: 2px 4px; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(57,255,20,0.4); cursor: pointer; }
    .bm-result .cand:hover { background: rgba(57,255,20,0.15); }
    .bm-lamps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 8px 0; }
    .bm-lamp {
      font-family: var(--font-pixel); font-size: 10px; padding: 6px 0; border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.15); color: var(--text-dim); background: rgba(0,0,0,0.3);
    }
    .bm-lamp.lit { color: var(--neon-yellow); border-color: rgba(255,230,0,0.6); background: rgba(255,230,0,0.12); box-shadow: 0 0 10px rgba(255,230,0,0.4); }
    .bm-rotorselect { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 6px 0; }
    .bm-rotorselect select {
      font-family: var(--font-pixel); font-size: 11px; padding: 6px; background: var(--bg-panel-2);
      color: var(--text-main); border: 1px solid rgba(185,103,255,0.4); border-radius: 6px; outline: none;
    }
    .bm-hint { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 6px 0; }
    .bm-hint b { color: var(--neon-purple); }
    @media (max-width: 480px) {
      .bm-drum { width: 62px; }
      .bm-drum .dletter { font-size: 18px; }
      .bm-crib, .bm-cipher { font-size: 12px; }
    }
