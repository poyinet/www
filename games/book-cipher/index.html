  <style>
    .bc-wrap { padding: 14px 10px 24px; width: min(760px, 98vw); text-align: center; }
    .bc-prog { font-size: 12px; color: var(--neon-cyan); margin: 4px 0 10px; font-family: var(--font-pixel); }
    .bc-stage {
      font-size: 13px; color: var(--text-main); display: inline-block; padding: 5px 14px;
      background: linear-gradient(90deg, rgba(0,240,255,.12), rgba(185,103,255,.08));
      border: 1px solid rgba(0,240,255,.35); border-radius: 8px; margin: 4px 0 10px;
    }
    .bc-book {
      max-width: 560px; margin: 10px auto; text-align: left;
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,230,0,.25); border-radius: 10px;
      padding: 12px 14px;
    }
    .bc-title { font-size: 12px; color: var(--neon-yellow); margin-bottom: 8px; font-family: var(--font-pixel); }
    .bc-line { font-size: 12px; line-height: 2.2; color: var(--text-dim); display: flex; gap: 6px; flex-wrap: wrap; }
    .bc-lno { color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 10px; margin-right: 4px; min-width: 20px; }
    .bc-word { padding: 0 2px; }
    .bc-word.current { color: var(--neon-green); background: rgba(57,255,20,.1); border-radius: 4px; }
    .bc-q { font-size: 14px; color: var(--text-main); margin: 10px 4px; line-height: 1.8; }
    .bc-check { margin: 8px 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .bc-card {
      flex: 1 1 200px; max-width: 260px; text-align: left;
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 8px 10px;
    }
    .bc-card.real { border-color: rgba(57,255,20,.45); }
    .bc-card-t { font-size: 11px; color: var(--neon-cyan); margin-bottom: 4px; }
    .bc-card-d { font-size: 11px; color: var(--text-dim); line-height: 1.8; word-break: break-all; }
    .bc-btns { display: flex; gap: 10px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
    .bc-msg { font-size: 13px; min-height: 22px; margin: 6px 0; }
    .bc-msg.ok { color: var(--neon-green); }
    .bc-msg.no { color: var(--neon-pink); }
    .bc-expl {
      font-size: 12px; color: var(--text-dim); line-height: 1.9; text-align: left;
      max-height: 0; overflow: hidden; transition: max-height .25s ease;
    }
    .bc-expl.on {
      max-height: 400px; background: rgba(0,240,255,.05); border: 1px solid rgba(0,240,255,.2);
      border-radius: 8px; padding: 10px 12px; margin: 8px 0;
    }
    .bc-help { font-size: 11px; color: var(--text-dim); line-height: 1.9; margin-top: 12px; text-align: left; }
    @media (max-width: 480px) {
      .bc-line { font-size: 11px; }
      .bc-card { flex-basis: 100%; max-width: none; }
    }
