  <style>
    .bc-wrap { padding: 14px 10px 24px; width: min(680px, 98vw); text-align: center; }
    .bc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; margin: 8px 2px; color: var(--text-dim); }
    .bc-top .stat-value { font-family: var(--font-pixel); }
    .bc-story {
      font-size: 13px; line-height: 1.9; color: var(--text-main); text-align: left;
      background: var(--bg-panel); border: 1px solid rgba(185,103,255,0.25); border-radius: 10px;
      padding: 12px 14px; margin: 8px 0;
    }
    .bc-story .from { color: var(--neon-pink); font-weight: 700; }
    .bc-cipher {
      font-family: var(--font-pixel); font-size: 15px; line-height: 1.9; color: var(--neon-cyan);
      background: rgba(0,240,255,0.06); border: 1px solid rgba(0,240,255,0.3); border-radius: 8px;
      padding: 12px 10px; word-break: break-word; margin: 8px 0; text-shadow: 0 0 8px rgba(0,240,255,.4);
    }
    .bc-info { font-size: 12px; color: var(--text-dim); margin: 4px 2px; line-height: 1.8; }
    .bc-info b { color: var(--neon-purple); }
    .bc-input {
      width: 100%; font-family: var(--font-pixel); font-size: 15px; text-align: center;
      color: var(--neon-green); background: rgba(57,255,20,0.05);
      border: 2px solid rgba(57,255,20,0.4); border-radius: 8px; padding: 11px; outline: none;
      text-transform: uppercase;
    }
    .bc-input:focus { border-color: var(--neon-green); box-shadow: 0 0 12px rgba(57,255,20,0.35); }
    .bc-msg { min-height: 20px; font-size: 13px; color: var(--neon-pink); margin: 8px 0; line-height: 1.7; }
    .bc-progress { display: flex; gap: 4px; justify-content: center; margin: 6px 0 10px; }
    .bc-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }
    .bc-dot.done { background: var(--neon-green); border-color: var(--neon-green); box-shadow: 0 0 8px rgba(57,255,20,.5); }
    .bc-dot.cur { border-color: var(--neon-yellow); box-shadow: 0 0 8px rgba(255,230,0,.6); }
    .bc-dot.lock { opacity: 0.3; }
    .bc-overlay {
      position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
      background: rgba(5,5,12,0.85); padding: 16px;
    }
    .bc-overlay.hidden { display: none; }
    .bc-modal {
      background: var(--bg-panel); border: 1px solid var(--accent, #00f0ff); border-radius: 12px;
      padding: 22px; width: min(420px, 92vw); text-align: center;
      box-shadow: 0 0 30px color-mix(in srgb, var(--accent, #00f0ff) 25%, transparent);
    }
    .bc-modal h2 { font-family: var(--font-pixel); font-size: 16px; margin-bottom: 12px; }
    .bc-modal h2.win { color: var(--neon-green); text-shadow: 0 0 10px rgba(57,255,20,.6); }
    .bc-modal h2.lose { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255,45,149,.6); }
    .bc-modal p { font-size: 13px; color: var(--text-dim); line-height: 1.9; margin-bottom: 14px; }
    .bc-modal p b { color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 12px; }
    .bc-hint {
      font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 6px 0;
      border: 1px dashed rgba(255,230,0,0.3); border-radius: 8px; padding: 8px 10px;
    }
    @media (max-width: 480px) {
      .bc-cipher { font-size: 13px; }
      .bc-story { font-size: 12px; }
    }
