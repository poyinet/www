  <style>
    .dk-wrap { padding: 14px; width: min(560px, 96vw); text-align: center; }
    .dk-enemy { margin: 10px auto; width: min(320px, 92vw); border-radius: 10px; padding: 12px;
      background: rgba(255,45,149,0.08); border: 1px solid rgba(255,45,149,0.3); }
    .dk-enemy .name { font-size: 15px; font-weight: 500; color: var(--neon-pink); }
    .dk-hpbar { height: 10px; border-radius: 5px; background: rgba(255,255,255,0.1); margin: 8px 0 4px; overflow: hidden; }
    .dk-hpbar i { display: block; height: 100%; background: var(--neon-pink); transition: width 0.25s; }
    .dk-intent { font-size: 12px; color: var(--text-dim); }
    .dk-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); margin: 8px 2px; }
    .dk-top b { color: var(--neon-yellow); font-family: var(--font-mono); }
    .dk-hand { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 110px; margin: 8px 0; }
    .dk-card { width: 88px; min-height: 104px; border-radius: 8px; padding: 6px; cursor: pointer;
      background: #1c2440; border: 2px solid rgba(0,240,255,0.35); display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; transition: transform 0.12s, border-color 0.12s; }
    .dk-card:hover { transform: translateY(-6px); border-color: var(--neon-yellow); }
    .dk-card.cant { opacity: 0.45; cursor: default; transform: none; }
    .dk-card .cn { font-size: 14px; font-weight: 500; color: #fff; }
    .dk-card .cd { font-size: 10px; color: var(--text-dim); line-height: 1.35; }
    .dk-card .cc { font-size: 11px; color: var(--neon-yellow); font-family: var(--font-mono); }
    .dk-card.atk { border-color: rgba(255,45,149,0.5); }
    .dk-card.def { border-color: rgba(0,240,255,0.5); }
    .dk-msg { min-height: 18px; font-size: 13px; color: var(--neon-green); margin: 8px 0; }
    .dk-log { font-size: 11px; color: var(--text-dim); min-height: 16px; }
    .dk-choice {
      position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%);
      background: rgba(10, 12, 20, 0.96); border: 1px solid var(--neon-purple);
      border-radius: 12px; padding: 18px 16px; z-index: 30;
      display: flex; flex-direction: column; gap: 10px; width: min(320px, 88vw);
      box-shadow: 0 0 24px rgba(185, 103, 255, 0.35);
    }
    .dk-choice.hidden { display: none; }
    .dk-choice-title { text-align: center; font-size: 15px; color: var(--neon-yellow); margin-bottom: 4px; }
