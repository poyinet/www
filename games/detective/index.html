  <style>
    .dt-wrap { padding: 12px 8px 24px; width: min(720px, 100vw); text-align: center; }
    .dt-chap {
      font-size: 12px; color: var(--text-dim); letter-spacing: 3px; margin: 4px 0 8px;
      font-family: var(--font-pixel);
    }
    .dt-scene {
      position: relative; width: 100%; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(0,240,255,0.25); background: #07070d;
      box-shadow: 0 0 24px rgba(0,240,255,0.1); touch-action: manipulation;
    }
    .dt-scene svg { display: block; width: 100%; height: auto; }
    .dt-clue {
      cursor: pointer; transition: all 0.2s;
    }
    .dt-clue circle, .dt-clue rect, .dt-clue path {
      transition: all 0.2s;
    }
    .dt-clue:hover circle, .dt-clue:hover rect, .dt-clue:hover path {
      stroke: var(--neon-yellow); filter: drop-shadow(0 0 6px rgba(255,230,0,0.9));
    }
    .dt-clue.found { opacity: 0.25; pointer-events: none; }
    .dt-clue.hidden-clue:hover circle {
      stroke: var(--neon-pink); fill: rgba(255,45,149,0.3);
      filter: drop-shadow(0 0 6px rgba(255,45,149,0.9));
    }
    .dt-clue-label {
      fill: var(--neon-yellow); font-size: 11px; font-family: 'Press Start 2P', monospace;
      animation: clue-blink 1.6s ease infinite;
    }
    @keyframes clue-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .dt-narrative {
      font-size: 14px; line-height: 2; color: var(--text-main); text-align: left;
      background: var(--bg-panel); border: 1px solid rgba(185,103,255,0.25); border-radius: 10px;
      padding: 14px 16px; margin: 12px 0 8px; min-height: 60px;
    }
    .dt-narrative .speaker { color: var(--neon-cyan); font-weight: 700; }
    .dt-narrative .sys { color: var(--neon-pink); font-weight: 700; }
    .dt-inv {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; min-height: 30px;
    }
    .dt-item {
      font-size: 12px; padding: 6px 12px; border-radius: 999px;
      border: 1px solid rgba(255,230,0,0.4); color: var(--neon-yellow);
      background: rgba(255,230,0,0.06); display: inline-flex; align-items: center; gap: 6px;
    }
    .dt-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
    .dt-puzzle {
      background: var(--bg-panel); border: 1px solid var(--accent, #00f0ff); border-radius: 12px;
      padding: 16px; margin: 10px 0;
    }
    .dt-puzzle-title { font-family: var(--font-pixel); font-size: 12px; color: var(--accent, #00f0ff); margin-bottom: 10px; }
    .dt-puzzle .dt-hint { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin-bottom: 10px; }
    .dt-msg { min-height: 20px; font-size: 13px; color: var(--neon-pink); margin: 8px 0; line-height: 1.7; }
    .dt-overlay {
      position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
      background: rgba(5,5,12,0.88); padding: 16px;
    }
    .dt-overlay.hidden { display: none; }
    .dt-modal {
      background: var(--bg-panel); border: 1px solid var(--accent, #00f0ff); border-radius: 12px;
      padding: 22px; width: min(440px, 94vw); text-align: center;
      box-shadow: 0 0 30px color-mix(in srgb, var(--accent, #00f0ff) 25%, transparent);
    }
    .dt-modal h2 { font-family: var(--font-pixel); font-size: 15px; margin-bottom: 12px; }
    .dt-modal h2.win { color: var(--neon-green); text-shadow: 0 0 10px rgba(57,255,20,.6); }
    .dt-modal p { font-size: 13px; color: var(--text-dim); line-height: 1.9; margin-bottom: 14px; }
    .dt-modal p b { color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 12px; }
