  <style>
    .cd-dungeon { padding: 14px 10px 24px; width: min(720px, 98vw); text-align: center; }
    .cd-info {
      display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim);
      margin: 6px 2px; flex-wrap: wrap; gap: 6px; padding: 8px 10px;
      background: linear-gradient(90deg, rgba(185,103,255,0.08), rgba(0,240,255,0.06));
      border: 1px solid rgba(185,103,255,0.25); border-radius: 8px;
    }
    .cd-msg { min-height: 20px; font-size: 13px; color: var(--neon-pink); margin: 8px 0; line-height: 1.7; }
    .cd-hint { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 6px 0; text-align: left; }
    .cd-hint b { color: var(--neon-purple); }
    .cd-cipher {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 2px; color: var(--neon-pink);
      background: rgba(255,45,149,0.06); border: 1px solid rgba(255,45,149,0.3); border-radius: 8px;
      padding: 10px; margin: 6px 0; text-shadow: 0 0 8px rgba(255,45,149,.4); word-break: break-all;
    }
    .cd-lbl { font-size: 11px; color: var(--text-dim); margin: 8px 0 4px; text-align: left; }
    .cd-grid { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; margin: 6px 0; padding: 2px; }
    .cd-cand {
      font-family: var(--font-pixel); font-size: 12px; letter-spacing: 1px; text-align: left;
      padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(0,240,255,0.35);
      background: rgba(0,240,255,0.05); color: var(--neon-cyan); cursor: pointer; word-break: break-all;
    }
    .cd-cand:hover { background: rgba(0,240,255,0.14); }
    .cd-cand small { color: var(--text-dim); font-family: var(--font-body); }
    .cd-row { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    .cd-row select {
      font-family: var(--font-pixel); font-size: 12px; padding: 6px; background: var(--bg-panel-2);
      color: var(--text-main); border: 1px solid rgba(185,103,255,0.4); border-radius: 6px; outline: none;
    }
    .cd-meterline { font-size: 12px; color: var(--text-dim); margin: 6px 0; text-align: left; }
    .cd-meter { display: inline-block; width: 130px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; vertical-align: middle; overflow: hidden; }
    .cd-meterfill { display: block; height: 100%; background: linear-gradient(90deg, var(--neon-pink), var(--neon-yellow), var(--neon-green)); }
    .cd-preview {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 2px; color: var(--neon-green);
      background: rgba(57,255,20,0.05); border: 1px solid rgba(57,255,20,0.25); border-radius: 8px;
      padding: 10px; margin: 6px 0; word-break: break-all; text-align: left;
    }
    .cd-bacongroups {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 2px; color: var(--neon-yellow);
      background: rgba(255,230,0,0.06); border: 1px solid rgba(255,230,0,0.35); border-radius: 8px;
      padding: 10px; margin: 6px 0; word-break: break-all; text-align: left;
    }
    .cd-bacon-table { display: flex; flex-wrap: wrap; gap: 3px 10px; font-family: var(--font-pixel); font-size: 11px; color: var(--neon-purple); margin: 6px 0; justify-content: center; }
    .cd-result {
      font-family: var(--font-pixel); font-size: 12px; line-height: 1.9; color: var(--neon-green);
      background: rgba(57,255,20,0.06); border: 1px solid rgba(57,255,20,0.3); border-radius: 8px;
      padding: 10px; margin: 6px 0; min-height: 20px; text-align: left; word-break: break-all;
    }
    .cd-items { min-height: 24px; margin: 4px 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; align-items: center; }
    .cd-item {
      font-family: var(--font-pixel); font-size: 12px; padding: 6px 10px; border-radius: 8px;
      border: 1px solid rgba(255,230,0,0.45); color: var(--neon-yellow); background: rgba(255,230,0,0.07); cursor: pointer;
    }
    .cd-row input {
      font-family: var(--font-pixel); font-size: 15px; letter-spacing: 3px; text-align: center; text-transform: uppercase;
      padding: 10px; width: min(280px, 80%); background: var(--bg-panel-2); color: var(--text-main);
      border: 1px solid rgba(185,103,255,0.4); border-radius: 8px; outline: none;
    }
    @media (max-width: 480px) {
      .cd-cipher { font-size: 11px; }
      .cd-cand { font-size: 10px; }
    }
