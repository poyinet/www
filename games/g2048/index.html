  <style>
    .g2048-board {
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: min(400px, 92vw);
      aspect-ratio: 1;
      margin: 0 auto;
      touch-action: none;
    }
    .g2048-cell {
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      font-family: var(--font-pixel);
      font-size: 20px;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.04);
      user-select: none;
    }
    /* 数字块配色：2/4 暗 → 1024/2048 金 */
    .g2048-cell.v2    { background: rgba(0, 240, 255, 0.07); color: #9adfe8; }
    .g2048-cell.v4    { background: rgba(0, 240, 255, 0.14); color: var(--neon-cyan); text-shadow: 0 0 6px rgba(0, 240, 255, 0.5); }
    .g2048-cell.v8    { background: rgba(57, 255, 20, 0.16); color: var(--neon-green); text-shadow: 0 0 8px rgba(57, 255, 20, 0.6); }
    .g2048-cell.v16   { background: rgba(185, 103, 255, 0.2); color: var(--neon-purple); text-shadow: 0 0 8px rgba(185, 103, 255, 0.6); }
    .g2048-cell.v32   { background: rgba(255, 45, 149, 0.22); color: var(--neon-pink); text-shadow: 0 0 8px rgba(255, 45, 149, 0.6); }
    .g2048-cell.v64   { background: rgba(255, 45, 149, 0.38); color: #ff7cc0; text-shadow: 0 0 10px rgba(255, 45, 149, 0.8); box-shadow: 0 0 14px rgba(255, 45, 149, 0.35); }
    .g2048-cell.v128  { background: rgba(255, 159, 28, 0.32); color: var(--neon-orange); text-shadow: 0 0 10px rgba(255, 159, 28, 0.7); box-shadow: 0 0 14px rgba(255, 159, 28, 0.3); font-size: 16px; }
    .g2048-cell.v256  { background: rgba(255, 159, 28, 0.48); color: #ffc25e; text-shadow: 0 0 12px rgba(255, 159, 28, 0.85); box-shadow: 0 0 18px rgba(255, 159, 28, 0.4); font-size: 16px; }
    .g2048-cell.v512  { background: rgba(255, 230, 0, 0.38); color: var(--neon-yellow); text-shadow: 0 0 12px rgba(255, 230, 0, 0.85); box-shadow: 0 0 18px rgba(255, 230, 0, 0.4); font-size: 16px; }
    .g2048-cell.v1024 { background: rgba(255, 230, 0, 0.58); color: #fff3a0; text-shadow: 0 0 14px rgba(255, 230, 0, 1); box-shadow: 0 0 24px rgba(255, 230, 0, 0.55); font-size: 13px; }
    .g2048-cell.v2048 { background: var(--neon-yellow); color: #1a1604; text-shadow: none; box-shadow: 0 0 28px rgba(255, 230, 0, 0.85); font-size: 13px; }
    .g2048-cell.vsuper { background: var(--neon-pink); color: #1a0410; text-shadow: none; box-shadow: 0 0 28px rgba(255, 45, 149, 0.85); font-size: 12px; }
    /* 动画：新块弹出 / 合并块脉冲 */
    @keyframes g2048-pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    @keyframes g2048-merge {
      0% { transform: scale(1); }
      50% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
    .g2048-cell.tile-new { animation: g2048-pop 0.15s ease; }
    .g2048-cell.tile-merged { animation: g2048-merge 0.18s ease; }
    @media (max-width: 480px) {
      .g2048-cell { font-size: 15px; }
      .g2048-cell.v128, .g2048-cell.v256, .g2048-cell.v512 { font-size: 12px; }
      .g2048-cell.v1024, .g2048-cell.v2048 { font-size: 10px; }
      .g2048-cell.vsuper { font-size: 9px; }
    }
