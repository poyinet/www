  <style>.seo-h1{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}</style>

  <style>
    .hl-wrap { padding: 14px 10px 24px; width: min(720px, 98vw); text-align: center; }
    .hl-tabs { flex-wrap: wrap; display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .hl-tab { flex: 1; max-width: 200px; }
    .hl-machine {
      position: relative; width: 100%; border-radius: 12px; overflow: hidden;
      background: linear-gradient(180deg, #1a1a2e, #0d0d18);
      border: 1px solid rgba(185,103,255,0.3);
      box-shadow: 0 0 24px rgba(185,103,255,0.12); padding: 14px; margin: 8px 0;
    }
    .hl-matrix {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      max-width: 300px; margin: 8px auto;
    }
    .hl-cell {
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 8px 4px; text-align: center;
    }
    .hl-cell .clabel { font-size: 9px; color: var(--text-dim); letter-spacing: 1px; }
    .hl-cell .cletter {
      font-family: var(--font-pixel); font-size: 26px; color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0,240,255,0.6); margin: 2px 0;
    }
    .hl-cell .carrow { font-size: 13px; color: var(--neon-purple); cursor: pointer; border: none; background: none; padding: 6px 10px; border-radius: 6px; }
    .hl-det { font-family: var(--font-pixel); font-size: 11px; line-height: 1.9; color: var(--neon-green); margin: 8px 0; word-break: break-all; }
    .hl-det.bad { color: var(--neon-pink); }
    .hl-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin: 6px 2px; flex-wrap: wrap; gap: 6px; }
    .hl-msg { min-height: 20px; font-size: 13px; color: var(--neon-pink); margin: 8px 0; line-height: 1.7; }
    .hl-hint { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 6px 0; }
    .hl-hint b { color: var(--neon-purple); }
    .hl-cipher {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 2px; color: var(--neon-pink);
      background: rgba(255,45,149,0.06); border: 1px solid rgba(255,45,149,0.3); border-radius: 8px;
      padding: 10px; margin: 6px 0; text-shadow: 0 0 8px rgba(255,45,149,.4); word-break: break-all;
    }
    .hl-keynotice {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 1px; color: var(--neon-yellow);
      background: rgba(255,230,0,0.06); border: 1px solid rgba(255,230,0,0.35); border-radius: 8px;
      padding: 10px; margin: 6px 0; text-shadow: 0 0 8px rgba(255,230,0,.4); word-break: break-all;
    }
    .hl-pairs {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 1px; color: var(--neon-purple);
      background: rgba(185,103,255,0.07); border: 1px solid rgba(185,103,255,0.35); border-radius: 8px;
      padding: 10px; margin: 6px 0; word-break: break-all;
    }
    .hl-codebook { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
    .hl-word {
      font-family: var(--font-pixel); font-size: 14px; letter-spacing: 2px; padding: 8px 12px;
      border-radius: 8px; border: 1px solid rgba(57,255,20,0.4); color: var(--neon-green);
      background: rgba(57,255,20,0.06); cursor: pointer;
    }
    .hl-word:hover { background: rgba(57,255,20,0.15); }
    .hl-word.used { opacity: 0.4; }
    .hl-result {
      font-family: var(--font-pixel); font-size: 12px; line-height: 1.9; color: var(--neon-green);
      background: rgba(57,255,20,0.06); border: 1px solid rgba(57,255,20,0.3); border-radius: 8px;
      padding: 10px; margin: 6px 0; min-height: 38px; text-align: left; word-break: break-all;
    }
    .hl-row { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    .hl-lbl { font-size: 12px; color: var(--text-dim); }
    .hl-row input {
      font-family: var(--font-pixel); font-size: 15px; letter-spacing: 3px; text-align: center;
      text-transform: uppercase; padding: 10px; width: min(280px, 80%);
      background: var(--bg-panel-2); color: var(--text-main);
      border: 1px solid rgba(185,103,255,0.4); border-radius: 8px; outline: none;
    }
    .hl-math { font-size: 11px; color: var(--text-dim); line-height: 1.8; margin: 6px 0; word-break: break-all; }
    @media (max-width: 480px) {
      .hl-cell .cletter { font-size: 20px; }
      .hl-cipher, .hl-pairs, .hl-keynotice { font-size: 11px; }
    }
  </style>
