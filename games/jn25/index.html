  <style>
    .jn-wrap { padding: 14px 10px 24px; width: min(760px, 98vw); text-align: center; }
    .jn-info {
      display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim);
      margin: 6px 2px; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px 10px; background: linear-gradient(90deg, rgba(0,240,255,0.08), rgba(255,230,0,0.05));
      border: 1px solid rgba(0,240,255,0.3); border-radius: 8px;
    }
    .jn-diffs { display: flex; gap: 6px; }
    .jn-flavor { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 8px 0; text-align: left; }
    .jn-lbl { font-size: 11px; color: var(--text-dim); margin: 10px 0 4px; text-align: left; }
    .jn-book { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0; }
    .jn-word {
      font-family: var(--font-pixel); font-size: 11px; letter-spacing: 1px; padding: 5px 8px;
      border-radius: 6px; border: 1px solid rgba(255,255,255,0.12); color: var(--text-dim);
      background: rgba(0,0,0,0.3);
    }
    .jn-word b { color: var(--text-dim); }
    .jn-word.on { border-color: rgba(57,255,20,0.4); color: var(--neon-green); }
    .jn-word.on b { color: var(--neon-yellow); }
    .jn-additive { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 4px 0; }
    .jn-add {
      font-family: var(--font-pixel); font-size: 12px; padding: 6px 10px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12); color: var(--text-dim); background: rgba(0,0,0,0.3);
    }
    .jn-add.on { border-color: rgba(0,240,255,0.5); color: var(--neon-cyan); background: rgba(0,240,255,0.07); }
    .jn-grid { border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin: 4px 0; }
    .jn-gridhead, .jn-row { display: grid; gap: 2px; }
    .jn-gridhead { grid-template-columns: 64px repeat(var(--K, 4), 1fr); background: rgba(0,0,0,0.4); }
    .jn-row { grid-template-columns: 64px repeat(var(--K, 4), 1fr); border-top: 1px solid rgba(255,255,255,0.06); }
    .jn-gridhead span, .jn-ship { font-size: 10px; color: var(--text-dim); padding: 5px 2px; }
    .jn-cell {
      padding: 6px 2px; cursor: pointer; border-left: 1px solid rgba(255,255,255,0.05);
      background: rgba(0,0,0,0.2); font-family: var(--font-pixel);
    }
    .jn-cell:hover { background: rgba(185,103,255,0.12); }
    .jn-cell.on { background: rgba(57,255,20,0.05); cursor: default; }
    .jn-cg { display: block; font-size: 11px; color: var(--neon-pink); }
    .jn-cw { display: block; font-size: 9px; color: var(--neon-green); margin-top: 2px; letter-spacing: 1px; }
    .jn-try {
      font-size: 12px; color: var(--text-main); min-height: 26px; text-align: left;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
      padding: 8px; margin: 6px 0;
    }
    .jn-guess {
      font-family: var(--font-pixel); font-size: 12px; padding: 6px 10px; margin: 2px 3px;
      border-radius: 6px; border: 1px solid rgba(0,240,255,0.4); color: var(--neon-cyan);
      background: rgba(0,240,255,0.06); cursor: pointer;
    }
    .jn-guess:hover { background: rgba(0,240,255,0.14); }
    @media (max-width: 520px) {
      .jn-gridhead, .jn-row { grid-template-columns: 52px repeat(var(--K, 4), 1fr); }
      .jn-cg { font-size: 9px; }
      .jn-cw { font-size: 7px; }
    }
  </style>
