  <style>
    .kl-wrap { padding: 14px 10px 24px; width: min(820px, 98vw); text-align: center; }
    .kl-pick { padding: 18px 10px; }
    .kl-pick-t { font-family: var(--font-pixel); font-size: 16px; letter-spacing: 2px; color: var(--neon-cyan); text-shadow: 0 0 12px rgba(0,240,255,0.5); }
    .kl-pick-d { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 10px 0 14px; }
    .kl-pick-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
    .kl-pick-btns .mode-btn, #kl-pick-daily { flex-direction: column; gap: 4px; padding: 10px 14px; }
    .kl-pick-btns small { font-size: 10px; color: var(--text-dim); }
    .kl-info {
      display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim);
      margin: 6px 2px; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px 10px; background: linear-gradient(90deg, rgba(0,240,255,0.08), rgba(255,230,0,0.05));
      border: 1px solid rgba(0,240,255,0.3); border-radius: 8px;
    }
    .kl-info span:last-child { font-family: var(--font-pixel); color: var(--neon-yellow); }
    .kl-top { display: flex; justify-content: space-between; gap: 8px; margin: 10px 0; }
    .kl-found, .kl-stock { display: flex; gap: 6px; }
    .kl-fcell {
      width: 54px; height: 74px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-pixel); font-size: 11px;
      background: rgba(0,0,0,0.35); border: 1px dashed rgba(255,255,255,0.2);
      color: var(--text-dim);
    }
    .kl-fcell.has { border-style: solid; border-color: rgba(57,255,20,0.5); color: var(--neon-green); background: rgba(57,255,20,0.06); }
    .kl-fcell.clickable { cursor: pointer; border-style: solid; border-color: rgba(0,240,255,0.4); color: var(--neon-cyan); }
    .kl-fcell.clickable:hover { box-shadow: 0 0 10px rgba(0,240,255,0.4); }
    .kl-waste {
      width: 54px; height: 74px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-pixel); font-size: 11px; cursor: pointer;
      background: rgba(255,230,0,0.08); border: 1px solid rgba(255,230,0,0.45); color: var(--neon-yellow);
    }
    .kl-waste.sel { box-shadow: 0 0 12px rgba(255,230,0,0.6); }
    .kl-cols { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 10px 0; }
    .kl-col { display: flex; flex-direction: column; align-items: center; min-height: 80px; }
    .kl-card {
      width: 100%; max-width: 74px; aspect-ratio: 54 / 74; margin-top: -34px;
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-pixel); font-size: 10px;
      border: 1px solid rgba(255,255,255,0.25); background: rgba(24, 30, 46, 0.95);
      color: var(--text-main); position: relative;
    }
    .kl-card:first-child { margin-top: 0; }
    .kl-card.down { background: linear-gradient(180deg, #16324a, #0d2233); color: rgba(0,240,255,0.5); }
    .kl-card.red { color: var(--neon-pink); }
    .kl-card.clickable { cursor: pointer; }
    .kl-card.clickable:hover { border-color: rgba(0,240,255,0.7); }
    .kl-card.sel { border-color: var(--neon-yellow); box-shadow: 0 0 10px rgba(255,230,0,0.5); }
    .kl-card.empty { border: 1px dashed rgba(255,255,255,0.15); background: rgba(0,0,0,0.2); margin-top: 0; }
    .kl-status {
      display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 12px;
      color: var(--text-dim); margin: 10px 0; flex-wrap: wrap;
    }
    .kl-status b { font-family: var(--font-pixel); color: var(--neon-green); }
    .kl-mini { font-size: 11px; padding: 4px 10px; }
    .kl-msg {
      font-size: 12px; color: var(--text-main); min-height: 22px; text-align: left;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
      padding: 8px; margin: 6px 0;
    }
    @media (max-width: 640px) {
      .kl-cols { gap: 3px; }
      .kl-card { font-size: 8px; }
      .kl-fcell, .kl-waste { width: 40px; height: 56px; font-size: 9px; }
    }
