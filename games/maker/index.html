<link rel="stylesheet" href="../../assets/css/theme.css">
  <style>.seo-h1{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}</style>

  <style>
    .mk-wrap { padding: 14px 10px 24px; width: min(760px, 98vw); text-align: center; }
    .mk-pick { padding: 18px 10px; }
    .mk-pick-t { font-family: var(--font-pixel); font-size: 16px; letter-spacing: 2px; color: var(--neon-purple); text-shadow: 0 0 12px rgba(185,103,255,0.5); }
    .mk-pick-d { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 10px 0 14px; }
    .mk-pick-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .mk-pick-btns .mode-btn { flex-direction: column; gap: 4px; padding: 10px 14px; }
    .mk-pick-btns small { font-size: 10px; color: var(--text-dim); }
    .mk-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin: 6px 2px; flex-wrap: wrap; gap: 6px; }
    .mk-clock { font-family: var(--font-pixel); color: var(--neon-cyan); }
    .mk-tool { color: var(--neon-pink); }
    .mk-bar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); margin: 8px 0; }
    .mk-bar .progress-bar.slim { flex: 1; }
    .mk-bar .progress-bar.danger i { background: linear-gradient(90deg, #ff2d95, #ff6b35); box-shadow: 0 0 8px rgba(255,45,149,0.5); }
    .mk-bar b { font-family: var(--font-pixel); color: var(--neon-yellow); font-size: 11px; min-width: 30px; }
    .mk-bar .mk-sub { font-size: 10px; }
    .mk-cipher-box {
      background: linear-gradient(180deg, rgba(185,103,255,0.1), rgba(10,10,18,0.5));
      border: 1px solid rgba(185,103,255,0.35); border-radius: 12px; padding: 12px; margin: 8px 0;
    }
    .mk-cname { font-family: var(--font-pixel); font-size: 15px; letter-spacing: 1px; color: var(--neon-purple); }
    .mk-cera { font-size: 10px; color: var(--text-dim); margin: 4px 0 8px; }
    .mk-keyinfo { font-size: 11px; color: var(--neon-cyan); margin-top: 6px; }
    .mk-actions { display: flex; gap: 10px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
    .mk-btn { min-width: 150px; }
    .mk-lbl { font-size: 11px; color: var(--text-dim); margin: 12px 0 6px; text-align: left; }
    .mk-ciphers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .mk-cipher {
      display: flex; flex-direction: column; gap: 3px; text-align: left;
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      padding: 10px; color: var(--text-main); font-size: 12px; cursor: pointer;
    }
    .mk-cipher:disabled { cursor: default; }
    .mk-cipher.cur { border-color: var(--neon-purple); box-shadow: 0 0 12px rgba(185,103,255,0.25); }
    .mk-cipher.owned { border-color: rgba(57,255,20,0.3); }
    .mk-cipher.buyable { border-color: rgba(255,230,0,0.5); }
    .mk-cn { font-weight: 700; }
    .mk-cn em { font-style: normal; font-size: 10px; color: var(--neon-purple); }
    .mk-cd { font-size: 10px; color: var(--neon-cyan); }
    .mk-cs { font-size: 10px; color: var(--text-dim); }
    .mk-cipher.buyable .mk-cs { color: var(--neon-yellow); }
    .mk-log {
      margin-top: 12px; text-align: left; max-height: 180px; overflow-y: auto;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 8px;
    }
    .mk-logline { font-size: 11px; color: var(--text-dim); padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); }
    .mk-logline b { color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 9px; }
    .mk-logline.good { color: var(--neon-green); }
    .mk-logline.warn { color: var(--neon-yellow); }
    .mk-logline.leak { color: var(--neon-pink); }
    .mk-logline.event { color: var(--neon-purple); }
    .mk-logline.sys { color: var(--text-main); }
    @media (max-width: 480px) {
      .mk-ciphers { grid-template-columns: 1fr; }
      .mk-btn { min-width: 120px; }
    }
