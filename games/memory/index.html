    .mem-board { grid-template-columns: repeat(4, 1fr); width: min(420px, 94vw); gap: 8px; }

    .mem-back { background: var(--bg-panel); border: 2px solid var(--neon-purple); transform: rotateY(180deg); }
    .mem-card.matched { cursor: default; }
    .mem-card.matched .mem-back { border-color: var(--neon-green); box-shadow: 0 0 12px rgba(57, 255, 20, 0.55), 0 0 28px rgba(57, 255, 20, 0.25); }
