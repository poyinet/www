  <style>
    .ms-board { margin: 0 auto; gap: 4px; touch-action: manipulation; }
    .ms-board.d-easy { width: min(396px, 94vw); }
    .ms-board.d-mid { width: min(560px, 94vw); gap: 3px; }
    .ms-board.d-hard { width: min(620px, 96vw); gap: 2px; }
    .ms-cell {
      aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-pixel);
      font-size: 14px;
      color: var(--text-main);
      background: var(--bg-panel-2);
      border: 1px solid rgba(0, 240, 255, 0.28);
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.12s;
      overflow: hidden;
    }
    .ms-board.d-mid .ms-cell { font-size: 11px; border-radius: 3px; }
    .ms-cell:hover { background: #20204a; border-color: rgba(0, 240, 255, 0.6); }
    .ms-cell.open {
      background: rgba(0, 240, 255, 0.05);
      border-color: rgba(0, 240, 255, 0.1);
      cursor: default;
    }
    .ms-cell.open:hover { background: rgba(0, 240, 255, 0.05); }
    .ms-cell.flagged { background: rgba(255, 230, 0, 0.1); }
    .ms-cell.mine { background: rgba(255, 45, 149, 0.18); }
    .ms-cell.boom {
      background: var(--neon-pink);
      box-shadow: 0 0 16px rgba(255, 45, 149, 0.8);
    }
    /* 数字 1-8 分色 */
    .ms-cell.n1 { color: #00f0ff; text-shadow: 0 0 6px rgba(0, 240, 255, 0.6); }
    .ms-cell.n2 { color: #39ff14; text-shadow: 0 0 6px rgba(57, 255, 20, 0.6); }
    .ms-cell.n3 { color: #ff2d95; text-shadow: 0 0 6px rgba(255, 45, 149, 0.6); }
    .ms-cell.n4 { color: #b967ff; text-shadow: 0 0 6px rgba(185, 103, 255, 0.6); }
    .ms-cell.n5 { color: #ffe600; text-shadow: 0 0 6px rgba(255, 230, 0, 0.6); }
    .ms-cell.n6 { color: #ff9f1c; text-shadow: 0 0 6px rgba(255, 159, 28, 0.6); }
    .ms-cell.n7 { color: #7ee8fa; text-shadow: 0 0 6px rgba(126, 232, 250, 0.6); }
    .ms-cell.n8 { color: #e8e8f0; text-shadow: 0 0 6px rgba(232, 232, 240, 0.6); }
