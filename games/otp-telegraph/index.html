  <style>
    .otp-wrap { padding: 14px 10px 24px; width: min(760px, 98vw); text-align: center; }
    .otp-prog { font-size: 12px; color: var(--neon-cyan); margin: 4px 0 10px; font-family: var(--font-pixel); }
    .otp-stage {
      font-size: 13px; color: var(--text-main); display: inline-block; padding: 5px 14px;
      background: linear-gradient(90deg, rgba(0,240,255,.12), rgba(57,255,20,.08));
      border: 1px solid rgba(0,240,255,.35); border-radius: 8px; margin: 4px 0 10px;
    }
    .otp-table { max-width: 620px; margin: 8px auto; text-align: left; }
    .otp-t-title { font-size: 12px; color: var(--neon-yellow); margin-bottom: 6px; font-family: var(--font-pixel); }
    .otp-grid {
      background: rgba(0,0,0,.35); border: 1px solid rgba(0,240,255,.25); border-radius: 10px;
      padding: 10px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px;
    }
    .otp-ch {
      font-family: var(--font-pixel); font-size: 11px; color: var(--neon-green);
      background: rgba(57,255,20,.06); border: 1px solid rgba(57,255,20,.25); border-radius: 6px; padding: 4px 6px;
      display: flex; gap: 6px; align-items: center; justify-content: center;
    }
    .otp-ch i { color: var(--neon-cyan); font-style: normal; }
    .otp-note { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
    .otp-q { font-size: 14px; color: var(--text-main); margin: 10px 4px; line-height: 1.8; }
    .otp-btns { display: flex; gap: 10px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
    .otp-msg { font-size: 13px; min-height: 22px; margin: 6px 0; }
    .otp-msg.ok { color: var(--neon-green); }
    .otp-msg.no { color: var(--neon-pink); }
    .otp-expl {
      font-size: 12px; color: var(--text-dim); line-height: 1.9; text-align: left;
      max-height: 0; overflow: hidden; transition: max-height .25s ease;
    }
    .otp-expl.on {
      max-height: 400px; background: rgba(0,240,255,.05); border: 1px solid rgba(0,240,255,.2);
      border-radius: 8px; padding: 10px 12px; margin: 8px 0;
    }
    .otp-help { font-size: 11px; color: var(--text-dim); line-height: 1.9; margin-top: 12px; text-align: left; }
