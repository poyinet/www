  <style>
    .pp-wrap { padding: 14px 10px 24px; width: min(760px, 98vw); text-align: center; }
    .pp-tabs { flex-wrap: wrap; display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
    .pp-info {
      display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim);
      margin: 6px 2px; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px 10px; background: linear-gradient(90deg, rgba(0,240,255,0.08), rgba(185,103,255,0.06));
      border: 1px solid rgba(0,240,255,0.3); border-radius: 8px;
    }
    .pp-info span:last-child { font-family: var(--font-pixel); color: var(--neon-yellow); }
    .pp-flavor { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 8px 0; text-align: left; }
    .pp-wheels { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
    .pp-wheel {
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
      padding: 8px 6px; min-width: 76px;
    }
    .pp-wheel.w20 { border-color: rgba(0,240,255,0.35); }
    .pp-wheel.w6 { border-color: rgba(185,103,255,0.45); }
    .pp-wname { font-size: 10px; color: var(--text-dim); margin-bottom: 6px; }
    .pp-wheel.w20 .pp-wname { color: var(--neon-cyan); }
    .pp-wheel.w6 .pp-wname { color: var(--neon-purple); }
    .pp-wpos {
      font-family: var(--font-pixel); font-size: 20px; color: var(--neon-yellow);
      text-shadow: 0 0 8px rgba(255,230,0,0.5); margin: 4px 0 6px;
    }
    .pp-wbtn { font-size: 10px; padding: 2px 8px; }
    .pp-lbl { font-size: 11px; color: var(--text-dim); margin: 10px 0 4px; text-align: left; }
    .pp-plbl { font-size: 11px; color: var(--text-main); margin: 6px 0; text-align: left; display: inline-block; }
    .pp-board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 4px 0; }
    .pp-letter {
      font-family: var(--font-pixel); font-size: 13px; padding: 6px 0; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.14); color: var(--text-main); background: rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .pp-letter.on { border-color: rgba(0,240,255,0.6); background: rgba(0,240,255,0.1); }
    .pp-letter.sel { border-color: var(--neon-yellow); background: rgba(255,230,0,0.12); box-shadow: 0 0 8px rgba(255,230,0,0.4); }
    .pp-pairs { font-size: 12px; color: var(--text-dim); margin: 6px 0; min-height: 18px; text-align: left; }
    .pp-pair { font-family: var(--font-pixel); color: var(--neon-cyan); margin: 0 4px; }
    .pp-in {
      width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px;
      background: rgba(0,0,0,0.4); border: 1px solid rgba(0,240,255,0.35); color: var(--text-main);
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 2px; text-align: center;
    }
    .pp-row { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
    .pp-out {
      font-family: var(--font-pixel); font-size: 15px; letter-spacing: 3px; line-height: 2;
      color: var(--neon-green); text-shadow: 0 0 8px rgba(57,255,20,0.4);
      background: rgba(0,0,0,0.4); border: 1px solid rgba(57,255,20,0.25); border-radius: 8px;
      padding: 10px; margin: 6px 0; word-break: break-all;
    }
    .pp-cipher {
      font-family: var(--font-pixel); font-size: 15px; letter-spacing: 3px; line-height: 2;
      color: var(--neon-pink); text-shadow: 0 0 8px rgba(255,45,149,0.4);
      background: rgba(0,0,0,0.4); border: 1px solid rgba(255,45,149,0.3); border-radius: 8px;
      padding: 10px; margin: 4px 0; word-break: break-all;
    }
    .pp-posrow { display: flex; align-items: center; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
    .pp-pval { font-family: var(--font-pixel); font-size: 18px; color: var(--neon-yellow); min-width: 30px; }
    .pp-scorebar {
      display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); margin: 8px 0;
    }
    .pp-scorebar .progress-bar.slim { flex: 1; }
    .pp-scorebar b { font-family: var(--font-pixel); color: var(--neon-yellow); font-size: 11px; }
    .pp-msg {
      font-size: 12px; color: var(--text-main); min-height: 22px; text-align: left;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
      padding: 8px; margin: 6px 0;
    }
    @media (max-width: 480px) {
      .pp-board { grid-template-columns: repeat(5, 1fr); }
      .pp-wheel { min-width: 64px; }
    }
  </style>
