    .reaction-panel.result{border-color:var(--neon-cyan);}

    .reaction-panel.falsestart .rp-text{color:var(--neon-yellow);text-shadow:0 0 10px rgba(255,230,0,0.7);}

    .reaction-rounds{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;min-height:30px;}
    .reaction-chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid;}
    .reaction-chip.s-god{color:var(--neon-green);border-color:rgba(57,255,20,0.6);background:rgba(57,255,20,0.08);}
