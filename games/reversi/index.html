  <style>
    .rv-board {
      display: grid;
      grid-template-columns: repeat(8, min(52px, 10.5vw));
      justify-content: center;
      gap: 0;
      padding: 6px;
      background: #082a21;
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: var(--radius);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.15);
      margin: 0 auto;
      width: fit-content;
      user-select: none;
    }
    .rv-cell {
      width: min(52px, 10.5vw);
      height: min(52px, 10.5vw);
      min-height: 34px;
      background: #0d3b2e;
      border: 1px solid rgba(0, 240, 255, 0.15);
      position: relative;
    }
    .rv-cell.alt { background: #0f4435; }
    .rv-cell.hint { cursor: pointer; }
    .rv-cell.hint:hover {
      border-color: var(--neon-green);
      box-shadow: inset 0 0 12px rgba(57, 255, 20, 0.35);
    }
    .disc {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
    }
    .disc.black {
      background: radial-gradient(circle at 32% 30%, #4a4a4a, #050505);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.25);
    }
    .disc.white {
      background: radial-gradient(circle at 32% 30%, #ffffff, #c9c9c9);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }
    .disc.flip { animation: rv-flip 0.35s ease; }
    @keyframes rv-flip {
      0% { transform: scaleY(0.1); }
      100% { transform: scaleY(1); }
    }
    .hint-dot {
      position: absolute;
      inset: 38%;
      border-radius: 50%;
    }
    .hint-dot.black {
      background: rgba(0, 0, 0, 0.55);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.35);
    }
    .hint-dot.white {
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }
    .mode-btn.active {
      background: var(--neon-cyan);
      color: #04121a;
      text-shadow: none;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
    }
    .mode-btn.pink.active {
      background: var(--neon-pink);
      color: #1a0410;
      box-shadow: 0 0 16px rgba(255, 45, 149, 0.6);
    }
