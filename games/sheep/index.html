  <style>
    .yg-wrap { padding: 14px 10px 24px; width: min(520px, 98vw); text-align: center; }
    .yg-info {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-dim); margin: 6px 2px; flex-wrap: wrap;
      padding: 8px 10px; background: linear-gradient(90deg, rgba(57,255,20,0.08), rgba(185,103,255,0.06));
      border: 1px solid rgba(57,255,20,0.3); border-radius: 8px;
    }
    .yg-info span:last-child { font-family: var(--font-pixel); color: var(--neon-yellow); }
    .yg-daily { font-size: 11px; padding: 4px 10px; }
    .yg-board {
      position: relative; height: 480px; margin: 10px auto;
      background: radial-gradient(circle at 50% 30%, rgba(57,255,20,0.07), rgba(10,10,18,0.4));
      border: 1px solid rgba(57,255,20,0.2); border-radius: 14px;
      overflow: hidden;
    }
    .yg-card {
      position: absolute; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; border-radius: 8px; cursor: pointer;
      background: linear-gradient(180deg, #1d2b3f, #131d2e);
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 4px 0 rgba(0,0,0,0.55), 0 6px 12px rgba(0,0,0,0.4);
      transition: transform 0.08s, box-shadow 0.08s;
      padding: 0;
    }
    .yg-card:hover { transform: translateY(-3px); box-shadow: 0 7px 0 rgba(0,0,0,0.55), 0 10px 16px rgba(0,0,0,0.45); border-color: rgba(255,230,0,0.5); }
    .yg-card:active { transform: translateY(0); }
    .yg-slot {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px auto; max-width: 420px;
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 8px;
    }
    .yg-slot.flash { border-color: var(--neon-green); box-shadow: 0 0 14px rgba(57,255,20,0.4); }
    .yg-scell {
      aspect-ratio: 1; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; background: rgba(0,0,0,0.25);
    }
    .yg-scell.has { border-style: solid; border-color: rgba(255,230,0,0.4); background: rgba(255,230,0,0.07); animation: yg-pop 0.18s ease; }
    @keyframes yg-pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
    .yg-actions { display: flex; gap: 10px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
    .yg-actions .btn { min-width: 96px; }
    .yg-msg {
      font-size: 12px; color: var(--text-main); min-height: 22px; text-align: left;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
      padding: 8px; margin: 6px 0;
    }
    @media (max-width: 480px) {
      .yg-board { height: 400px; }
      .yg-card { width: 36px; height: 36px; font-size: 19px; }
      .yg-scell { font-size: 20px; }
    }
