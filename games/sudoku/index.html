    .su-wrap { padding: 14px 10px 22px; width: min(420px, 96vw); text-align: center; }

    .su-pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: fit-content; margin: 0 auto; }
    .su-key { padding: 10px 0; font-family: var(--font-pixel); font-size: 17px; border-radius: 7px; cursor: pointer; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.16); color: var(--text); }
    .su-key:active { transform: translateY(1px); }
    .su-key.erase { color: var(--neon-pink); }
