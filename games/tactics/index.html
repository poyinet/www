  <style>
    .tk-wrap { padding: 12px 10px 20px; width: min(680px, 98vw); text-align: center; }
    .tk-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; margin: 8px 2px; color: var(--text-dim); }
    .tk-top .stat-value { font-family: var(--font-pixel); }
    .tk-msg { min-height: 20px; font-size: 13px; color: var(--neon-pink); margin: 6px 0; line-height: 1.6; }
    .tk-board {
      display: grid; gap: 2px; background: var(--bg-panel);
      border: 1px solid rgba(0,240,255,0.25); border-radius: 10px; padding: 8px;
      margin: 0 auto; width: fit-content; user-select: none; touch-action: manipulation;
    }
    .tk-cell {
      width: var(--tk-cell, 44px); height: var(--tk-cell, 44px); border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 22px; cursor: pointer; position: relative; transition: background 0.12s;
    }
    .tk-cell.empty { background: rgba(20,20,38,0.9); }
    .tk-cell.obstacle { background: rgba(60,55,100,0.5); cursor: default; }
    .tk-cell.hill { background: rgba(40,70,90,0.6); }
    .tk-cell.unit { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); }
    .tk-cell.unit.my { background: rgba(0,240,255,0.18); }
    .tk-cell.unit.enemy { background: rgba(255,45,149,0.16); }
    .tk-cell.sel { box-shadow: inset 0 0 0 3px var(--neon-yellow); z-index: 2; }
    .tk-cell.canmove { background: rgba(0,240,255,0.28); }
    .tk-cell.canatk { background: rgba(255,45,149,0.32); }
    .tk-cell.canmove.canatk { background: linear-gradient(135deg, rgba(0,240,255,0.28), rgba(255,45,149,0.32)); }
    .tk-cell .hpbar {
      position: absolute; left: 3px; right: 3px; bottom: 2px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.15); overflow: hidden;
    }
    .tk-cell .hpbar i { display: block; height: 100%; background: var(--neon-green); }
    .tk-cell .hpbar.low i { background: var(--neon-pink); }
    .tk-cell .emblem { position: absolute; top: 1px; right: 3px; font-size: 9px; color: var(--text-dim); }
    .tk-detail { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 8px 0; font-size: 12px; color: var(--text-dim); min-height: 18px; }
    .tk-detail b { color: var(--neon-cyan); }
    .tk-endturn { margin: 4px auto 8px; }
    .tk-overlay {
      position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
      background: rgba(5,5,12,0.85); padding: 16px;
    }
    .tk-overlay.hidden { display: none; }
    .tk-modal {
      background: var(--bg-panel); border: 1px solid var(--accent, #00f0ff); border-radius: 12px;
      padding: 22px; width: min(400px, 92vw); text-align: center;
      box-shadow: 0 0 30px color-mix(in srgb, var(--accent, #00f0ff) 25%, transparent);
    }
    .tk-modal h2 { font-family: var(--font-pixel); font-size: 16px; margin-bottom: 12px; }
    .tk-modal h2.win { color: var(--neon-green); text-shadow: 0 0 10px rgba(57,255,20,.6); }
    .tk-modal h2.lose { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255,45,149,.6); }
    .tk-modal p { font-size: 13px; color: var(--text-dim); line-height: 1.9; margin-bottom: 14px; }
    .tk-modal p b { color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 12px; }
    @media (max-width: 480px) {
      .tk-cell { width: 34px; height: 34px; font-size: 17px; }
      .tk-board { padding: 6px; gap: 2px; }
      .tk-top { font-size: 11px; }
    }
