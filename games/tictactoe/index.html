  <style>
    .ttt-board {
      display: grid;
      grid-template-columns: repeat(3, min(88px, 26vw));
      gap: 8px;
      justify-content: center;
      margin: 10px auto;
      user-select: none;
    }
    .ttt-cell {
      width: min(88px, 26vw);
      height: min(88px, 26vw);
      font-family: var(--font-pixel);
      font-size: min(38px, 11vw);
      color: var(--text-dim);
      background: var(--bg-panel);
      border: 2px solid rgba(0, 240, 255, 0.25);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .ttt-cell:hover:not(:disabled) {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
    }
    .ttt-cell:disabled { cursor: default; }
    .ttt-cell.x {
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8), 0 0 22px rgba(0, 240, 255, 0.45);
      animation: ttt-pop 0.25s ease-out;
    }
    .ttt-cell.o {
      color: var(--neon-pink);
      text-shadow: 0 0 8px rgba(255, 45, 149, 0.8), 0 0 22px rgba(255, 45, 149, 0.45);
      animation: ttt-pop 0.25s ease-out;
    }
    @keyframes ttt-pop {
      0% { transform: scale(0.3); }
      60% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .ttt-cell.win {
      border-color: var(--neon-yellow);
      animation: ttt-win 0.5s ease-in-out infinite alternate;
    }
    @keyframes ttt-win {
      from { box-shadow: 0 0 8px rgba(255, 230, 0, 0.35); background: rgba(255, 230, 0, 0.05); }
      to { box-shadow: 0 0 24px rgba(255, 230, 0, 0.8); background: rgba(255, 230, 0, 0.16); }
    }
    .mode-btn.active {
      background: var(--neon-cyan);
      color: #04121a;
      text-shadow: none;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
    }
    .mode-btn.pink.active {
      background: var(--neon-pink);
      color: #1a0410;
      box-shadow: 0 0 16px rgba(255, 45, 149, 0.6);
    }
    .mode-btn.purple.active {
      background: var(--neon-purple);
      color: #12041a;
      box-shadow: 0 0 16px rgba(185, 103, 255, 0.6);
    }
  </style>
