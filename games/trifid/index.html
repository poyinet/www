  <style>
    .tf-tabs { flex-wrap: wrap; display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .tf-tab { flex: 1; max-width: 180px; }
    .tf-cube {
      background: linear-gradient(180deg, #1a1a2e, #0d0d18);
      border: 1px solid rgba(0,240,255,0.3); border-radius: 12px;
      padding: 12px; margin: 8px 0; box-shadow: 0 0 20px rgba(0,240,255,0.08);
    }
    .tf-cubelbl { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; text-align: center; }
    .tf-layer { display: flex; justify-content: center; align-items: center; margin: 4px 0; }
    .tf-cube-cell {
      font-family: var(--font-pixel); font-size: 13px; width: 26px; height: 26px; line-height: 26px;
      text-align: center; margin: 2px; border-radius: 5px; color: var(--neon-cyan);
      background: rgba(0,240,255,0.07); border: 1px solid rgba(0,240,255,0.25);
    }
    .tf-cube-gap { width: 8px; }
    .tf-layerlbl { font-size: 9px; color: var(--text-dim); margin-left: 6px; }
    .tf-hint { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 8px 0; text-align: left; }
    .tf-hint b { color: var(--neon-purple); }
    .tf-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin: 6px 2px; flex-wrap: wrap; gap: 6px; }
    .tf-row { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    .tf-lbl { font-size: 12px; color: var(--text-dim); }
    .tf-row input {
      font-family: var(--font-pixel); font-size: 14px; letter-spacing: 2px; text-align: center; text-transform: uppercase;
      padding: 9px; width: min(260px, 70%); background: var(--bg-panel-2); color: var(--text-main);
      border: 1px solid rgba(185,103,255,0.4); border-radius: 8px; outline: none;
    }
    .tf-cipher {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 2px; color: var(--neon-pink);
      background: rgba(255,45,149,0.06); border: 1px solid rgba(255,45,149,0.3); border-radius: 8px;
      padding: 10px; margin: 6px 0; text-shadow: 0 0 8px rgba(255,45,149,.4); word-break: break-all;
    }
    .tf-math { font-size: 11px; color: var(--text-dim); line-height: 1.9; margin: 6px 0; word-break: break-all; text-align: left; }
    .tf-keyline { font-size: 12px; color: var(--text-main); margin: 8px 0; line-height: 2.2; }
    .tf-keyline b { color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 13px; }
    .tf-cands { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
    .tf-cand {
      font-family: var(--font-pixel); font-size: 11px; width: 34px; padding: 8px 0; border-radius: 5px;
      border: 1px solid rgba(0,240,255,0.4); color: var(--neon-cyan); background: rgba(0,240,255,0.06); cursor: pointer;
    }
    .tf-cand:hover { background: rgba(0,240,255,0.15); }
    .tf-slots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 6px 0; }
    .tf-slot {
      font-family: var(--font-pixel); font-size: 15px; width: 40px; height: 40px; border-radius: 6px;
      border: 1px solid rgba(255,230,0,0.5); color: var(--neon-yellow); background: rgba(255,230,0,0.08); cursor: pointer;
    }
    .tf-prev {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 1px; color: var(--neon-green);
      background: rgba(57,255,20,0.05); border: 1px solid rgba(57,255,20,0.25); border-radius: 8px;
      padding: 10px; margin: 8px 0; word-break: break-all; text-align: left;
    }
    @media (max-width: 480px) {
      .tf-cube-cell { width: 22px; height: 22px; line-height: 22px; font-size: 11px; }
      .tf-cipher { font-size: 11px; }
      .tf-cand { width: 30px; padding: 7px 0; }
      .tf-slot { width: 36px; height: 36px; }
    }
