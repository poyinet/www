  <style>
    .vn-wrap { padding: 14px 10px 24px; width: min(720px, 98vw); text-align: center; }
    .vn-info {
      display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim);
      margin: 6px 2px; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px 10px; background: linear-gradient(90deg, rgba(255,45,149,0.08), rgba(0,240,255,0.06));
      border: 1px solid rgba(255,45,149,0.3); border-radius: 8px;
    }
    .vn-diffs { display: flex; flex-wrap: wrap; gap: 6px; }
    .vn-flavor { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 8px 0; text-align: left; }
    .vn-cipher {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 2px;
      background: rgba(255,45,149,0.06); border: 1px solid rgba(255,45,149,0.3); border-radius: 8px;
      padding: 10px; margin: 6px 0; text-align: left;
    }
    .vn-cipherline { word-break: break-all; color: var(--neon-pink); margin: 3px 0; text-shadow: 0 0 8px rgba(255,45,149,.3); }
    .vn-cl { display: inline-block; width: 56px; font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
    .vn-lbl { font-size: 11px; color: var(--text-dim); margin: 10px 0 4px; text-align: left; }
    .vn-cribs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 6px 0; }
    .vn-crib {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 2px; padding: 8px 14px;
      border-radius: 8px; border: 1px solid rgba(57,255,20,0.4); color: var(--neon-green);
      background: rgba(57,255,20,0.06); cursor: pointer;
    }
    .vn-crib.sel { border-color: var(--neon-yellow); color: var(--neon-yellow); background: rgba(255,230,0,0.1); }
    .vn-scan {
      font-size: 12px; color: var(--text-main); min-height: 24px; text-align: left;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
      padding: 8px; margin: 6px 0;
    }
    .vn-cand {
      display: block; width: 100%; text-align: left; font-family: var(--font-pixel); font-size: 11px;
      padding: 7px 10px; margin: 3px 0; border-radius: 6px; color: var(--neon-cyan);
      border: 1px solid rgba(0,240,255,0.3); background: rgba(0,240,255,0.05); cursor: pointer;
    }
    .vn-cand:hover { background: rgba(0,240,255,0.13); }
    .vn-reveal {
      font-family: var(--font-pixel); font-size: 15px; letter-spacing: 1px; text-align: left;
      background: rgba(57,255,20,0.04); border: 1px solid rgba(57,255,20,0.2); border-radius: 8px;
      padding: 10px; margin: 5px 0; word-break: break-all;
    }
    .vn-rl { display: inline-block; width: 56px; font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
    .vn-ch { color: var(--text-dim); display: inline-block; min-width: 14px; text-align: center; }
    .vn-ch.on { color: var(--neon-green); text-shadow: 0 0 8px rgba(57,255,20,.5); }
    .vn-sp { display: inline-block; min-width: 18px; }
    @media (max-width: 480px) {
      .vn-cipher, .vn-reveal { font-size: 12px; }
      .vn-cand { font-size: 10px; }
