<link rel="stylesheet" href="../../assets/css/theme.css">
  <style>.seo-h1{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}</style>

  <style>
    .wk-wrap { padding: 14px 10px 24px; width: min(760px, 98vw); text-align: center; }
    .wk-tabs { flex-wrap: wrap; display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .wk-tab { flex: 1; max-width: 200px; }
    .wk-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin: 6px 2px; flex-wrap: wrap; gap: 6px; align-items: center; }
    .wk-hint { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 6px 0; text-align: left; }
    .wk-hint b { color: var(--neon-purple); }
    .wk-dim { font-size: 11px; color: var(--text-dim); line-height: 1.7; margin: 6px 0; word-break: break-all; }
    .wk-lbl { font-size: 11px; color: var(--text-dim); margin: 8px 0 4px; }
    .wk-cipher {
      font-family: var(--font-pixel); font-size: 13px; letter-spacing: 2px; color: var(--neon-pink);
      background: rgba(255,45,149,0.06); border: 1px solid rgba(255,45,149,0.3); border-radius: 8px;
      padding: 10px; margin: 6px 0; text-shadow: 0 0 8px rgba(255,45,149,.4); word-break: break-all;
    }
    .wk-chart { display: flex; gap: 3px; justify-content: center; align-items: flex-end; height: 62px; margin: 8px 0 2px; }
    .wk-bar { flex: 1; max-width: 22px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .wk-barfill { width: 100%; background: linear-gradient(180deg, var(--neon-cyan), rgba(0,240,255,0.3)); border-radius: 2px 2px 0 0; min-height: 1px; }
    .wk-barletter { font-family: var(--font-pixel); font-size: 9px; color: var(--neon-cyan); line-height: 1; margin-top: 2px; }
    .wk-barcnt { font-size: 8px; color: var(--text-dim); line-height: 1; }
    .wk-ref { font-size: 10px; color: var(--text-dim); margin: 2px 0 6px; }
    .wk-ref b { color: var(--neon-yellow); }
    .wk-map { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; margin: 6px 0; }
    .wk-tile {
      font-family: var(--font-pixel); font-size: 11px; padding: 5px 0; border-radius: 6px;
      border: 1px solid rgba(185,103,255,0.4); background: rgba(0,0,0,0.3); color: var(--text-main);
      cursor: pointer; line-height: 1.5;
    }
    .wk-tile span { display: block; font-size: 8px; color: var(--text-dim); }
    .wk-tile.sel { border-color: var(--neon-yellow); background: rgba(255,230,0,0.12); box-shadow: 0 0 8px rgba(255,230,0,0.4); }
    .wk-strip { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; margin: 4px 0 8px; }
    .wk-striptile {
      font-family: var(--font-pixel); font-size: 11px; width: 30px; padding: 4px 0; border-radius: 5px;
      border: 1px solid rgba(57,255,20,0.35); background: rgba(0,0,0,0.3); color: var(--neon-green); cursor: pointer;
    }
    .wk-striptile.clr { width: auto; padding: 4px 8px; font-size: 10px; color: var(--neon-pink); border-color: rgba(255,45,149,0.4); }
    .wk-words { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; font-size: 12px; color: var(--text-dim); margin: 4px 0; }
    .wk-word {
      font-family: var(--font-pixel); font-size: 14px; letter-spacing: 2px; padding: 6px 10px; border-radius: 6px;
      border: 1px solid rgba(0,240,255,0.4); color: var(--neon-cyan); background: rgba(0,240,255,0.06); cursor: pointer;
    }
    .wk-match {
      font-family: var(--font-pixel); font-size: 12px; letter-spacing: 1px; padding: 4px 8px; border-radius: 5px;
      border: 1px solid rgba(57,255,20,0.4); color: var(--neon-green); background: rgba(57,255,20,0.08); cursor: pointer;
    }
    .wk-preview {
      font-family: var(--font-pixel); font-size: 14px; letter-spacing: 2px; line-height: 2; color: var(--neon-green);
      background: rgba(57,255,20,0.05); border: 1px solid rgba(57,255,20,0.25); border-radius: 8px;
      padding: 10px; margin: 8px 0; word-break: break-all; text-align: left;
    }
    .wk-pv { color: var(--neon-green); }
    .wk-pv.unknown { color: var(--text-dim); }
    .wk-patline { font-size: 12px; color: var(--neon-yellow); line-height: 2; margin: 4px 0; min-height: 18px; word-break: break-all; }
    .wk-row { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    .wk-row input {
      font-family: var(--font-pixel); font-size: 15px; letter-spacing: 3px; text-align: center; text-transform: uppercase;
      padding: 10px; width: min(320px, 82%); background: var(--bg-panel-2); color: var(--text-main);
      border: 1px solid rgba(185,103,255,0.4); border-radius: 8px; outline: none;
    }
    .wk-result {
      font-family: var(--font-pixel); font-size: 12px; line-height: 1.9; color: var(--neon-yellow);
      background: rgba(255,230,0,0.05); border: 1px solid rgba(255,230,0,0.25); border-radius: 8px;
      padding: 10px; margin: 6px 0; min-height: 20px; text-align: left; word-break: break-all;
    }
    .wk-icrow { display: flex; gap: 4px; justify-content: center; align-items: flex-end; height: 54px; margin: 6px 0; }
    .wk-ic { flex: 1; max-width: 26px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
    .wk-icfill { width: 100%; background: linear-gradient(180deg, var(--neon-purple), rgba(185,103,255,0.3)); border-radius: 2px 2px 0 0; min-height: 1px; }
    .wk-ic.best .wk-icfill { background: linear-gradient(180deg, var(--neon-yellow), rgba(255,230,0,0.4)); box-shadow: 0 0 8px rgba(255,230,0,0.5); }
    .wk-ic { font-family: var(--font-pixel); font-size: 9px; color: var(--text-dim); }
    .wk-ic.best { color: var(--neon-yellow); }
    .wk-keyline { font-size: 12px; color: var(--text-dim); margin: 8px 0; line-height: 2.2; }
    .wk-ktile {
      font-family: var(--font-pixel); font-size: 15px; width: 34px; height: 30px; margin: 2px; border-radius: 6px;
      border: 1px solid rgba(0,240,255,0.45); color: var(--neon-cyan); background: rgba(0,240,255,0.08); cursor: pointer;
    }
    .wk-ktile.static { cursor: default; border-color: rgba(185,103,255,0.5); color: var(--neon-purple); background: rgba(185,103,255,0.08); }
    .wk-meter { display: inline-block; width: 90px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; vertical-align: middle; overflow: hidden; }
    .wk-meterfill { display: block; height: 100%; background: linear-gradient(90deg, var(--neon-pink), var(--neon-yellow), var(--neon-green)); }
    .wk-col {
      font-family: var(--font-pixel); font-size: 11px; padding: 6px 8px; margin: 3px; border-radius: 6px;
      border: 1px solid rgba(185,103,255,0.45); color: var(--neon-purple); background: rgba(185,103,255,0.08); cursor: pointer;
    }
    .wk-col small { color: var(--text-dim); }
    .wk-offset {
      font-family: var(--font-pixel); font-size: 11px; padding: 6px 10px; margin: 3px; border-radius: 6px;
      border: 1px solid rgba(57,255,20,0.45); color: var(--neon-green); background: rgba(57,255,20,0.08); cursor: pointer;
    }
    .wk-tri {
      font-family: var(--font-pixel); color: var(--neon-cyan); background: rgba(0,240,255,0.1);
      border: 1px solid rgba(0,240,255,0.35); border-radius: 4px; padding: 1px 5px; margin: 0 3px;
    }
    @media (max-width: 480px) {
      .wk-map { grid-template-columns: repeat(7, 1fr); }
      .wk-cipher { font-size: 11px; }
      .wk-striptile { width: 27px; }
    }
  </style>
</head>
