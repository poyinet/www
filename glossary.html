  <script>
    /* 术语数据：term=英文术语 / zh=中文 / zhDef / enDef */
    window.GLOSSARY = [
      /* ---------- 基础概念 ---------- */
      { cat: 'basic', term: 'Plaintext', zh: '明文', zhDef: '加密前的原始文字。', enDef: 'The original readable text before encryption.' , chapters: ['caesar']},
      { cat: 'basic', term: 'Ciphertext', zh: '密文', zhDef: '加密后无法直接读懂的文本。', enDef: 'The scrambled text produced by encryption.' , chapters: ['caesar']},
      { cat: 'basic', term: 'Key', zh: '密钥', zhDef: '控制加密/解密方式的一串秘密参数。', enDef: 'A secret parameter that controls how encryption and decryption work.' , chapters: ['caesar']},
      { cat: 'basic', term: 'Cipher', zh: '密码（算法）', zhDef: '改变字母或比特的加密算法，区别于替换整词的 code（编码表）。', enDef: 'An algorithm that scrambles letters or bits; distinct from a code, which replaces whole words.' },
      { cat: 'basic', term: 'Code', zh: '编码（表）', zhDef: '用代号（如词、数字）替换整词整句的系统。', enDef: 'A system that replaces whole words or phrases with codenames or numbers.' },
      { cat: 'basic', term: 'Cryptanalysis', zh: '密码分析', zhDef: '不靠密钥、凭密文本身破解密码的科学。', enDef: 'The science of breaking ciphers from the ciphertext alone, without the key.' , chapters: ['arab']},
      { cat: 'basic', term: 'Cryptography', zh: '密码学', zhDef: '研究加密与解密技术的学科。', enDef: 'The study and practice of encryption and decryption.' , chapters: ['dawn']},
      { cat: 'basic', term: 'Steganography', zh: '隐写术', zhDef: '把秘密藏进普通载体（文字/图片）里，隐藏的是「信息存在」这一事实本身。', enDef: 'Hiding a secret inside an innocent carrier — hiding the very fact that a secret exists.', game: 'acrostic', chapters: ['bacon']},

      /* ---------- 古典密码 ---------- */
      { cat: 'classical', term: 'Caesar Cipher', zh: '凯撒密码', zhDef: '把字母表整体平移固定位数（凯撒用 3）的替换密码。', enDef: 'A substitution cipher shifting the alphabet by a fixed number (Caesar used 3).' , game: 'caesar', chapters: ['caesar']},
      { cat: 'classical', term: 'Substitution', zh: '替换密码', zhDef: '每个字母按固定规则换成另一个字母。', enDef: 'Each letter is replaced by another according to a fixed rule.' , game: 'substitution', chapters: ['caesar','arab']},
      { cat: 'classical', term: 'Transposition', zh: '换位密码', zhDef: '字母不变，只改变它们的排列顺序（如栅栏密码）。', enDef: 'The letters stay the same but are rearranged (as in the rail fence).' },
      { cat: 'classical', term: 'Rail Fence', zh: '栅栏密码', zhDef: '把明文按锯齿形写进多行，再逐行读出，是最朴素的换位密码。', enDef: 'Plaintext is written in a zigzag across rows, then read off row by row — the plainest transposition.' , game: 'railfence', chapters: ['ww1']},
      { cat: 'classical', term: 'Affine Cipher', zh: '仿射密码', zhDef: '凯撒的升级版：先乘一个数再加一个数（E=ax+b mod 26）。', enDef: 'An upgrade of Caesar: multiply by a, then add b (E = ax+b mod 26).' , game: 'affine', chapters: ['caesar']},
      { cat: 'classical', term: 'Vigenère', zh: '维吉尼亚密码', zhDef: '用密钥逐字母决定用哪张字母表，让频率分析失效的多表替换密码。', enDef: 'A polyalphabetic cipher: the key chooses a fresh alphabet per letter, defeating frequency analysis.' , game: 'vigenere', chapters: ['bacon','bletchley']},
      { cat: 'classical', term: 'Playfair', zh: 'Playfair 密码', zhDef: '5×5 方阵把字母成对加密的英军野战密码。', enDef: 'A digraph cipher on a 5×5 square, used by the British Army.' , game: 'playfair', chapters: ['ww1','midway']},
      { cat: 'classical', term: 'ADFGVX', zh: 'ADFGVX 密码', zhDef: '德军一战的终极密码：6×6 方阵替换 + 密钥列换位的双层加密。', enDef: 'Germany\'s WWI ultimate: a 6×6 Polybius substitution plus keyed columnar transposition.' , game: 'adfgvx', chapters: ['ww1']},
      { cat: 'classical', term: 'Enigma', zh: '恩尼格玛', zhDef: '德军二战转子机：转子 + 插线板，加密等于解密的奇妙对称；曾被认为不可破译，最终被波兰与英国密码学家攻破。', enDef: 'The German WWII rotor machine: rotors plus plugboard, with the eerie symmetry that encrypting equals decrypting. Once thought unbreakable, it was broken by Polish and British cryptanalysts.' , game: 'enigma', chapters: ['bletchley']},
      { cat: 'classical', term: 'Bombe', zh: '炸弹机（Bombe）', zhDef: '图灵与韦尔奇曼设计的机电筛选机，用已知明文（crib）快速排除不可能的转子设置，大幅缩短破译时间。', enDef: 'The electromechanical sieve designed by Turing and Welchman that used cribs to eliminate impossible rotor settings at speed.' , game: 'bombe', chapters: ['bletchley']},
      { cat: 'classical', term: 'Purple', zh: '紫密（Purple）', zhDef: '日本最高外交密码机：元音路与辅音路分路置换的步进开关。', enDef: 'Japan\'s top diplomatic machine: stepping switches splitting vowels and consonants into separate paths.' , game: 'purple', chapters: ['purple']},
      { cat: 'classical', term: 'JN-25', zh: 'JN-25 密码', zhDef: '日本海军密码：码本 + 每日加表双重加密，美军靠「深度」破译。', enDef: 'The Japanese Navy cipher: codebook plus daily additive; broken by US depth analysis.' , game: 'jn25', chapters: ['midway']},

      /* ---------- 破译方法 ---------- */
      { cat: 'methods', term: 'Frequency Analysis', zh: '频率分析', zhDef: '统计字母出现次数，与语言自然频率对照来破译——肯迪 850 年发明。', enDef: 'Counting letter frequencies and matching them to the language\'s norms — invented by Al-Kindi c. 850.' , game: 'freq', chapters: ['dawn','arab','venona']},
      { cat: 'methods', term: 'Crib', zh: '已知明文（Crib）', zhDef: '猜测密文中必然存在的片段（如固定称呼），当破译钩子。', enDef: 'A guessed fragment of plaintext (like a fixed greeting) used as a hook into the cipher.' , game: 'enigma', chapters: ['bletchley']},
      { cat: 'methods', term: 'Known-Plaintext Attack', zh: '已知明文攻击', zhDef: '手握明文-密文对应片段反推密钥或系统。', enDef: 'Recovering the key or system from a known plaintext-ciphertext pair.' , game: 'workshop', chapters: ['bletchley','lorenz']},
      { cat: 'methods', term: 'Depth', zh: '深度（Depth）', zhDef: '两封共享同一天加表/同一密钥的电文相减，让密钥抵消。', enDef: 'Two messages sharing the same day\'s additive or key; subtracting them cancels the key.' , game: 'jn25', chapters: ['midway']},
      { cat: 'methods', term: 'Kasiski Test', zh: 'Kasiski 检验', zhDef: '找出密文中重复片段，推断维吉尼亚密钥长度的方法。', enDef: 'Finding repeated fragments to estimate the Vigenère key length.' , game: 'codebreak', chapters: ['bacon']},
      { cat: 'methods', term: 'Brute Force', zh: '暴力破解', zhDef: '穷举所有可能的密钥，直到解出通顺明文。', enDef: 'Trying every possible key until readable plaintext emerges.' , game: 'codebreak', chapters: ['caesar','modern']},
      { cat: 'methods', term: 'Known Plaintext', zh: '已知明文', zhDef: '破译者已知的明文片段（与 crib 同义但更宽泛）。', enDef: 'A plaintext fragment the codebreaker already knows (broader than a crib).' },

      /* ---------- 现代密码 ---------- */
      { cat: 'modern', term: 'One-Time Pad (OTP)', zh: '一次性密码本', zhDef: '密钥与明文等长、完全随机、只用一次的密码——香农证明其绝对不可破。', enDef: 'A truly random key as long as the message, used once — Shannon proved it is unbreakable.' , chapters: ['venona']},
      { cat: 'modern', term: 'XOR', zh: '异或', zhDef: '按位比较的运算：相同得 0、不同得 1。现代密码的原子，A⊕K⊕K=A。', enDef: 'The bitwise operation where equal bits give 0 and different bits give 1 — the atom of modern crypto: A⊕K⊕K=A.' , game: 'xor', chapters: ['lorenz','modern']},
      { cat: 'modern', term: 'Entropy', zh: '熵', zhDef: '香农对「信息量/不确定性」的数学度量。', enDef: 'Shannon\'s mathematical measure of information and uncertainty.' , chapters: ['modern']},
      { cat: 'modern', term: 'Perfect Secrecy', zh: '完美保密', zhDef: '密文与明文统计独立——唯一实现方式是 OTP。', enDef: 'Ciphertext statistically independent of plaintext — achievable only with the OTP.' , chapters: ['modern']},
      { cat: 'modern', term: 'Public-Key Crypto', zh: '公钥密码', zhDef: '加密与解密用不同密钥，靠数学难题（如大数分解）保证安全。', enDef: 'Different keys to encrypt and decrypt, secured by hard math problems like factoring.' , chapters: ['modern']},
      { cat: 'modern', term: 'Block Cipher', zh: '分组密码', zhDef: '把明文切成固定大小的块，每块用同一密钥处理（AES/DES）。', enDef: 'Plaintext is cut into fixed-size blocks, each processed with the same key (AES, DES).' , game: 'maker', chapters: ['modern']},
      { cat: 'modern', term: 'HTTPS', zh: 'HTTPS', zhDef: '网页传输加密协议——你现在读这页就在用它。', enDef: 'The encrypted web protocol — you are using it to read this page.' , chapters: ['modern']},
      { cat: 'modern', term: 'Base64', zh: 'Base64', zhDef: '把二进制数据变成可打印文本的编码，现代协议的日常编码表示。', enDef: 'Turning binary data into printable text — the everyday code of modern protocols.' , game: 'base64', chapters: ['modern']},

      /* ---------- 人物与机构 ---------- */
      { cat: 'people', term: 'Bletchley Park', zh: '布莱切利园', zhDef: '二战英国密码破译总部：破解 Enigma 与 Lorenz 的地方。', enDef: 'Britain\'s WWII codebreaking HQ, where Enigma and Lorenz were broken.' , chapters: ['bletchley']},
      { cat: 'people', term: 'Room 40', zh: '40 号房', zhDef: '一战英国海军部密码破译室，破译齐默尔曼电报。', enDef: 'Britain\'s WWI naval codebreaking room; it broke the Zimmermann Telegram.' , chapters: ['ww1']},
      { cat: 'people', term: 'Colossus', zh: 'Colossus（巨像计算机）', zhDef: '弗劳尔斯造的世界第一台可编程电子计算机，用于高速统计分析破译德国洛伦兹（Tunny）密码，标志着密码破译进入电子计算机时代。', enDef: 'Flowers\' world-first programmable electronic computer, built for high-speed statistical analysis that broke the German Lorenz (Tunny) cipher, ushering cryptanalysis into the electronic age.' , chapters: ['lorenz']},
      { cat: 'people', term: 'SIS', zh: 'SIS（陆军信号情报处）', zhDef: '美国陆军信号情报处，弗里德曼团队破解紫密的地方。', enDef: 'The US Army Signal Intelligence Service, where Friedman\'s team broke Purple.' , chapters: ['purple']},

      /* ---------- 隐写与编码 ---------- */
      { cat: 'encoding', term: 'Bacon\'s Biliteral', zh: '培根双字体', zhDef: '用两种字形的差异，把 5 位 A/B 码藏进普通散文——二进制的先声。', enDef: 'Hiding 5-bit A/B codes in ordinary prose via two typefaces — an early glimpse of binary.', game: 'bacon' },
      { cat: 'encoding', term: 'Morse Code', zh: '摩斯电码', zhDef: '用点划组合编码字母，电报时代的通用语言。', enDef: 'Encoding letters as dots and dashes — the lingua franca of the telegraph age.' , game: 'morse', chapters: ['bacon','ww1','midway','purple']},
      { cat: 'encoding', term: 'Baudot Code', zh: '博多码', zhDef: '5 比特的电传码，Tunny 密文的底层字母表。', enDef: 'The 5-bit teleprinter code underlying Tunny ciphertext.' , game: 'lorenz', chapters: ['lorenz']},
      { cat: 'encoding', term: 'Polybius Square', zh: '波利比奥斯方阵', zhDef: '把字母放进方格，用行列坐标表示——ADFGVX 的底层。', enDef: 'Letters placed in a grid and addressed by row-column coordinates — the basis of ADFGVX.' , game: 'adfgvx', chapters: ['ww1']},
      { cat: 'basic', term: 'Decryption', zh: '解密', zhDef: '用密钥把密文还原成明文的过程。', enDef: 'Restoring plaintext from ciphertext using the key.' },
      { cat: 'basic', term: 'Encryption', zh: '加密', zhDef: '用密钥把明文变成密文的过程。', enDef: 'Turning plaintext into ciphertext using the key.' },
      { cat: 'classical', term: 'Bifid Cipher', zh: 'Bifid 密码', zhDef: '把字母换成 5×5 方格坐标再重组的分块密码。', enDef: 'Letters become grid coordinates, then get shuffled — a blocky substitution.', game: 'bifid' },
      { cat: 'classical', term: 'Trifid Cipher', zh: 'Trifid 密码', zhDef: '3×3×3 立体分块：替换与换位的三维合流。', enDef: 'A 3×3×3 cubic block cipher mixing substitution and transposition.', game: 'trifid' },
      { cat: 'classical', term: 'Hill Cipher', zh: '希尔密码', zhDef: '用密钥矩阵对字母向量做线性变换的分组密码。', enDef: 'A block cipher multiplying letter vectors by a key matrix.', game: 'hill' , chapters: ['modern']},
      { cat: 'classical', term: 'Nihilist Cipher', zh: '虚无主义者密码', zhDef: '波利比奥斯坐标 + 密钥数字逐位相加的俄罗斯古典密码。', enDef: 'A Russian classical cipher: Polybius coordinates plus key digits.' },
      { cat: 'classical', term: 'One-Time Pad History', zh: '一次性密码本（史）', zhDef: '1917 年 Vernam 发明，用穿孔纸带做密钥流。', enDef: 'Invented by Vernam in 1917 using punched tape key streams.', game: 'venona' },
      { cat: 'methods', term: 'Chosen-Plaintext Attack', zh: '选择明文攻击', zhDef: '攻击者能挑选明文并拿到对应密文。', enDef: 'The attacker can choose plaintext and obtain its ciphertext.' },
      { cat: 'methods', term: 'Birthday Attack', zh: '生日攻击', zhDef: '利用生日悖论在哈希/碰撞中加速搜索。', enDef: 'Exploiting the birthday paradox to speed up collision search.' },
      { cat: 'methods', term: 'Man-in-the-Middle', zh: '中间人攻击', zhDef: '攻击者同时冒充通信双方，截听或篡改信息。', enDef: 'An attacker impersonates both parties to intercept or alter traffic.' },
      { cat: 'methods', term: 'Traffic Analysis', zh: '流量分析', zhDef: '不读内容，仅凭报文数量/方向/时机推断情报。', enDef: 'Inferring intelligence from message volume, direction and timing without reading them.' },
      { cat: 'modern', term: 'Symmetric Key', zh: '对称密钥', zhDef: '加密与解密用同一把密钥（如 AES、凯撒）。', enDef: 'One key encrypts and decrypts (AES, Caesar).' },
      { cat: 'modern', term: 'Asymmetric Key', zh: '非对称密钥', zhDef: '加密与解密用不同密钥（公钥/私钥）。', enDef: 'Different keys to encrypt and decrypt (public/private).' },
      { cat: 'modern', term: 'Digital Signature', zh: '数字签名', zhDef: '用私钥签名的数据，公钥可验证来源与完整性。', enDef: 'Data signed with a private key, verifiable by anyone with the public key.' },
      { cat: 'modern', term: 'AES', zh: 'AES 加密', zhDef: '高级加密标准：2001 年 NIST 选定的对称分组密码（Rijndael），128 位分组、128/192/256 位密钥，取代 DES，是当今应用最广的加密算法。', enDef: 'The Advanced Encryption Standard: a symmetric block cipher (Rijndael) standardized by NIST in 2001, encrypting 128-bit blocks with 128/192/256-bit keys. It replaced DES and is the de facto standard of modern encryption.' },
      { cat: 'modern', term: 'RSA', zh: 'RSA 算法', zhDef: '1977 年公开密钥算法，靠大数分解难题保证安全。', enDef: 'The 1977 public-key algorithm secured by the factoring problem.', game: 'rsa' },
      { cat: 'encoding', term: 'Steganographic Image', zh: '图像隐写', zhDef: '把信息藏在像素的最低有效位等隐蔽处。', enDef: 'Hiding data in the least significant bits of pixels.' },
      { cat: 'encoding', term: 'Caesar Box', zh: '凯撒方阵', zhDef: '把明文按行写入方阵再按列读出（换位）。', enDef: 'Writing plaintext into a grid by rows, reading out by columns.' },
      { cat: 'modern', term: 'Data Encryption Standard (DES)', zh: '数据加密标准', zhDef: '数据加密标准。IBM 于 1970 年代设计的对称分组密码，56 位密钥、64 位分组，曾主导商用加密数十年；因密钥过短易被暴力破解，现已被 AES 取代。', enDef: 'A symmetric block cipher developed by IBM in the 1970s that became the first standardized encryption algorithm. Using a 56-bit key on 64-bit blocks, it dominated commercial encryption for decades but is now obsolete due to brute-force vulnerability.' },
      { cat: 'modern', term: 'Feistel Network', zh: '费斯妥网络', zhDef: '费斯妥网络。一种分组密码结构：数据分左右两半，每轮用轮函数处理一半并与另一半异或后交换；解密只需反向执行、无需逆函数，DES 是典型代表。', enDef: 'A structure for building block ciphers in which data is split into halves and each round applies a keyed function to one half, XORs the result into the other, then swaps them. Decryption reuses the same operations in reverse order, so the round function need not be invertible; DES is the classic example.' },
      { cat: 'modern', term: 'Substitution-Permutation Network (SPN)', zh: '代换-置换网络', zhDef: '代换-置换网络。现代分组密码的通用结构：多轮交替执行代换层（S 盒打乱字节）与置换层（P 层扩散比特），兼顾混淆与扩散，AES 即采用此结构。', enDef: 'The dominant modern block-cipher construction, alternating substitution layers (S-boxes) that scramble bytes with permutation layers that spread bits across the block. Repeating these rounds achieves both confusion and diffusion; AES is the canonical SPN cipher.' },
      { cat: 'modern', term: 'Elliptic Curve Cryptography (ECC)', zh: '椭圆曲线密码', zhDef: '椭圆曲线密码。基于椭圆曲线离散对数难题的公钥密码体制，同等安全强度下密钥比 RSA 短得多，适合移动设备等资源受限场景。', enDef: 'A public-key cryptosystem whose security rests on the elliptic-curve discrete logarithm problem. It offers comparable security to RSA with much shorter keys, making it efficient for mobile and constrained devices.' },
      { cat: 'modern', term: 'Symmetric Cryptography', zh: '对称密码', zhDef: '对称密码。加密与解密使用同一把密钥的体制，速度快、适合大量数据；但密钥须通过安全渠道事先共享，典型算法有 AES、ChaCha20。', enDef: 'A cryptosystem in which encryption and decryption use the same secret key. It is fast and suitable for bulk data, but requires the key to be shared securely beforehand; AES and ChaCha20 are typical examples.' },
      { cat: 'modern', term: 'Asymmetric Cryptography', zh: '非对称密码', zhDef: '非对称密码（公钥密码）。使用一对数学相关但无法互推的密钥：公钥公开用于加密，私钥保密用于解密，解决了密钥分发难题，如 RSA、ECC。', enDef: 'A cryptosystem using a mathematically linked key pair: a public key for encryption and a private key for decryption, where one cannot feasibly be derived from the other. It solves key distribution and enables digital signatures; RSA and ECC are examples.' },
      { cat: 'modern', term: 'Cryptographic Hash', zh: '密码学哈希', zhDef: '密码学哈希。满足安全性质的哈希函数：单向不可逆、难以找到碰撞、输出看似随机；区别于普通校验和，须能抵抗恶意构造，是安全协议的核心组件。', enDef: 'A hash function meeting cryptographic security properties: preimage resistance, collision resistance, and avalanche behavior. Unlike ordinary checksums, it must withstand adversarial input, making it a core component of signatures, MACs, and integrity verification.' },
      { cat: 'modern', term: 'Salt (Cryptography)', zh: '盐', zhDef: '盐。口令哈希前附加的随机数据，使相同口令产生不同哈希值，防止彩虹表攻击与跨站哈希比对，显著提升口令存储安全性。', enDef: 'Random data prepended or appended to a password before hashing so that identical passwords yield different digests. Salting defeats rainbow-table attacks and cross-site password correlation, greatly improving stored-password security.' },
      { cat: 'modern', term: 'Initialization Vector (IV)', zh: '初始化向量', zhDef: '初始化向量。分组密码在 CBC 等链式模式下使用的随机起始值；不保密但须不可预测，确保相同明文在不同加密中产生不同密文。', enDef: 'A random initial value used by block ciphers in chaining modes such as CBC. Unlike the key it need not be secret, but it must be unpredictable, ensuring that identical plaintexts encrypt to different ciphertexts each time.' },
      { cat: 'modern', term: 'Block Cipher Mode (ECB/CBC/GCM)', zh: '分组密码工作模式', zhDef: '分组密码工作模式。规定如何用分组加密处理长数据：ECB 各块独立加密但泄露模式，CBC 逐块链接并需 IV，GCM 同时提供加密与认证，推荐使用。', enDef: 'Rules for encrypting data longer than one block with a block cipher. ECB encrypts blocks independently but leaks patterns; CBC chains blocks with an IV; GCM combines encryption with authentication and is the recommended modern choice.' },
      { cat: 'modern', term: 'Quantum Cryptography', zh: '量子密码', zhDef: '量子密码。利用量子力学原理（如不可克隆定理）保证安全的密码技术，典型是量子密钥分发（QKD），理论上可证明安全，但工程实现仍有挑战。', enDef: 'Cryptographic techniques built on quantum mechanics, notably quantum key distribution (QKD), which exploits properties such as the no-cloning theorem to detect eavesdropping. It offers provable security in theory, though practical deployment faces engineering challenges.' },
      { cat: 'methods', term: 'Differential Cryptanalysis', zh: '差分密码分析', zhDef: '差分密码分析。分析成对明文的固定差异在加密轮间传播的规律，统计高概率差分路径以恢复密钥；对 DES 等迭代密码特别有效，推动了密码设计演进。', enDef: 'A chosen-plaintext technique that studies how fixed differences between paired plaintexts propagate through cipher rounds. High-probability differential trails leak key information; it was crucial in breaking DES variants and shaping modern cipher design.' },
      { cat: 'methods', term: 'Linear Cryptanalysis', zh: '线性密码分析', zhDef: '线性密码分析。寻找明文、密文与密钥比特间的线性近似，收集大量明密文对统计偏差来逐位恢复密钥；属已知明文攻击，对 DES 十分有效。', enDef: 'A known-plaintext attack that finds linear approximations relating plaintext, ciphertext, and key bits, then accumulates statistical bias over many pairs to recover key bits one by one. It proved highly effective against DES.' },
      { cat: 'methods', term: 'Rainbow Table', zh: '彩虹表', zhDef: '彩虹表。预计算并压缩存储的「明文-哈希」链集合，用于快速反查哈希得到口令；加盐或使用慢哈希可令其失效，是口令破解的经典加速手段。', enDef: 'A precomputed, compressed table of hash chains that lets an attacker invert a hash to recover a password far faster than brute force. Salting or slow key-derivation functions render rainbow tables ineffective.' },
      { cat: 'methods', term: 'Side-Channel Attack', zh: '侧信道攻击', zhDef: '侧信道攻击。不攻击算法本身，而是利用设备运行时的物理泄露（功耗、电磁辐射、运行时间、缓存行为）推断密钥，常针对智能卡等实现。', enDef: 'An attack that exploits physical leakage from a running device—power consumption, electromagnetic emission, timing, or cache behavior—to infer secret keys, rather than attacking the algorithm\'s mathematics. Smart cards and AES implementations are common targets.' },
      { cat: 'methods', term: 'Timing Attack', zh: '计时攻击', zhDef: '计时攻击。侧信道攻击的一种：通过精确测量操作的耗时差异推断秘密数据，如依解密时间逐位猜测密钥；常数时间实现是常用防御手段。', enDef: 'A side-channel attack that infers secrets from precise differences in operation duration, for example guessing key bits from decryption time. Constant-time implementations are the standard defense.' },
      { cat: 'methods', term: 'Chosen-Ciphertext Attack', zh: '选择密文攻击', zhDef: '选择密文攻击。攻击者可选择任意密文并获取对应解密结果，据此推断密钥或消息；现代公钥加密须在此模型下保持安全（CCA 安全）。', enDef: 'An attack model in which the adversary may choose ciphertexts and obtain their decryptions, using the oracle to deduce keys or plaintexts. Modern public-key encryption is required to remain secure in this model (CCA security).' },
      { cat: 'methods', term: 'Meet-in-the-Middle Attack', zh: '中途相遇攻击', zhDef: '中途相遇攻击。把加密分前后两段，分别从两端计算中间值并比对匹配，能以远低于暴力的代价破解双重加密等结构，2DES 因此不安全。', enDef: 'A technique that splits a cipher into two halves, computes intermediate values from both ends, and matches them to recover keys far faster than brute force. It is why double encryption, such as 2DES, offers little added security.' },
      { cat: 'protocol', term: 'Transport Layer Security (TLS)', zh: '传输层安全协议', zhDef: '传输层安全协议。互联网上最常用的加密协议，为 HTTPS、邮件等提供机密性、完整性与身份认证；通过握手协商密钥，再以对称加密传输数据。', enDef: 'The most widely used protocol for securing Internet communications, protecting HTTPS, email, and other applications with confidentiality, integrity, and authentication. A handshake negotiates keys, after which traffic is encrypted under symmetric ciphers.' },
      { cat: 'protocol', term: 'Public Key Infrastructure (PKI)', zh: '公钥基础设施', zhDef: '公钥基础设施。管理公钥的完整体系：负责证书的签发、分发、验证与吊销，通过信任链让用户可靠获得并验证他人公钥，支撑 HTTPS 等应用。', enDef: 'The complete framework for managing public keys: issuing, distributing, verifying, and revoking digital certificates through a chain of trust. It lets users reliably obtain and validate others\' public keys, underpinning HTTPS and digital signatures.' },
      { cat: 'protocol', term: 'Certificate Authority (CA)', zh: '证书颁发机构', zhDef: '证书颁发机构。PKI 中的可信第三方，核实申请者身份并签发数字证书，用自己的私钥担保公钥归属；浏览器内置其根证书以建立信任链。', enDef: 'A trusted third party in a PKI that verifies an applicant\'s identity and issues digital certificates, vouching for public-key ownership with its own signature. Root certificates embedded in browsers anchor the chain of trust.' },
      { cat: 'protocol', term: 'Digital Envelope', zh: '数字信封', zhDef: '数字信封。混合加密的典型实现：用对称密钥加密消息（快），再用接收方公钥加密该对称密钥；接收方先解出密钥再解密，兼顾速度与安全分发。', enDef: 'A hybrid-encryption construct: the message is encrypted with a fast symmetric key, and that key is sealed with the recipient\'s public key. The recipient unwraps the key first, then decrypts, combining speed with secure key distribution.' },
      { cat: 'protocol', term: 'Key Exchange', zh: '密钥交换', zhDef: '密钥交换。双方在不安全信道上安全协商共享密钥的过程，典型如 Diffie-Hellman 与 ECDH；是建立加密会话的前提，常配合证书防中间人攻击。', enDef: 'The process by which two parties agree on a shared secret key over an insecure channel, classically via Diffie-Hellman or ECDH. It precedes encrypted sessions and is usually authenticated with certificates to prevent man-in-the-middle attacks.' },
      { cat: 'protocol', term: 'End-to-End Encryption', zh: '端到端加密', zhDef: '端到端加密。消息在发送端加密、仅在接收端解密，中间服务器只转发密文而无法读取内容；用于即时通讯与云存储，如 Signal 协议。', enDef: 'A property in which messages are encrypted on the sender\'s device and decrypted only on the recipient\'s, so intermediate servers relay ciphertext they cannot read. It protects messaging and cloud-storage services, as exemplified by the Signal protocol.' },
      { cat: 'protocol', term: 'Zero-Knowledge Proof', zh: '零知识证明', zhDef: '零知识证明。证明者在不泄露任何秘密的前提下向验证者证明某断言为真，如证明「我知道密码」却不透露密码；用于隐私保护与区块链。', enDef: 'A cryptographic method allowing a prover to convince a verifier that a statement is true without revealing any secret information, such as proving knowledge of a password without disclosing it. It underpins privacy systems and blockchains.' },
      { cat: 'protocol', term: 'Homomorphic Encryption', zh: '同态加密', zhDef: '同态加密。允许直接对密文做运算，解密结果恰等于对明文做同样运算的结果，从而可在不泄露数据的情况下完成计算；是隐私计算核心技术，但性能开销大。', enDef: 'Encryption that permits computations directly on ciphertexts, such that decrypting the result matches computing on the plaintexts. It enables processing data without exposing it—central to privacy computing—though at significant performance cost.' },
      { cat: 'protocol', term: 'Post-Quantum Cryptography', zh: '后量子密码', zhDef: '后量子密码。能抵抗量子计算机攻击的密码算法，基于格、编码、多变量等数学难题；与量子密码不同，NIST 已标准化若干算法以备迁移。', enDef: 'Cryptographic algorithms designed to resist quantum-computer attacks, based on hard problems such as lattices, codes, or multivariate equations. Distinct from quantum cryptography, it is being standardized by NIST to prepare for the quantum era.' },
      { cat: 'protocol', term: 'Kerckhoffs\'s Principle', zh: '柯克霍夫原则', zhDef: '柯克霍夫原则。密码体制的安全性应只依赖密钥保密，而非算法保密——即使算法完全公开，只要密钥不泄露系统仍安全；是现代密码设计的基石。', enDef: 'The maxim by Auguste Kerckhoffs that a cryptosystem should remain secure even if everything about it except the key is public. Security must rest entirely on key secrecy rather than on hiding the algorithm—a cornerstone of modern design.' },
      { cat: 'basic', term: 'Authentication', zh: '认证', zhDef: '认证。确认通信对方身份真实性的过程，防止冒充；常用口令、数字证书、多因素认证等手段实现，是安全通信的首要环节。', enDef: 'The process of verifying that a communicating party is who it claims to be, preventing impersonation. It is achieved through passwords, digital certificates, multi-factor methods, and cryptographic mechanisms, and is the first step of secure communication.' },
      { cat: 'basic', term: 'Integrity', zh: '完整性', zhDef: '完整性。保证数据在传输或存储过程中未被篡改的性质；通常用哈希值或消息认证码（MAC）检测任何修改，是信息安全三要素之一。', enDef: 'The property that data has not been altered during transmission or storage. It is typically enforced with hash values or message authentication codes, which reveal any modification; it is one of the three pillars of information security.' },
      { cat: 'basic', term: 'Non-repudiation', zh: '不可否认性', zhDef: '不可否认性。确保发送方无法否认自己发出过某条消息或签署过某份文件；数字签名提供此性质，常用于合同、交易与审计场景。', enDef: 'The property ensuring that a sender cannot deny having sent a message or signed a document. Digital signatures provide non-repudiation, making it essential for contracts, financial transactions, and audit trails.' },
      { cat: 'basic', term: 'Confusion', zh: '混淆', zhDef: '混淆。让密文与密钥的关系极其复杂，使密钥的微小变化导致密文面目全非，增加分析难度；常通过 S 盒等非线性替换实现。', enDef: 'A Shannon design principle making the relationship between ciphertext and key as complex as possible, so that even tiny key changes drastically alter the ciphertext. It is typically realized with nonlinear S-box substitutions.' },
      { cat: 'basic', term: 'Diffusion', zh: '扩散', zhDef: '扩散。让明文的每一位影响密文的许多位，把明文的统计特征分散掩盖；通过置换与线性变换实现，与混淆并称密码设计两大原则。', enDef: 'A Shannon design principle spreading each plaintext bit\'s influence across many ciphertext bits, hiding statistical structure. Implemented via permutations and linear transforms, it complements confusion as one of the two pillars of secure cipher design.' },
      { cat: 'classical', term: 'Two-Square Cipher', zh: '双方形密码', zhDef: '双方形密码。用两个按密钥打乱的波利比奥斯方阵，把明文字母对在两阵中交叉替换成密文对；属双字母替换密码，比单表替换更难破解。', enDef: 'A classical digraph substitution cipher using two keyed Polybius squares. Plaintext letter pairs are replaced by the letters found at the intersections of their rows and columns across the squares, making it harder to break than single-letter substitution.' },
      { cat: 'classical', term: 'Gronsfeld Cipher', zh: '格朗斯费尔德密码', zhDef: '格朗斯费尔德密码。17 世纪德国人 Gronsfeld 发明的古典密码：用数字密钥对明文字母移位，类似维吉尼亚密码但密钥只含数字，属多表替换。', enDef: 'A classical polyalphabetic cipher invented by Gronsfeld in the seventeenth century. It shifts plaintext letters by a numeric key, resembling the Vigenère cipher but using only digits as the key, and is easily broken with modern methods.' },

      { cat: 'people', term: 'NSA', zh: '美国国家安全局', zhDef: '美国国家安全局，负责信号情报搜集、密码分析与破译的中央情报机构，冷战期间主导拦截苏联通信，是世界上最庞大、最神秘的密码机构之一。', enDef: 'The National Security Agency is the U.S. signals intelligence agency responsible for global monitoring, collection, and cryptanalysis of foreign communications. Its Cold War code-breaking work, particularly against Soviet ciphers, shaped modern electronic surveillance and cryptography policy.' },
      { cat: 'people', term: 'GCHQ', zh: '英国政府通信总部', zhDef: '英国政府通信总部，负责监听外国通信并进行密码分析与破译的情报机构，前身是 1919 年成立的政府密码学校（GC&CS），二战后改组为 GCHQ；它在破译德国恩尼格玛密码机中发挥过重要作用。', enDef: 'GCHQ is the United Kingdom\'s intelligence agency for signals intelligence and cryptanalysis. Descended from wartime codebreaking organizations, it intercepted foreign communications and contributed decisively to breaking the German Enigma cipher during World War II.' },
      { cat: 'people', term: 'NIST', zh: '美国国家标准与技术研究院', zhDef: '美国国家标准与技术研究院，负责制定官方密码算法标准的机构，先后通过公开竞赛选定 AES 与 SHA-3，其标准被全球政府与商业系统广泛采用。', enDef: 'NIST is a U.S. federal agency that develops technology standards, including cryptography. Through open competitions it selected the AES block cipher and SHA-3 hash function; its specifications are adopted worldwide by governments and industry to secure communications.' },
      { cat: 'people', term: 'VENONA Project', zh: '维诺纳计划', zhDef: '美英联合实施的秘密破译项目，针对苏联情报机构在二战期间使用的一次一密乱码本，利用乱码本重用漏洞恢复了大量苏联间谍活动情报。', enDef: 'VENONA was a secret U.S.-British project that decrypted Soviet diplomatic and espionage messages from the 1940s. Soviet reuse of one-time pads created exploitable weaknesses, letting analysts recover plaintext and expose Soviet spy networks, including atomic espionage.' },
      { cat: 'methods', term: 'Ciphertext-Only Attack', zh: '唯密文攻击', zhDef: '最困难的密码分析场景，攻击者只能拿到截获的密文，没有对应的明文或密钥信息，只能依靠统计特性、语言规律或算法本身的弱点来尝试破译。', enDef: 'A ciphertext-only attack is the most challenging cryptanalysis scenario, in which the attacker has access only to intercepted ciphertext, with no matching plaintext or key material. Breaking the cipher then relies on statistical properties, linguistic patterns, or structural weaknesses of the algorithm.' },
      { cat: 'methods', term: 'One-Time Pad Reuse', zh: '一次一密重用', zhDef: '一次一密密钥流被重复使用时产生的严重漏洞，攻击者将两段密文异或叠加以抵消密钥，再利用语言规律恢复明文，VENONA 项目正是利用了这一缺陷。', enDef: 'One-time pad reuse occurs when the same random key stream encrypts more than one message, fatally destroying the cipher\'s perfect secrecy. An attacker can XOR the ciphertexts to cancel the key and recover plaintext through language analysis, exactly as exploited by the VENONA project.' },
      { cat: 'modern', term: 'Key Length', zh: '密钥长度', zhDef: '以比特为单位衡量的密钥长度，直接决定密钥空间的大小；现代密码学认为 128 位以上的密钥足以抵御穷举攻击，是评估算法安全性的核心指标。', enDef: 'Key length is the size of a cryptographic key, measured in bits, and it directly determines the size of the key space and thus resistance to brute-force attack. Modern standards treat keys of 128 bits or longer as computationally infeasible to exhaust, making key length a primary security metric.' },
      { cat: 'modern', term: 'Key Space', zh: '密钥空间', zhDef: '某一加密算法所有可能密钥构成的完整集合，其大小由密钥长度决定；密钥空间越大，攻击者穷举所有密钥所需的时间就越长，算法就越安全。', enDef: 'The key space is the complete set of all possible keys that a cipher can use, and its size is determined by the key length. A larger key space forces an attacker to spend exponentially more time trying every possibility, making the cipher more resistant to brute-force attacks.' },

      { cat: 'modern', term: 'RC4', zh: 'RC4 流密码', zhDef: '1987 年 Rivest 设计的软件流密码，把短密钥「拉长」成伪随机密钥流；曾撑起 WEP、早期 TLS 与 WPA，却因密钥流重用和输出偏差频遭攻击，如今已被全面弃用。', enDef: 'A software stream cipher designed by Ron Rivest in 1987 that stretches a short key into a pseudorandom keystream. It powered WEP, early TLS and WPA, but keystream-reuse and bias attacks led to its complete deprecation.', chapters: ['lorenz','modern'] },
      { cat: 'modern', term: 'ChaCha20', zh: 'ChaCha20 流密码', zhDef: '2008 年 Bernstein 在 Salsa20 基础上改进的流密码，纯软件实现飞快、对硬件要求低；TLS 1.3 和 WireGuard 都把它列为默认加密，是当今流密码的当红明星。', enDef: 'A stream cipher designed by Daniel Bernstein in 2008 as an improved variant of his Salsa20. It is extremely fast in pure software and low-power, and is the default cipher in TLS 1.3 and WireGuard.', chapters: ['modern'] },
      { cat: 'modern', term: 'Digital Signature Algorithm (DSA)', zh: 'DSA 数字签名算法', zhDef: '1994 年 NIST 标准化的签名算法，基于离散对数难题、由 ElGamal 签名演化而来；曾是政府与金融系统的标配，如今正被更小更快的 ECDSA 与 EdDSA 取代。', enDef: 'A US federal signature standard from 1994 built on the discrete logarithm problem and derived from ElGamal signatures. Long a government and finance staple, it is giving way to faster ECDSA and EdDSA.', chapters: ['modern'] },
      { cat: 'modern', term: 'ElGamal', zh: 'ElGamal 算法', zhDef: '1985 年 Taher ElGamal 提出：每次加密随机挑一个临时数，同一明文可生成不同密文，安全性基于离散对数难题；既能加密也能签名，启发了后来的一大批体制。', enDef: 'Proposed by Taher ElGamal in 1985: each encryption picks a fresh random value, so the same plaintext yields different ciphertexts. Based on the discrete logarithm problem, it supports both encryption and signatures.', chapters: ['modern'] },
      { cat: 'modern', term: 'Schnorr Signature', zh: 'Schnorr 签名', zhDef: '1989 年 Claus Schnorr 提出的签名：短、快，还能把多人的签名线性合并成一把；因专利 2008 年才到期而长期被冷落，比特币 2021 年 Taproot 升级后正式采用。', enDef: 'A signature scheme by Claus Schnorr (1989) that is short, fast, and allows multiple signatures to be linearly combined into one. Blocked by patent until 2008, it was finally adopted by Bitcoin\'s 2021 Taproot upgrade.', chapters: ['modern'] },
      { cat: 'modern', term: 'Cipher Block Chaining (CBC)', zh: 'CBC 分组模式', zhDef: '每个明文块先与上一块密文异或再加密，让重复的明文块也产出不同的密文；需要不可预测的 IV、解密必须按顺序来，曾是使用最广的分组模式。', enDef: 'A block-cipher mode that XORs each plaintext block with the previous ciphertext block before encrypting, hiding repeating patterns. It needs an unpredictable IV, processes blocks in sequence, and was the classic default.', chapters: ['modern'] },
      { cat: 'modern', term: 'Counter Mode (CTR)', zh: 'CTR 计数器模式', zhDef: '把递增的计数器加密后与明文异或，把分组密码变成流密码；各块完全独立、可并行处理，还能任意位置直接解密，流式传输与磁盘加密都爱它。', enDef: 'A mode that encrypts an incrementing counter and XORs it with plaintext, turning a block cipher into a stream cipher. Blocks are independent and parallelizable, and any position decrypts directly.', chapters: ['modern'] },
      { cat: 'modern', term: 'Galois/Counter Mode (GCM)', zh: 'GCM 认证加密模式', zhDef: 'CTR 加密与 Galois 域乘法认证的组合体，一次运算同时搞定机密性与完整性（AEAD）；TLS 1.2/1.3 的默认配置，现代互联网加密的标配。', enDef: 'An AEAD mode pairing CTR encryption with Galois-field multiplication for authentication, delivering confidentiality and integrity in one pass. It is the default choice in TLS 1.2 and TLS 1.3.', chapters: ['modern'] },
      { cat: 'modern', term: 'Message Authentication Code (MAC)', zh: '消息认证码', zhDef: '用共享密钥给消息算出的短校验标签，接收方重算比对即可发现任何篡改；它保证「消息没被动过」，但证明不了「是谁发的」。', enDef: 'A short tag computed from a message with a shared secret key; recomputing and comparing it reveals any tampering. It proves a message is unchanged, but not who sent it.', game: 'spotdiff', chapters: ['modern'] },
      { cat: 'modern', term: 'HMAC', zh: 'HMAC 消息认证码', zhDef: '1996 年基于哈希函数（如 SHA-256）构造的 MAC，安全性几乎不依赖哈希的实现细节；TLS、JWT、API 签名里到处是它的身影。', enDef: 'A 1996 MAC built on top of a hash function such as SHA-256, whose security barely depends on the hash\'s implementation details. It appears everywhere: TLS, JWT, and API signing.', game: 'spotdiff', chapters: ['modern'] },
      { cat: 'modern', term: 'Key Derivation Function (KDF)', zh: '密钥派生函数', zhDef: '把弱口令、共享秘密或随机种子加工成合格密钥的工序，比如把「密码 + 盐」拉伸成 256 位 AES 密钥；熵不够的材料想变成密钥，全靠它把关。', enDef: 'A function that turns weak material—passwords, shared secrets, random seeds—into properly sized keys, e.g. stretching a password plus salt into a 256-bit AES key. It upgrades low-entropy input into usable key material.', chapters: ['modern'] },
      { cat: 'modern', term: 'bcrypt', zh: 'bcrypt 口令哈希', zhDef: '1999 年基于 Blowfish 分组密码的慢速口令哈希，故意设计成「算得慢」并内置盐，把暴力破解拖到天荒地老；Unix 系系统与众多 Web 框架沿用至今。', enDef: 'A 1999 password hash built on the Blowfish cipher, deliberately slow and with built-in salting to stall brute force. It remains the default in many Unix systems and web frameworks.', chapters: ['modern'] },
      { cat: 'modern', term: 'Argon2', zh: 'Argon2 口令哈希', zhDef: '2015 年密码哈希竞赛冠军，靠「吃内存 + 费 CPU」双重成本拖慢破解；主要变体有抗侧信道的 Argon2i 和通用推荐的 Argon2id。', enDef: 'Winner of the 2015 Password Hashing Competition; it forces attackers to pay in memory and CPU. Argon2i resists side channels, while Argon2id—the recommended default—combines both strengths.', chapters: ['modern'] },
      { cat: 'modern', term: 'Pseudorandom Function (PRF)', zh: '伪随机函数', zhDef: '输入任意数据、输出看似随机结果的函数，不知道密钥的人无法把它与真随机函数区分；HMAC 是标准例子，分组密码也常被当 PRF 用。', enDef: 'A function whose outputs look random to anyone without the key, indistinguishable from a truly random function. HMAC is the classic example, and block ciphers double as PRFs.', chapters: ['modern'] },
      { cat: 'modern', term: 'Pseudorandom Generator (PRG)', zh: '伪随机生成器', zhDef: '把一小段真随机种子「拉长」成大量看似随机的比特，流密码的密钥流就是这么来的；种子若不够随机，拉出来的全是伪随机。', enDef: 'A function that stretches a short truly random seed into a long stream of random-looking bits—exactly how stream-cipher keystreams are produced. If the seed is weak, everything downstream is weak.', chapters: ['venona','modern'] },
      { cat: 'methods', term: 'CCA2', zh: '自适应选择密文攻击（CCA2）', zhDef: '最严苛的攻击模型：攻击者可以随时向解密预言机提问，还能根据上一次的解密响应调整下一次的提问（比只能预先提问的 CCA1 更强）；现代公钥加密必须在此模型下保持安全（IND-CCA2）。', enDef: 'The strictest attack model: the adversary queries a decryption oracle adaptively, choosing each ciphertext based on previous answers (stronger than the pre-query-only CCA1). Modern public-key encryption must be secure here (IND-CCA2).', chapters: ['modern'] },
      { cat: 'methods', term: 'Distinguishing Attack', zh: '区分攻击', zhDef: '不需要恢复密钥或明文，只要能把密文和纯随机串区分开，就算「破了一半」；现代安全证明几乎都以「攻击者无法区分」作为安全性的定义。', enDef: 'An attack that merely tells ciphertext apart from pure randomness, without recovering keys or plaintext—often enough to declare a scheme broken. Modern security proofs are phrased as indistinguishability.', chapters: ['modern'] },
      { cat: 'methods', term: 'Constant-Time Implementation', zh: '常数时间实现', zhDef: '让代码在秘密数据面前「面不改色」：无论密钥比特是什么，耗时都完全一致，从根上堵死计时攻击；这是 AES 等密码实现的基本功。', enDef: 'Writing code whose running time never depends on secret data, so timing reveals nothing about the key. It is the standard defense against timing attacks and a basic skill for crypto implementations.', chapters: ['modern'] },
      { cat: 'methods', term: 'Padding Oracle Attack', zh: '填充预言机攻击', zhDef: '服务器对「填充错误」和「认证失败」给出不同回应，这小小的差别就成了攻击者逐字节撬开密文的预言机；Vaudenay 2002 年把 Bleichenbacher 的思路用在 CBC 上，POODLE 等真实漏洞都是它的亲戚。', enDef: 'When a server answers padding errors and authentication failures differently, that tiny difference becomes an oracle letting an attacker decrypt byte by byte. Vaudenay applied Bleichenbacher\'s idea to CBC in 2002; real bugs like POODLE are descendants.', chapters: ['modern'] },
      { cat: 'methods', term: 'Backdoor', zh: '后门', zhDef: '藏在算法或实现里的秘密入口（相当于藏在系统里的木马），设计者能借此绕过加密；最著名的当属 2013 年被曝的 Dual_EC_DRBG——一个被写进标准里的、带后门的伪随机数生成器。', enDef: 'A secret way to bypass a cryptosystem, hidden inside an algorithm or its implementation (the crypto equivalent of a trojan horse). The most notorious case is Dual_EC_DRBG, a standardized random generator revealed in 2013 to contain a backdoor.', chapters: ['modern'] },
      { cat: 'protocol', term: 'Certificate Transparency (CT)', zh: '证书透明度', zhDef: '把每一张 TLS 证书都公开记进只可追加的公共账本，谁也别想偷偷给你签一张假证书；浏览器会拒绝查不到日志记录的证书，让 CA 的滥权无所遁形。', enDef: 'A public, append-only ledger of every issued TLS certificate, so nobody can quietly mint a fake one. Browsers reject certificates missing from the logs, keeping certificate authorities honest.', chapters: ['modern'] },
      { cat: 'protocol', term: 'Online Certificate Status Protocol (OCSP)', zh: 'OCSP 证书状态协议', zhDef: '浏览器实时向 CA 查询「这张证书吊销了吗」的协议，比下载整张吊销列表更快更省；缺点是要每次联网问、还泄露访问痕迹，如今常被 OCSP Stapling 替代。', enDef: 'A protocol for checking a certificate\'s revocation status in real time, faster and lighter than downloading a full revocation list. Its round-trip and privacy costs led to OCSP stapling.', chapters: ['modern'] },
      { cat: 'protocol', term: 'HTTP Strict Transport Security (HSTS)', zh: 'HSTS 强制 HTTPS', zhDef: '网站通过响应头命令浏览器「以后只准用 HTTPS 访问我」，浏览器从此自动把 http 升级成 https，从源头掐断降级劫持；银行和邮箱都在靠它。', enDef: 'A response header ordering browsers to only ever contact the site over HTTPS, auto-upgrading http links and blocking downgrade attacks. Banks and email providers rely on it.', chapters: ['modern'] },
      { cat: 'modern', term: 'Merkle Tree', zh: '默克尔树', zhDef: '把数据块的哈希两两合并、层层向上，最终汇成单一根哈希；只要根哈希不变，任何叶子的篡改都会败露，比特币用它把整块交易压缩成一个根。', enDef: 'A structure that hashes data blocks pairwise up to a single root; any tampering with a leaf is caught at the root. Bitcoin uses it to compress a whole block of transactions into one root hash.', chapters: ['modern'] },
      { cat: 'modern', term: 'Proof of Work (PoW)', zh: '工作量证明', zhDef: '先完成一件「算起来难、验证起来秒过」的苦力活（比如暴力搜一个满足条件的哈希），才获得记账资格；比特币把出块成本变成攻击成本，中本聪 2008 年引入。', enDef: 'Requiring a costly but instantly verifiable computation—like searching for a hash with many leading zeros—before earning the right to append a block. Bitcoin (2008) turns that cost into the price of an attack.', chapters: ['modern'] },
      { cat: 'modern', term: 'Hash-Based Signatures', zh: '哈希签名（一次性签名）', zhDef: '只用哈希函数就能造的签名：Lamport 1979 年提出，私钥是一串秘密值、公开其哈希作公钥；不怕量子计算机，SPHINCS+ 已被 NIST 选入后量子标准。', enDef: 'Signatures built from hash functions alone: Lamport\'s 1979 scheme publishes hashes of secret values as the public key. Immune to quantum attacks, the hash-based SPHINCS+ was standardized by NIST for post-quantum use.', chapters: ['modern'] },
      { cat: 'modern', term: 'Learning With Errors (LWE)', zh: '带错误学习问题（LWE）', zhDef: '格密码的「镇山之宝」：给你一堆混着小噪声的线性方程，恢复其中的未知解极其困难，量子计算机也拿它没辙；NIST 选中的 Kyber 等后量子算法都建立在它之上。', enDef: 'The workhorse of lattice cryptography: recovering a secret from noisy linear equations is provably hard, even for quantum computers. NIST\'s post-quantum picks like Kyber rest on it.', chapters: ['modern'] },
      { cat: 'modern', term: 'Ring-LWE (RLWE)', zh: '环带错误学习（RLWE）', zhDef: 'LWE 的多项式环版本：密钥更小、运算更快，让格密码从理论变成实用；代价是安全证明依赖环结构，NIST 的后量子标准 Kyber、Dilithium 都是它的模块化近亲。', enDef: 'The polynomial-ring version of LWE, with smaller keys and faster operations that make lattice crypto practical. Its proofs lean on ring structure; NIST\'s post-quantum standards Kyber and Dilithium are modular relatives.', chapters: ['modern'] },
      { cat: 'modern', term: 'Shamir\'s Secret Sharing', zh: 'Shamir 秘密共享', zhDef: '1979 年 Shamir 的巧思：把一份秘密拆成 n 份，凑齐任意 k 份才能复原、少一份都不行；数学依据是「k 个点唯一确定一条 k-1 次多项式」，密码保险库和多签系统都在用。', enDef: 'Shamir\'s 1979 scheme splits a secret into n shares such that any k of them reconstruct it while fewer reveal nothing—thanks to the fact that k points define a unique degree k-1 polynomial. Used in vaults and multi-signature systems.', game: 'shamir', chapters: ['modern'] },
    { cat: 'methods', term: 'Phishing', zh: '钓鱼攻击', zhDef: '伪装成可信发件人，诱骗用户点击恶意链接或交出凭据——加密保护的是信息，防不住主动上钩的人。', enDef: 'Masquerading as a trusted sender to trick users into clicking malicious links or surrendering credentials — crypto secures data, not gullible humans.', game: 'phishhunt', chapters: ['modern'] },
      { cat: 'modern', term: 'Ring Signature', zh: '环签名', zhDef: '一群人里有人签了名，但没人知道具体是谁：签名用「一环」公钥生成，验证者只能确认签名者确实在环内；Monero 用它实现不可追踪的交易。', enDef: 'A signature generated with a \'ring\' of public keys that proves the signer belongs to the set without revealing which one. Monero uses ring signatures to make transactions untraceable.', chapters: ['modern'] },
      { cat: 'modern', term: 'SHA-3', zh: 'SHA-3 哈希', zhDef: '由 NIST 于 2015 年标准化的哈希算法，采用 Keccak 的海绵结构，与 SHA-2 内部设计完全不同，为哈希家族提供了备用选择。', enDef: 'A hash algorithm standardized by NIST in 2015, built on the Keccak sponge construction and sharing no internal design with SHA-2, giving the hash family a backup choice.', chapters: ['modern'] },
      { cat: 'modern', term: 'Forward Secrecy', zh: '前向保密', zhDef: '会话密钥只临时生成、用完即弃，即使长期私钥日后泄露，过去的通信记录也无法被解密，保护历史流量。', enDef: 'Session keys are generated fresh and discarded after use, so even if a long-term private key is later compromised, past conversations cannot be decrypted, protecting historical traffic.', chapters: ['modern'] },
      { cat: 'protocol', term: 'Key Confirmation', zh: '密钥确认', zhDef: '通信双方在握手后互相证明各自算出了同一把会话密钥，防止密钥不匹配或中间人悄悄插足。', enDef: 'After a handshake, both parties prove to each other that they derived the same session key, ruling out key mismatch or a silent man-in-the-middle.', chapters: ['modern'] },
      { cat: 'protocol', term: 'Key Rotation', zh: '密钥轮换', zhDef: '定期或按事件更换密钥，缩短单把密钥的暴露窗口，即使某把密钥泄露，损失也被限制在最短时间内。', enDef: 'Replacing keys on a schedule or after events to shrink each key\'s exposure window, so a leaked key limits the damage to the shortest period.', chapters: ['modern'] },
      { cat: 'modern', term: 'WebCrypto', zh: 'WebCrypto', zhDef: '浏览器内置的密码学接口，让网页直接调用 AES、RSA、哈希等原语，无需第三方库就能本地加解密与签名。', enDef: 'The browser\'s built-in cryptography API, letting web pages call AES, RSA, hashing and other primitives directly, with no third-party library needed for local encryption, decryption and signing.', chapters: ['modern'] },
      { cat: 'methods', term: 'Password Spraying', zh: '密码喷射', zhDef: '拿少数几个弱口令（如 123456）横扫成千上万个账号，靠撞大运绕过单账户锁定策略，与撞库（凭证填充）方向相反。', enDef: 'Trying a handful of weak passwords (like 123456) across thousands of accounts, dodging per-account lockout policies by playing the odds—the counterpart of credential stuffing.', chapters: ['modern'] },
      { cat: 'methods', term: 'Canary Trap', zh: '金丝雀陷阱', zhDef: '给不同人发送措辞略有差异的同一份机密，谁泄露就凭版本差异揪出内鬼，是抓泄密源的经典情报手法。', enDef: 'Giving each suspect a slightly different version of the same secret, then identifying the leaker by which version surfaces—a classic intelligence technique for tracing leaks to their source.', chapters: ['bletchley'] },
      { cat: 'methods', term: 'Steganalysis', zh: '隐写分析', zhDef: '识别并提取藏在普通载体里的秘密消息的学问，如比对加粗字符或检测像素最低有效位，是隐写术的克星。', enDef: 'The science of detecting and extracting hidden messages from innocent-looking carriers—spotting bold characters or anomalies in pixel low bits—the bane of steganography.', game: 'bacon', chapters: ['bacon','modern'] },
      { cat: 'methods', term: 'Replay Attack', zh: '重放攻击', zhDef: '截获一段合法通信后原样重发，骗系统重复执行一次操作；时间戳、随机数与序列号是常见的防御手段。', enDef: 'Intercepting a legitimate transmission and resending it unchanged to trick a system into repeating an action; timestamps, nonces and sequence numbers are common defenses.', chapters: ['modern'] },
      { cat: 'modern', term: 'Format-Preserving Encryption (FPE)', zh: '格式保留加密', zhDef: '加密后密文与明文保持相同格式（如 16 位卡号仍为 16 位数字），让旧系统无需改动字段就能存下密文。', enDef: 'Encryption in which the ciphertext keeps the same format as the plaintext (a 16-digit card number stays 16 digits), so legacy systems can store ciphertext without changing fields.', chapters: ['modern'] },

      /* 第四期 A5：量子时代术语（+8） */
      { cat: 'modern', term: 'BB84', zh: 'BB84 协议', zhDef: '1984 年贝内特与布拉萨德提出的首个实用量子密钥分发协议：发送方随机用两组基编码光子偏振，接收方随机选基测量；基匹配的位构成共享密钥，窃听必然引入约 25% 的误码率而暴露。', enDef: 'The first practical quantum key distribution protocol, proposed by Bennett and Brassard in 1984. The sender encodes photon polarizations in two random bases and the receiver measures in randomly chosen bases; matching positions form a shared key, while any eavesdropper unavoidably injects about 25% errors and gives herself away.', game: 'bb84', chapters: ['quantum'] },
      { cat: 'modern', term: 'Quantum Key Distribution (QKD)', zh: '量子密钥分发', zhDef: '利用量子力学原理（测不准与不可克隆）在信道上协商密钥的技术：任何窃听都会扰动量子态并留下可检测的误码指纹，安全性由物理定律而非计算复杂度保证。', enDef: 'A technique that negotiates keys over a channel using quantum mechanics (uncertainty and no-cloning): any interception disturbs the quantum states and leaves detectable error fingerprints, so security rests on physical law rather than computational hardness.', chapters: ['quantum'] },
      { cat: 'methods', term: 'Shor\'s Algorithm', zh: 'Shor 算法', zhDef: '1994 年秀尔提出的量子算法，能在多项式时间内完成大数分解与离散对数——直接瓦解 RSA、Diffie-Hellman 与 ECC 的数学根基；它的存在是后量子密码迁移的全部理由。', enDef: 'Peter Shor\'s 1994 quantum algorithm factors integers and computes discrete logarithms in polynomial time — dismantling the mathematical foundations of RSA, Diffie-Hellman and ECC at a stroke; it is the entire reason for the post-quantum migration.', chapters: ['quantum'] },
      { cat: 'methods', term: 'Grover\'s Algorithm', zh: 'Grover 算法', zhDef: '1996 年格罗弗提出的量子搜索算法，把无结构暴力搜索从 N 步加速到约 √N 步；对策简单——密钥长度加倍即可，因此 AES-256 在量子时代依然安全。', enDef: 'Lov Grover\'s 1996 quantum search algorithm speeds unstructured brute force from N steps to about √N. The countermeasure is simple — double the key length — which is why AES-256 remains secure in the quantum era.', chapters: ['quantum'] },
      { cat: 'protocol', term: 'Lattice-based Cryptography', zh: '格密码', zhDef: '基于高维格中「最短向量」「最近向量」等难题构造的密码体制：把数千维空间中的点阵搅进噪声，至今没有给 Shor 算法留下可乘之隙，是后量子标准的主力路线。', enDef: 'Cryptosystems built on lattice problems such as finding short or close vectors in high dimensions: points scattered through thousands of dimensions with noise added, offering no purchase for Shor\'s algorithm — the mainstay route of post-quantum standards.', chapters: ['quantum'] },
      { cat: 'protocol', term: 'Kyber (ML-KEM)', zh: 'Kyber（ML-KEM）', zhDef: '基于模块格上带误差学习问题（MLWE）的密钥封装机制，2024 年被 NIST 标准化为 FIPS 203（ML-KEM），用于通用加密的量子安全迁移，已被 Chrome、Signal 等试水混合部署。', enDef: 'A key-encapsulation mechanism based on the Module Learning-With-Errors problem over module lattices, standardized by NIST as FIPS 203 (ML-KEM) in 2024 for quantum-safe general encryption; already trialed in hybrid mode by Chrome, Signal and others.', chapters: ['quantum'] },
      { cat: 'protocol', term: 'Dilithium (ML-DSA)', zh: 'Dilithium（ML-DSA）', zhDef: '基于格的数字签名方案，2024 年被 NIST 标准化为 FIPS 204（ML-DSA）；签名紧凑、验证高效，与 ML-KEM 并列后量子迁移的主力签名算法。', enDef: 'A lattice-based digital signature scheme standardized by NIST as FIPS 204 (ML-DSA) in 2024; compact signatures and fast verification make it the primary post-quantum signing algorithm alongside ML-KEM.', chapters: ['quantum'] },
      { cat: 'protocol', term: 'Harvest Now, Decrypt Later', zh: '先截获、后解密', zhDef: '对手今天批量囤积无法破译的密文，等量子计算机成熟后再回放解读；保密期以十年计的数据（医疗、国家档案）因此现在就需要后量子保护。', enDef: 'An adversary warehouses today\'s unbreakable ciphertexts today, waiting to replay them once quantum computers mature. Data whose secrecy horizon spans decades—medical records, state archives—therefore needs post-quantum protection right now.', chapters: ['quantum'] },

      /* 第四期 B3：东方密码术语（+6） */
      { cat: 'classical', term: 'Yinfu Tally Codes', zh: '阴符', zhDef: '中国早期军事符信：《六韬》载八种符节，以竹符不同长度对应「见兵」「败军」等八类军情，两半相合为验——不着一字的密码。相传创制于姜太公。', enDef: 'An early Chinese military signal: the Liu Tao records eight tally lengths, each secretly mapping to a situation such as "enemy advancing" or "defeat". Two halves must match to authenticate — a code with no words at all. Tradition credits Duke Jiang of Qi.', chapters: ['caesar'] },
      { cat: 'classical', term: 'Yinshu Split Letters', zh: '阴书', zhDef: '《六韬》所记拆信术：一封密信拆作三份，由三名信使分道携带，收信人合三为一才能读全——单份被截也无法泄密，是朴素的「分割+冗余」思想。', enDef: 'A split-letter scheme from the Liu Tao: one letter is cut into three parts carried by three messengers on different routes; only recombining all three reveals the message. Any single capture leaks nothing — an early split-and-redundancy design.', chapters: ['caesar'] },
      { cat: 'classical', term: 'Ziyan Code', zh: '字验', zhDef: '北宋《武经总要》（1044）所载军用密写法：选一首四十字的诗，以临时约定的密钥字定位其中一字，该字在诗中的位置即对应一份四十项军情清单——每次换钥字即换一套编码。', enDef: 'A Song-dynasty military cipher from the Wujing Zongyao (1044): pick a forty-character poem; a per-message key character selects one poem position, and that position maps to one of forty pre-agreed tactical reports — change the key character and the whole encoding changes.', game: 'codebreak', chapters: ['arab'] },
      { cat: 'classical', term: 'Fanqie Code', zh: '反切码', zhDef: '明代戚继光《纪效新书》所载注音密码：取两首诗词的声母与韵母表，「声×韵」交叉组合为汉字编号——与同时代欧洲的多表替换异曲同工，却源自本土音韵学。', enDef: 'A phonetic cipher in Qi Jiguang\'s Jixiao Xinshu (1560s): initials from one poem crossed with finals from another number every Chinese character — structurally akin to Europe\'s polyalphabetic idea, but grown from native phonology.', game: 'freq', chapters: ['bacon'] },
      { cat: 'methods', term: 'Ninja Secret Codes', zh: '忍术隐语与暗号', zhDef: '日本戦国时代的谍报秘匿术：「乱破り」指潜入敌方破其耳目；1676 年《万川集海》辑录隐语、合符、置码等传信法门——防谍与保密并重的东方实践。', enDef: 'Sengoku-era Japan\'s tradecraft: "rappa" meant infiltrating and blinding the enemy\'s scouts, while the Bansenshukai (1676) compiled argots, matching tallies and drop points for covert messaging — counter-intelligence and secrecy as one discipline.', chapters: ['bacon'] },
      { cat: 'methods', term: 'Variant Kana Steganography', zh: '变体假名隐写', zhDef: '平安时代日本贵族女性以「女手」（变体假名）书写往来，字形因人而异、外人难识；间或以换字与略号藏意于和歌书简之中——一种长于日常文本的柔性隐写传统。', enDef: 'Heian-era court women wrote in onna-de ("women\'s hand"), variant kana whose letterforms differed by hand and were opaque to outsiders; occasional character swaps and abbreviations hid meaning inside poems and letters — a soft steganography woven into everyday writing.', chapters: ['arab'] },

      /* 第五期：国密体系术语（+4） */
      { cat: 'modern', term: 'SM4', zh: 'SM4 分组密码', zhDef: '中国国家商用分组密码标准（GB/T 32907-2016，曾用名 SMS4）：128 位分组、128 位密钥、32 轮非平衡 Feistel 结构，S 盒与 AES 同源思路；最初为 WAPI 无线局域网安全设计，现广泛用于国内金融与政务系统。', enDef: 'China\'s commercial block cipher standard (GB/T 32907-2016, formerly SMS4): 128-bit blocks and keys, 32-round unbalanced Feistel structure with an AES-style S-box. Originally designed for the WAPI WLAN security protocol, now widely deployed in domestic finance and government systems.', game: 'sm4', chapters: ['modern'] },
      { cat: 'protocol', term: 'SM2', zh: 'SM2 公钥算法', zhDef: '中国国家商用公钥算法标准（GB/T 32918）：基于 256 位椭圆曲线的数字签名、密钥交换与公钥加密体系——角色相当于国标版的 ECDSA+ECDH。', enDef: 'China\'s commercial public-key standard (GB/T 32918): digital signature, key exchange and encryption over a 256-bit elliptic curve — the national counterpart of ECDSA plus ECDH.', chapters: ['modern'] },
      { cat: 'modern', term: 'SM3', zh: 'SM3 哈希算法', zhDef: '中国国家商用哈希标准（GB/T 32905-2016）：输出 256 位摘要，Merkle–Damgård 结构与填充方式类似 SHA-256，安全性目标同级。', enDef: 'China\'s commercial hash standard (GB/T 32905-2016): a 256-bit digest with Merkle–Damgård strength targets and padding similar to SHA-256.', chapters: ['modern'] },
      { cat: 'protocol', term: 'ZUC (Zu Chongzhi)', zh: '祖冲之算法（ZUC）', zhDef: '以南北朝数学家祖冲之命名的序列密码：2011 年入选 3GPP LTE 安全机制成为国际标准，用于 4G/5G 通信加密——中国密码算法首次进入国际移动通信标准体系。', enDef: 'A stream cipher named after the ancient mathematician Zu Chongzhi: adopted into 3GPP LTE security in 2011 as an international standard for 4G/5G traffic — the first Chinese algorithm in global mobile security.', chapters: ['modern'] },

      /* 第五期：哈希碰撞术语（+3） */
      { cat: 'modern', term: 'MD5', zh: 'MD5 哈希', zhDef: '1991 年 Rivest 设计的 128 位哈希函数，曾是最广泛使用的文件校验与口令摘要算法；2004 年被王小云团队证实可在数小时内构造碰撞，现仅可用于非安全场景。', enDef: 'A 128-bit hash by Ron Rivest (1991), once the default for file checksums and password digests. In 2004 Xiaoyun Wang\'s team showed collisions computable in hours; today MD5 is fit only for non-security uses.', chapters: ['modern'] },
      { cat: 'modern', term: 'SHA-1', zh: 'SHA-1 哈希', zhDef: 'NSA 设计、160 位输出的哈希标准，长期支撑代码签名与 TLS 证书；2005 年王小云团队给出理论碰撞攻击，2017 年 Google 与 CWI 以 SHAttered 实际演示——此后浏览器与证书机构全面弃用。', enDef: 'An NSA-designed 160-bit hash standard that long underpinned code signing and TLS certificates. Theoretical collisions came from Xiaoyun Wang\'s team in 2005; in 2017 Google and CWI demonstrated SHAttered, and browsers and CAs dropped it for good.', chapters: ['modern'] },
      { cat: 'methods', term: 'Hash Collision Attack', zh: '哈希碰撞攻击', zhDef: '寻找两个不同输入产生相同哈希输出的攻击：对 n 位哈希，生日悖论使随机碰撞约需 2^(n/2) 次尝试；碰撞直接瓦解数字签名的「唯一性」——签名一份文件等于签名其碰撞副本。', enDef: 'Finding two different inputs with the same hash output: by the birthday bound, random collisions on an n-bit hash cost about 2^(n/2) tries. A collision breaks signature uniqueness — signing one file signs its collision twin.', chapters: ['modern'] },
    ];

    var CATS = {
      basic: { key: 'glossary.catBasic', zh: '🧱 基础概念', en: '🧱 Basics' },
      classical: { key: 'glossary.catClassical', zh: '🏛️ 古典密码', en: '🏛️ Classical Ciphers' },
      methods: { key: 'glossary.catMethods', zh: '🔍 破译方法', en: '🔍 Breaking Methods' },
      modern: { key: 'glossary.catModern', zh: '💻 现代密码', en: '💻 Modern Cryptography' },
      protocol: { key: 'glossary.catProtocol', zh: '🛡️ 协议与工程', en: '🛡️ Protocols & Engineering' },
      people: { key: 'glossary.catPeople', zh: '👤 人物与机构', en: '👤 People & Places' },
      encoding: { key: 'glossary.catEncoding', zh: '📡 隐写与编码', en: '📡 Steganography & Codes' }
    };

    var root = document.getElementById('gl-root');
    var isEn = window.Arcade && Arcade.i18n && Arcade.i18n.getLang() === 'en';

    /* G1 易混辨析：容易混淆的概念对比卡 */
    var COMPARE = [
      { a: { zh: '加密', en: 'Encryption' }, b: { zh: '编码', en: 'Encoding' },
        zh: '加密需要密钥，可逆地隐藏内容；编码不需要密钥，只是格式转换（如 Base64、ASCII）。',
        en: 'Encryption needs a key and hides content reversibly; encoding needs no key and is just format conversion (e.g. Base64, ASCII).' },
      { a: { zh: '对称密码', en: 'Symmetric' }, b: { zh: '非对称密码', en: 'Asymmetric' },
        zh: '加解密用同一把密钥（AES、凯撒）；非对称用公钥/私钥一对（RSA、ECC），公钥可公开。',
        en: 'One key encrypts and decrypts (AES, Caesar); asymmetric uses a public/private pair (RSA, ECC) — the public key can be shared.' },
      { a: { zh: '替换密码', en: 'Substitution' }, b: { zh: '换位密码', en: 'Transposition' },
        zh: '替换改变字母本身（A→D）；换位只重排顺序，字母不变（栅栏、列换位）。',
        en: 'Substitution changes the letters themselves (A→D); transposition only rearranges them (rail fence, columnar).' },
      { a: { zh: '哈希', en: 'Hash' }, b: { zh: '加密', en: 'Encryption' },
        zh: '哈希是单向的，不可逆、无密钥、定长输出；加密可逆且有密钥。',
        en: 'A hash is one-way, keyless and fixed-length; encryption is reversible and keyed.' },
      { a: { zh: '流密码', en: 'Stream cipher' }, b: { zh: '分组密码', en: 'Block cipher' },
        zh: '流密码逐比特/字节加密（RC4、ChaCha20）；分组密码按固定块加密（AES、DES）。',
        en: 'A stream cipher encrypts bit by bit (RC4, ChaCha20); a block cipher encrypts fixed-size blocks (AES, DES).' }
    ];
    function renderCompare() {
      var box = document.getElementById('gl-compare');
      if (!box) return;
      var html = '<div class="gl-cat"><div class="gl-cat-title">⚖️ ' + (isEn ? 'Confusing Pairs, Compared' : '易混辨析 · 一眼分清') + '</div><div class="gl-grid">';
      COMPARE.forEach(function (c) {
        html += '<div class="gl-item">' +
          '<div class="gl-cmp"><span class="gl-term">' + (isEn ? c.a.en : c.a.zh) + '</span><span class="gl-cmp-vs">VS</span><span class="gl-term" style="color:var(--neon-cyan)">' + (isEn ? c.b.en : c.b.zh) + '</span></div>' +
          '<div class="gl-def">' + (isEn ? c.en : c.zh) + '</div></div>';
      });
      html += '</div></div>';
      box.innerHTML = html;
    }

    function build() {
      if (!root) return;
      var html = '';
      ['basic', 'classical', 'methods', 'modern', 'protocol', 'people', 'encoding'].forEach(function (cat) {
        var items = window.GLOSSARY.filter(function (g) { return g.cat === cat; });
        if (!items.length) return;
        var catMeta = CATS[cat];
        html += '<div class="gl-cat"><div class="gl-cat-title">' + (isEn ? catMeta.en : catMeta.zh) + '</div><div class="gl-grid">';
        items.forEach(function (g) {
          var playLink = g.game
            ? '<a class="gl-play" href="games/' + g.game + '/index.html">🎮 ' + T('glossary.play') + '</a>'
            : '';
          var CH_IDS = { dawn: 'c0', caesar: 'c1', arab: 'c2', bacon: 'c3', ww1: 'c4', bletchley: 'c5', midway: 'c6', purple: 'c7', lorenz: 'c8', venona: 'c9', modern: 'c10', quantum: 'c11' };
          var chLinks = (g.chapters || []).map(function (cid) {
            var num = CH_IDS[cid];
            return '<a class="gl-ch" href="story.html?id=' + cid + '">📜 ' + (num ? T('st.' + num + '.t') : cid) + '</a>';
          }).join('');
          html += '<div class="gl-item">' +
            '<span class="gl-term">' + g.term + '</span><span class="gl-term-zh">' + g.zh + '</span>' +
            '<div class="gl-def">' + (isEn ? g.enDef : g.zhDef) + '</div>' +
            playLink + chLinks + '</div>';
        });
        html += '</div></div>';
      });
      root.innerHTML = html;
      var count = document.getElementById('gl-count');
      if (count) count.textContent = isEn
        ? window.GLOSSARY.length + ' terms · EN 中文对照 · read, play, decrypt'
        : window.GLOSSARY.length + ' 个术语 · 中英对照 · 读史、玩戏、破译';
      /* 阅读计数（F3 成就 gloss30）：浏览术语页累计 +1 */
      try {
        var n = parseInt(localStorage.getItem('arcade_gloss_read') || '0', 10);
        localStorage.setItem('arcade_gloss_read', String(n + 1));
      } catch (e) {}
    }

    if (window.Arcade && Arcade.i18n) {
      Arcade.i18n.applyStatic();
      document.title = (isEn ? 'Cryptography Glossary' : '密码学词典') + Arcade.i18n.t('app.titleSuffix');
    }
    renderCompare();
    build();
  </script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
