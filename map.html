  <style>
    .mp-wrap { max-width: 1080px; margin: 0 auto; padding: 8px 16px 60px; position: relative; z-index: 1; }
    .mp-hero { text-align: center; padding: 26px 16px 8px; }
    .mp-title { font-family: var(--font-pixel); font-size: 22px; letter-spacing: 3px; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,240,255,.7), 0 0 30px rgba(0,240,255,.3); }

    .mp-count { font-family: var(--font-pixel); font-size: 11px; color: var(--neon-yellow); margin-top: 8px; }

    .mp-map-wrap { margin-top: 20px; background: linear-gradient(180deg, rgba(20,20,34,.85), rgba(10,10,18,.6)); border: 1px solid rgba(0,240,255,.22); border-radius: 14px; padding: 14px; }

    .mp-dot { cursor: pointer; }
    .mp-dot circle { fill: var(--neon-yellow, #ffe600); stroke: rgba(0,0,0,.6); stroke-width: 1.5; transition: r .15s; }
    .mp-dot:hover circle { fill: var(--neon-pink, #ff2d95); }
    .mp-dot text { font-size: 9px; fill: var(--text-dim, #aaa); pointer-events: none; }

    .mp-detail { margin-top: 14px; min-height: 90px; background: rgba(0,0,0,.3); border: 1px solid rgba(0,240,255,.2); border-radius: 12px; padding: 14px 16px; }
    .mp-detail .mp-d-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .mp-detail .mp-d-ic { font-size: 26px; }
    .mp-detail .mp-d-name { font-size: 16px; font-weight: 700; color: var(--neon-cyan); }
    .mp-detail .mp-d-year { font-family: var(--font-pixel); font-size: 11px; color: var(--neon-yellow); }
    .mp-detail .mp-d-desc { margin-top: 8px; font-size: 13px; color: var(--text-main); line-height: 1.8; }

    .mp-detail .mp-d-go:hover { background: rgba(57,255,20,.15); }

<body>

  <script>
    (function () {
      if (!window.Arcade || !Arcade.i18n || !window.CRYPTO_MAP) return;
      Arcade.i18n.applyStatic();
      document.title = Arcade.i18n.t('map.title') + Arcade.i18n.t('app.titleSuffix');
      var T = Arcade.i18n.t;
      var isEn = Arcade.i18n.getLang() === 'en';
      var M = window.CRYPTO_MAP;
      var pre = window.__arcadePagePrefix || '';

      document.getElementById('mp-count').textContent = isEn
        ? M.EVENTS.length + ' events · from Egypt to Silicon Valley'
        : M.EVENTS.length + ' 个事件 · 从埃及到硅谷';

      /* 简化世界地图 path（等距圆柱投影，1000×500） */
      var LAND = 'M0,250 L0,180 L45,180 L45,140 L90,140 L90,120 L135,120 L135,100 L180,100 L180,90 L225,90 L225,80 L315,80 L315,70 L360,70 L360,60 L450,60 L450,70 L540,70 L540,80 L630,80 L630,90 L675,90 L675,110 L720,110 L720,130 L765,130 L765,140 L810,140 L810,120 L855,120 L855,100 L900,100 L900,110 L945,110 L945,130 L990,130 L990,140 L1000,140 L1000,180 L1000,250 L1000,320 L945,320 L945,340 L900,340 L900,360 L855,360 L855,380 L810,380 L810,360 L765,360 L765,340 L720,340 L720,330 L675,330 L675,350 L630,350 L630,370 L585,370 L585,380 L540,380 L540,370 L495,370 L495,350 L450,350 L450,360 L405,360 L405,370 L360,370 L360,360 L315,360 L315,350 L270,350 L270,340 L225,340 L225,330 L180,330 L180,340 L135,340 L135,320 L90,320 L90,300 L45,300 L45,280 L0,280 L0,250 Z ' +
        'M90,90 L90,70 L135,70 L135,90 Z ' + /* 澳洲近似 */
        'M720,120 L720,100 L810,100 L810,120 Z ' + /* 北美 */
        'M90,300 L90,280 L135,280 L135,300 Z ' + /* 南美 */
        'M630,130 L630,110 L720,110 L720,130 Z M540,90 L540,70 L630,70 L630,90 Z ' + /* 欧亚大陆内海 */
        'M810,250 L810,230 L900,230 L900,250 Z M450,250 L450,230 L540,230 L540,250 Z '; /* 洋区点缀 */

      var svg =
        '<svg class="mp-svg" viewBox="0 0 1000 500" role="img" aria-label="' + (isEn ? 'World map of cryptography events' : '密码学事件世界地图') + '">' +
        '<rect class="mp-ocean" x="0" y="0" width="1000" height="500"/>' +
        '<path class="mp-land" d="' + LAND + '"/>';

      M.EVENTS.forEach(function (ev) {
        var p = M.project(ev.x, ev.y);
        svg += '<g class="mp-dot" data-id="' + ev.id + '" transform="translate(' + p.px + ',' + p.py + ')" tabindex="0" role="button" aria-label="' + (isEn ? ev.en : ev.zh) + '">' +
          '<circle r="7"></circle>' +
          '<text y="-10" text-anchor="middle">' + (isEn ? ev.en : ev.zh) + '</text></g>';
      });
      svg += '</svg>';
      var mapBox = document.getElementById('mp-map');
      mapBox.innerHTML = svg;

      var detail = document.getElementById('mp-detail');
      function showDetail(ev) {
        if (!ev) {
          detail.innerHTML = '<div class="mp-d-empty">' + (isEn ? '👆 Tap a dot to explore' : '👆 点击地图上的点，查看事件详情') + '</div>';
          return;
        }
        var href = null;
        if (ev.link) {
          var l = ev.link;
          if (l.type === 'story') href = pre + 'story.html?id=' + l.id;
          else if (l.type === 'game') href = pre + 'games/' + l.id + '/index.html';
          else if (l.type === 'people') href = pre + 'people.html';
          else if (l.type === 'artifact') href = pre + 'artifacts.html';
          else if (l.type === 'term') href = pre + 'glossary.html';
        }
        var go = href
          ? '<a class="mp-d-go" href="' + href + '">' + (isEn ? 'Explore →' : '去探索 →') + '</a>'
          : '';
        detail.innerHTML =
          '<div class="mp-d-head">' +
            '<span class="mp-d-ic">' + ev.icon + '</span>' +
            '<span class="mp-d-name">' + (isEn ? ev.en : ev.zh) + '</span>' +
            '<span class="mp-d-year">' + (ev.year < 0 ? 'BC ' + (-ev.year) : ev.year) + '</span>' +
          '</div>' +
          '<div class="mp-d-desc">' + (isEn ? ev.desc.en : ev.desc.zh) + '</div>' +
          go;
      }
      showDetail(null);

      var dots = mapBox.querySelectorAll('.mp-dot');
      for (var i = 0; i < dots.length; i++) {
        (function (d) {
          function pick() {
            var id = d.getAttribute('data-id');
            var ev = null;
            M.EVENTS.forEach(function (e) { if (e.id === id) ev = e; });
            showDetail(ev);
          }
          d.addEventListener('click', pick);
          d.addEventListener('keydown', function (ev2) {
            if (ev2.key === 'Enter' || ev2.key === ' ') { ev2.preventDefault(); pick(); }
          });
        })(dots[i]);
      }

      /* 事件列表 chips */
      var list = document.getElementById('mp-list');
      var lh = '';
      M.EVENTS.forEach(function (ev) {
        lh += '<button class="mp-chip" data-id="' + ev.id + '"><b>' + (ev.year < 0 ? 'BC ' + (-ev.year) : ev.year) + '</b>' +
          (isEn ? ev.en : ev.zh) + '</button>';
      });
      list.innerHTML = lh;
      var chips = list.querySelectorAll('.mp-chip');
      for (var j = 0; j < chips.length; j++) {
        (function (c) {
          c.addEventListener('click', function () {
            var id = c.getAttribute('data-id');
            var ev = null;
            M.EVENTS.forEach(function (e) { if (e.id === id) ev = e; });
            showDetail(ev);
          });
        })(chips[j]);
      }
    })();
  </script>
  <script src="assets/js/pwa.js"></script>
</body>
