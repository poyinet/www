  <script>
    (function () {
      if (!window.Arcade || !Arcade.i18n || !window.MORSE_L) return;
      Arcade.i18n.applyStatic();
      document.title = Arcade.i18n.t('morseL.title') + Arcade.i18n.t('app.titleSuffix');
      var T = Arcade.i18n.t;
      var M = window.MORSE_L;

      var root = document.getElementById('ml-root');
      var state = { speed: 'normal', list: [], idx: 0, score: 0, answered: false };

      /* 开始屏 */
      function renderStart() {
        var html = '<div class="ml-card">';
        html += '<div style="font-size:13px;color:var(--text-main)">' + T('morseL.pickSpeed') + '</div>';
        html += '<div class="ml-speed-row">';
        ['slow', 'normal', 'fast', 'fw'].forEach(function (s) {
          html += '<button class="ml-speed' + (state.speed === s ? ' on' : '') + '" data-s="' + s + '">' + T('morseL.speed' + s.charAt(0).toUpperCase() + s.slice(1)) + '</button>';
        });
        html += '</div>';
        html += '<div style="margin-top:8px;font-size:11px;color:var(--text-dim)">' + (state.speed === 'fw' ? T('morseL.fwHint') : '') + '</div>';
        html += '<div style="margin-top:18px"><button class="btn yellow ml-go" id="ml-go">' + T('morseL.start') + '</button></div>';
        html += '</div>';
        root.innerHTML = html;
        var speeds = root.querySelectorAll('.ml-speed');
        for (var i = 0; i < speeds.length; i++) {
          (function (btn) {
            btn.addEventListener('click', function () {
              state.speed = btn.getAttribute('data-s');
              renderStart();
            });
          })(speeds[i]);
        }
        var go = document.getElementById('ml-go');
        if (go) go.addEventListener('click', function () {
          state.list = M.pickLetters(10);
          state.idx = 0; state.score = 0; state.answered = false;
          renderQ(); // renderQ 内部已调度首题播放
        });
      }

      function playCurrent() {
        var ch = state.list[state.idx];
        if (!ch) return;
        var dots = document.getElementById('ml-dots');
        if (dots) dots.textContent = '';
        /* D6 Farnsworth：三字母一组、字符间 7 单位大间隔；答案为整组 */
        if (state.speed === 'fw') {
          state.group = M.makeGroup(ch, 3);
          state.target = state.group.join('');
          var totalFw = M.playGroup(state.group, { mul: M.FARNWORTH.mul, charGap: M.FARNWORTH.charGap }, function (s) {
            var el = document.getElementById('ml-dots');
            if (el && !state.answered) el.textContent += s;
          });
          setTimeout(function () {
            var el = document.getElementById('ml-dots');
            if (el && !state.answered) el.textContent = '';
          }, totalFw + 600);
          return;
        }
        var code = M.MORSE[ch];
        state.target = ch;
        var total = M.playCode(code, M.SPEEDS[state.speed], function (s) {
          var el = document.getElementById('ml-dots');
          if (el && !state.answered) el.textContent += s;
        });
        setTimeout(function () {
          var el = document.getElementById('ml-dots');
          if (el && !state.answered) el.textContent = '';
        }, total + 400);
      }

      /* 题目屏 */
      function renderQ() {
        var ch = state.list[state.idx];
        if (!ch) { renderResult(); return; }
        var n = state.idx + 1, total = state.list.length;
        var pct = Math.round(n / total * 100);
        root.innerHTML =
          '<div class="ml-card">' +
            '<div class="ml-progress">' +
              '<span class="num">' + T('morseL.q').replace('{n}', n + '/' + total) + '</span>' +
              '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
            '</div>' +
            '<div class="ml-play">📡</div>' +
            '<div><button class="ml-replay" id="ml-replay">🔊 ' + T('morseL.replay') + '</button></div>' +
            '<div class="ml-dots" id="ml-dots"></div>' +
            '<div class="ml-input-row">' +
              '<input class="ml-input" id="ml-input" maxlength="' + (state.speed === 'fw' ? 3 : 1) + '" autocomplete="off" placeholder="?" />' +
              '<button class="btn yellow ml-go" id="ml-submit">' + T('morseL.submit') + '</button>' +
            '</div>' +
            '<div class="ml-fb" id="ml-fb"></div>' +
          '</div>';
        var replay = document.getElementById('ml-replay');
        if (replay) replay.addEventListener('click', playCurrent);
        var inp = document.getElementById('ml-input');
        var submit = document.getElementById('ml-submit');
        function doSubmit() {
          if (state.answered) return;
          var v = (inp.value || '').trim().toUpperCase();
          if (!v) return;
          check(v);
        }
        if (submit) submit.addEventListener('click', doSubmit);
        if (inp) {
          inp.focus();
          inp.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter') { ev.preventDefault(); doSubmit(); }
          });
        }
        setTimeout(playCurrent, 250);
      }

      function check(v) {
        var ch = state.list[state.idx];
        var right = v === state.target;
        if (right) state.score++;
        state.answered = true;
        var fb = document.getElementById('ml-fb');
        fb.className = 'ml-fb ' + (right ? 'ok' : 'no');
        if (right) {
          fb.innerHTML = T('morseL.right');
        } else {
          var show = (state.speed === 'fw' && state.group)
            ? state.group.map(function (l) { return l + ' ' + M.MORSE[l]; }).join(' · ')
            : M.MORSE[ch];
          fb.innerHTML = T('morseL.wrong').replace('{c}', state.target) + ' <span class="code">' + show + '</span>';
        }
        setTimeout(function () { state.idx++; state.answered = false; state.group = null; renderQ(); }, 1200);
      }

      /* 结果屏 */
      function renderResult() {
        M.record(state.score, state.list.length, state.speed);
        var b = M.best();
        root.innerHTML =
          '<div class="ml-result">' +
            '<div class="big">' + (state.score >= 8 ? '🏆' : state.score >= 5 ? '👍' : '📚') + '</div>' +
            '<h2>' + T('morseL.result') + '</h2>' +
            '<div class="score-line">' + state.score + ' / ' + state.list.length + '</div>' +
            '<div class="best-line">' + T('morseL.best').replace('{s}', b.score).replace('{t}', b.total) + '</div>' +
            '<button class="btn yellow" id="ml-again">' + T('morseL.again') + '</button>' +
          '</div>';
        var again = document.getElementById('ml-again');
        if (again) again.addEventListener('click', renderStart);
      }

      renderStart();
    })();
  </script>
