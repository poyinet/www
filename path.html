  <script src="assets/js/core/i18n.js"></script>

  <script>
    if (window.Arcade && Arcade.i18n) {
      Arcade.i18n.applyStatic();
      document.title = (Arcade.i18n.getLang() === 'en' ? '24-Day Decode Journey' : '24 天破译之旅') + Arcade.i18n.t('app.titleSuffix');
    }
    var isEn = window.Arcade && Arcade.i18n && Arcade.i18n.getLang() === 'en';

    /* 24 天路径：按编年史顺序，每章 2 天（第 1 天读章+玩首游戏，第 2 天玩剩余+术语）；12 章 ×2 = 24 */
    var CHS = window.STORIES || [];
    var TERM_MAP = {
      dawn: 'Cryptanalysis', caesar: 'Caesar Cipher', arab: 'Frequency Analysis', bacon: "Bacon's Biliteral",
      ww1: 'Polybius Square', bletchley: 'Enigma', midway: 'Depth', purple: 'Purple',
      lorenz: 'XOR', venona: 'One-Time Pad (OTP)', modern: 'Public-Key Crypto', quantum: 'BB84'
    };

    function build() {
      var list = document.getElementById('pt-list');
      if (!list || !CHS.length) return;
      var html = '';
      var day = 1;
      var TOTAL_DAYS = CHS.length * 2;
      CHS.forEach(function (ch) {
        /* 该章游戏：前 2 款放第 1 天，其余放第 2 天 */
        var gs = ch.games.map(function (gid) {
          var g = null;
          (window.GAMES || []).forEach(function (x) { if (x.id === gid) g = x; });
          return g;
        }).filter(Boolean);
        var first = gs.slice(0, 2), rest = gs.slice(2, 4);
        var term = TERM_MAP[ch.id];
        var num = ch.id === 'dawn' ? 'c0' : 'c' + (CHS.indexOf(ch));
        html += dayCard(day++, ch, [ch], first, term, num);
        /* 第四期 D3：随章节扩容改为 12 章 × 2 天 = 24 天，进度统计同步动态化 */
        if (day <= TOTAL_DAYS) html += dayCard(day++, ch, rest.length ? rest : first, [], term, num, true);
      });
      list.innerHTML = html;
      buildProg();
      bindDone();
    }
    function dayCard(n, ch, chapters, games, term, num, second) {
      var pre = '';
      var chapterLink = '<a class="pt-link" href="story.html?id=' + ch.id + '">📜 ' + T(ch.titleKey) + '</a>';
      var gameLinks = games.map(function (g) {
        return '<a class="pt-link" href="' + g.path + '">' + g.icon + ' ' + T('g.' + g.id + '.t') + '</a>';
      }).join('');
      var termLink = term ? '<a class="pt-link term" href="glossary.html">📖 ' + term + '</a>' : '';
      var quizLink = '<a class="pt-link" href="quiz.html">🧠 ' + (isEn ? 'Self-test' : '自测') + '</a>';
      var quest = second
        ? (isEn ? 'Replay & collect the artifact' : '再玩一轮 · 解锁本章密件')
        : (isEn ? 'Read the chapter & play' : '读本章 · 玩关联游戏');
      return '<div class="pt-day" data-day="' + n + '">' +
        '<div class="pt-day-head"><span class="pt-day-no">DAY ' + n + '</span>' +
        '<span class="pt-day-chapter">' + T(ch.titleKey) + '</span>' +
        '<span class="pt-day-quest">' + quest + '</span></div>' +
        '<div class="pt-day-body">' + chapterLink + gameLinks + termLink + quizLink + '</div></div>';
    }
    function buildProg() {
      var prog = document.getElementById('pt-prog');
      if (!prog) return;
      var totalDays = CHS.length * 2;
      var done = 0;
      for (var i = 1; i <= totalDays; i++) {
        try { if (localStorage.getItem('arcade_path_d' + i)) done++; } catch (e) {}
      }
      prog.innerHTML = (isEn ? 'Progress: ' : '完成进度：') + '<b>' + done + '</b>/' + totalDays +
        '<div class="pt-prog-bar"><div class="pt-prog-fill" style="width:' + Math.round(done / totalDays * 100) + '%"></div></div>';
      var days = document.querySelectorAll('.pt-day');
      for (var j = 0; j < days.length; j++) {
        try { if (localStorage.getItem('arcade_path_d' + days[j].getAttribute('data-day'))) days[j].classList.add('done'); } catch (e) {}
      }
    }
    function bindDone() {
      var days = document.querySelectorAll('.pt-day');
      for (var i = 0; i < days.length; i++) {
        (function (el) {
          el.addEventListener('click', function () {
            var n = el.getAttribute('data-day');
            try {
              if (localStorage.getItem('arcade_path_d' + n)) localStorage.removeItem('arcade_path_d' + n);
              else localStorage.setItem('arcade_path_d' + n, '1');
            } catch (e) {}
            buildProg();
          });
        })(days[i]);
      }
    }
    build();
  </script>
  <script src="assets/js/pwa.js"></script>
