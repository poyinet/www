  <style>
    .pp-wrap { max-width: 920px; margin: 0 auto; padding: 8px 16px 60px; position: relative; z-index: 1; }
    .pp-hero { text-align: center; padding: 26px 16px 8px; }
    .pp-title { font-family: var(--font-pixel); font-size: 22px; letter-spacing: 3px; color: var(--neon-purple); text-shadow: 0 0 12px rgba(185,103,255,.6); }
    @media (max-width: 480px) { .pp-title { font-size: 17px; } }
    .pp-sub { margin-top: 8px; color: var(--text-dim); font-size: 13px; }
    .pp-count { font-family: var(--font-pixel); font-size: 11px; color: var(--neon-cyan); margin-top: 8px; }

    /* 人物关系网 */
    .pp-rels { margin: 16px 0 4px; padding: 14px 16px 10px; border-radius: 12px; background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.07); }
    .pp-rel-head { font-family: var(--font-pixel); font-size: 12px; color: var(--neon-yellow); letter-spacing: 1px; margin-bottom: 4px; }
    .pp-rel-note { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
    .pp-rel-group { margin: 10px 0; }
    .pp-rel-t { font-size: 12px; color: var(--neon-purple); margin-bottom: 6px; }
    .pp-rel-items { display: flex; flex-wrap: wrap; gap: 6px; }
    .pp-rel-item {
      font-size: 11px; color: var(--text-main); line-height: 1.7; padding: 4px 9px;
      background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
    }
    .pp-rel-item i { color: var(--text-dim); font-style: normal; }
    .pp-rel-a { color: var(--neon-cyan); cursor: pointer; }
    .pp-rel-a:hover { text-decoration: underline; }

    /* 人物时间线（主体视图）：纵向置中，人物分列年代两侧 */
    .pp-timeline { margin: 22px 0 4px; padding: 14px 16px 10px; border-radius: 12px; background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.07); }
    .pp-tl-title { font-family: var(--font-pixel); font-size: 12px; color: var(--neon-yellow); letter-spacing: 1px; margin-bottom: 16px; }
    .pp-tl-track { position: relative; padding: 4px 0 6px; }
    .pp-tl-track::before {
      content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(185,103,255,.2), rgba(0,240,255,.55), rgba(57,255,20,.4));
    }
    .pp-tl-row { position: relative; display: flex; align-items: center; margin: 12px 0; }
    .pp-tl-row .pp-tl-side { width: 50%; }
    /* 奇数行：卡片在左半、靠中线右缘（padding-right 贴线） */
    .pp-tl-row:nth-child(odd) .pp-tl-side { padding-right: 26px; text-align: right; }
    /* 偶数行：flex 翻转，含卡片的 side 整体移到右半、靠中线左缘 */
    .pp-tl-row:nth-child(even) { flex-direction: row-reverse; }
    .pp-tl-row:nth-child(even) .pp-tl-side { padding-left: 26px; text-align: left; }
    .pp-tl-card { display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.08); cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .12s; max-width: 100%; }
    .pp-tl-card:hover { border-color: rgba(185,103,255,.6); box-shadow: 0 0 12px rgba(185,103,255,.18); transform: translateY(-2px); }
    .pp-tl-card .pp-tl-ic { font-size: 26px; line-height: 1; filter: drop-shadow(0 0 5px rgba(185,103,255,.5)); }
    .pp-tl-card .pp-tl-txt { display: flex; flex-direction: column; }
    .pp-tl-card .pp-tl-name { font-size: 13px; font-weight: 700; color: var(--text-main); /* 深度审计修复：长译名换行而非撑破 50% 列 */ min-width: 0; overflow-wrap: anywhere; }
    .pp-tl-card .pp-tl-role { font-size: 10px; color: var(--text-dim); margin-top: 1px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    .pp-tl-card .pp-tl-year { font-family: var(--font-pixel); font-size: 9px; color: var(--neon-cyan); letter-spacing: 1px; margin-top: 2px; }
    /* 中心线上的年代节点圆点 */
    .pp-tl-dot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; background: var(--bg-deep); border: 2px solid var(--neon-cyan); box-shadow: 0 0 8px rgba(0,240,255,.6); z-index: 1; }
    @media (max-width: 480px) {
      .pp-tl-row .pp-tl-side { width: 50%; }
      .pp-tl-row:nth-child(odd) .pp-tl-side { padding-right: 16px; }
      .pp-tl-row:nth-child(even) .pp-tl-side { padding-left: 16px; }
      .pp-tl-card { padding: 8px 10px; gap: 8px; }
      .pp-tl-card .pp-tl-ic { font-size: 22px; }
      .pp-tl-card .pp-tl-name { font-size: 12px; }
      .pp-tl-card .pp-tl-role { display: none; }
    }

    .lobby-footer { position: relative; z-index: 1; text-align: center; padding: 20px 16px 30px; color: var(--text-dim); font-size: 12px; line-height: 2; }
    .lobby-footer .pixel-line { font-family: var(--font-pixel); font-size: 9px; color: rgba(0,240,255,.5); }
  </style>

  <script>

    if (window.Arcade && Arcade.i18n) {
      Arcade.i18n.applyStatic();
      document.title = T('nav.people') + Arcade.i18n.t('app.titleSuffix');
      var d = document.querySelector('meta[name="description"]');
      if (d) d.setAttribute('content', Arcade.i18n.t('people.pageDesc'));
    }
    var count = document.getElementById('pp-count');
    count.textContent = T('people.countF').replace('{n}', (window.PEOPLE || []).length);
    /* 时间线：解析 stp.*.era 起始年份（公元前 → 负数；约 → 数值）定位 */
    function eraYear(era) {
      var m = String(era || '').match(/公元前\s*(\d+)/);
      if (m) return -Number(m[1]);
      m = String(era || '').match(/(\d{3,4})/);
      return m ? Number(m[1]) : null;
    }
    (function buildTimeline() {
      var tl = document.getElementById('pp-timeline');
      if (!tl) return;
      var pts = [];
      (window.PEOPLE || []).forEach(function (pid) {
        var y = eraYear(T('stp.' + pid + '.era'));
        if (y === null) return;
        pts.push({ pid: pid, y: y, name: T('stp.' + pid + '.name'), icon: T('stp.' + pid + '.icon'), era: T('stp.' + pid + '.era'), role: T('stp.' + pid + '.role') });
      });
      if (pts.length < 2) return;
      pts.sort(function (a, b) { return a.y - b.y; });
      var html = '<div class="pp-tl-title">🗺️ ' + T('people.timeline') + '</div><div class="pp-tl-track">';
      pts.forEach(function (p, i) {
        /* 奇偶交替：奇数行内容在左（靠线右缘），偶数行在右（靠线左缘） */
        html += '<div class="pp-tl-row">' +
          '<div class="pp-tl-side">' +
          '<div class="pp-tl-card" data-person="' + p.pid + '" title="' + p.name + ' · ' + p.role + ' · ' + p.era + '">' +
          '<span class="pp-tl-ic">' + p.icon + '</span>' +
          '<span class="pp-tl-txt"><span class="pp-tl-name">' + p.name + '</span>' +
          '<span class="pp-tl-role">' + p.role + '</span>' +
          '<span class="pp-tl-year">' + (p.y < 0 ? 'BC ' + (-p.y) : p.y) + '</span></span>' +
          '</div></div>' +
          '<span class="pp-tl-dot"></span>' +
          '<div class="pp-tl-side"></div>' +
          '</div>';
      });
      html += '</div></div>';
      tl.innerHTML = html;
      var cards = tl.querySelectorAll('.pp-tl-card');
      for (var i = 0; i < cards.length; i++) {
        (function (el) {
          el.addEventListener('click', function () {
            var pid = el.getAttribute('data-person');
            if (Arcade.tutorial && Arcade.tutorial.profile) Arcade.tutorial.profile(pid);
          });
        })(cards[i]);
      }
    })();
    /* 人物关系网 */
    if (window.PEOPLE_REL) window.PEOPLE_REL.render();
  </script>
