    .qz-ladder .r.on { border-color: rgba(57,255,20,.45); background: rgba(57,255,20,.07); color: var(--neon-green); }

  <script>
    (function () {
      if (!window.Arcade || !Arcade.i18n || !window.QUIZ) return;
      Arcade.i18n.applyStatic();
      document.title = Arcade.i18n.t('quiz.title') + Arcade.i18n.t('app.titleSuffix');

      var T = Arcade.i18n.t;
      var isEn = Arcade.i18n.getLang() === 'en';
      var QUIZ = window.QUIZ;

      /* 顶部：题库规模 */
      document.getElementById('qz-pool').textContent = isEn
        ? QUIZ.BANK.length + ' questions · ' + QUIZ.RANKS.length + ' ranks · 10 per round'
        : QUIZ.BANK.length + ' 道题 · ' + QUIZ.RANKS.length + ' 个段位 · 每轮 10 题';

      var root = document.getElementById('qz-root');
      var state = { list: [], idx: 0, score: 0, practice: false, roundWrong: [] };

      function lvName(lvl) {
        return T('quiz.lvl' + lvl);
      }

      /* 开始屏 */
      function startNormal() {
        state.list = QUIZ.draw10(); state.idx = 0; state.score = 0; state.practice = false; state.roundWrong = []; renderQ();
      }
      function startPractice() {
        state.list = QUIZ.drawWrong(10); state.idx = 0; state.score = 0; state.practice = true; state.roundWrong = []; renderQ();
      }
      function renderStart() {
        var html = '<div class="qz-start">';
        html += '<button class="btn qz-go" id="qz-go">' + T('quiz.start') + '</button>';
        var wc = QUIZ.wrongCount();
        if (wc > 0) {
          html += '<div style="margin-top:12px"><button class="btn yellow" id="qz-wrong" style="font-size:12px;padding:9px 18px">' +
            T('quiz.wrongBtn').replace('{n}', wc) + '</button></div>';
        }
        html += '<div style="margin-top:12px"><a class="btn pink" href="duel.html" style="font-size:12px;padding:9px 18px">' + T('quiz.duel') + '</a></div>';
        html += '<div class="qz-rank-row">';
        QUIZ.RANKS.forEach(function (r) {
          html += '<div class="qz-rank-chip">' + r.icon + ' ' + (isEn ? r.en : r.zh) + '<b>' + Math.round(r.min * 100) + '%+</b></div>';
        });
        html += '</div></div>';
        root.innerHTML = html;
        var go = document.getElementById('qz-go');
        if (go) go.addEventListener('click', startNormal);
        var wr = document.getElementById('qz-wrong');
        if (wr) wr.addEventListener('click', function () { if (QUIZ.wrongCount() > 0) startPractice(); else startNormal(); });
      }

      /* 题目屏 */
      function renderQ() {
        var q = state.list[state.idx];
        if (!q) { renderResult(); return; }
        var qd = isEn ? q.en : q.zh;
        var n = state.idx + 1, total = state.list.length;
        var pct = Math.round(n / total * 100);
        var opts = '';
        var KEYS = ['A', 'B', 'C', 'D'];
        qd.opts.forEach(function (o, i) {
          opts += '<button class="qz-opt" data-i="' + i + '"><span class="k">' + KEYS[i] + '</span>' + o + '</button>';
        });
        root.innerHTML =
          '<div class="qz-card">' +
            '<div class="qz-progress">' +
              '<span class="num">' + T('quiz.q').replace('{n}', n + '/' + total) + '</span>' +
              '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
              '<span class="score">' + T('quiz.score').replace('{s}', state.score) + '</span>' +
            '</div>' +
            '<span class="qz-lvl">' + lvName(q.lvl) + '</span>' +
            '<div class="qz-q">' + qd.q + '</div>' +
            '<div class="qz-opts">' + opts + '</div>' +
            '<div class="qz-feedback" id="qz-fb" role="status"></div>' +
            '<div class="qz-next"><button class="btn" id="qz-next" style="display:none">' + T('quiz.next') + '</button></div>' +
          '</div>';
        var btns = root.querySelectorAll('.qz-opt');
        for (var i = 0; i < btns.length; i++) {
          btns[i].addEventListener('click', answer);
        }
      }

      /* E1：数字键 1-4 选择答案 */
      if (!window.__arcadeQuizDigitKeys) {
        window.__arcadeQuizDigitKeys = true;
        window.addEventListener('keydown', function (e) {
          var tag = ((e.target && e.target.tagName) || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea') return;
          var n = '1234'.indexOf(e.key);
          if (n < 0) return;
          var btn = root.querySelector('.qz-opt[data-i="' + n + '"]');
          if (btn && !btn.classList.contains('right') && !btn.classList.contains('wrong')) {
            e.preventDefault();
            answer({ currentTarget: btn });
          }
        });
      }

      /* 作答 */
      function answer(ev) {
        var btn = ev.currentTarget;
        if (btn.classList.contains('right') || btn.classList.contains('wrong')) return;
        var i = parseInt(btn.getAttribute('data-i'), 10);
        var q = state.list[state.idx];
        var qd = isEn ? q.en : q.zh;
        var right = i === q.a;
        if (right) { state.score++; QUIZ.markRight(q); }
        else { QUIZ.markWrong(q); state.roundWrong.push(q); }

        var opts = root.querySelectorAll('.qz-opt');
        for (var k = 0; k < opts.length; k++) {
          var oi = parseInt(opts[k].getAttribute('data-i'), 10);
          if (oi === q.a) opts[k].classList.add('right');
          else opts[k].classList.add('dim');
          if (oi === i && !right) opts[k].classList.add('wrong');
          opts[k].disabled = true;
        }
        var fb = document.getElementById('qz-fb');
        fb.className = right ? 'qz-feedback ok' : 'qz-feedback no';
        var qSrc = (window.QUIZ_SRC && q._bi !== undefined && window.QUIZ_SRC[q._bi]) ? window.QUIZ_SRC[q._bi] : null;
        fb.innerHTML = (right ? T('quiz.right') : T('quiz.wrong')) +
          '<div class="ex">' + T('quiz.explain').replace('{e}', qd.explain) + '</div>' +
          (qSrc ? '<div class="ex qz-src">📚 ' + T('common.srcTitle') + (qSrc.sources ? qSrc.sources[0].label : qSrc) + '</div>' : '');
        var nx = document.getElementById('qz-next');
        nx.style.display = 'inline-block';
        nx.addEventListener('click', function () { state.idx++; renderQ(); });
      }

      /* 结果屏 */
      function renderResult() {
        var focusResult = function () {
          /* A11Y：结果卡获得焦点（Tab 序列从结果内开始），SR 直接播报段位 */
          var res = root.querySelector('.qz-result');
          if (res) {
            res.setAttribute('tabindex', '-1');
            res.setAttribute('role', 'region');
            res.setAttribute('aria-label', T('quiz.resultTitle'));
            try { res.focus({ preventScroll: true }); } catch (e) { res.focus(); }
          }
        };
        /* 错题重练模式：不计段位、不写最佳，只反馈本轮成绩 */
        if (state.practice) {
          root.innerHTML =
            '<div class="qz-result">' +
              '<div class="big-icon">🔁</div>' +
              '<h2>' + T('quiz.practiceDone') + '</h2>' +
              '<div class="score-line">' + state.score + ' / ' + state.list.length + '</div>' +
              '<div class="rank-sub">' + T('quiz.practiceSub') + '</div>' +
              '<div style="margin-top:18px"><button class="btn" id="qz-again">' + T('quiz.resultAgain') + '</button></div>' +
            '</div>';
          var againP = document.getElementById('qz-again');
          if (againP) againP.addEventListener('click', renderStart);
          focusResult();
          return;
        }
        var r = QUIZ.recordResult(state.score, state.list.length);
        var best = QUIZ.lastResult();
        var ladder = '';
        QUIZ.RANKS.forEach(function (rr) {
          ladder += '<div class="r' + (rr.name === r.name ? ' on' : '') + '">' + rr.icon + ' ' +
            (isEn ? rr.en : rr.zh) + '<span class="pct">' + Math.round(rr.min * 100) + '%+</span></div>';
        });
        root.innerHTML =
          '<div class="qz-result">' +
            '<div class="big-icon">' + r.icon + '</div>' +
            '<h2>' + T('quiz.resultTitle') + '</h2>' +
            '<div class="score-line">' + state.score + ' / ' + state.list.length + '</div>' +
            '<div class="best-line">' + T('quiz.bestLabel').replace('{s}', best.ever).replace('{t}', state.list.length) + '</div>' +
            '<div class="rank-name">' + (isEn ? r.en : r.zh) + '</div>' +
            '<div class="rank-sub">' + T('quiz.resultSub') + '</div>' +
            '<div class="qz-ladder">' + ladder + '</div>' +
            (state.roundWrong.length
              ? '<details class="qz-review"><summary>📋 ' + T('quiz.reviewWrong').replace('{n}', state.roundWrong.length) + '</summary>' +
                state.roundWrong.map(function (w) {
                  var wd = isEn ? w.en : w.zh;
                  var wSrc = (window.QUIZ_SRC && w._bi !== undefined && window.QUIZ_SRC[w._bi]) ? window.QUIZ_SRC[w._bi] : null;
                  var wSrcLabel = wSrc ? (wSrc.sources ? wSrc.sources[0].label : wSrc) : '';
                  return '<div class="qz-rw"><div class="rw-q">' + wd.q + '</div>' +
                    '<div class="rw-a">✓ ' + wd.opts[w.a] + '</div>' +
                    '<div class="rw-x">' + wd.explain + '</div>' +
                    (wSrcLabel ? '<div class="rw-src">📚 ' + T('common.srcTitle') + wSrcLabel + '</div>' : '') + '</div>';
                }).join('') + '</details>'
              : '') +
            '<div class="qz-extend">' +
              '<a href="glossary.html">📖 ' + T('nav.glossary') + '</a>' +
              '<a href="protocols.html">🛡️ ' + T('nav.protocols') + '</a>' +
              '<a href="stories.html">📜 ' + T('nav.stories') + '</a>' +
            '</div>' +
            '<div style="margin-top:18px"><button class="btn" id="qz-again">' + T('quiz.resultAgain') + '</button></div>' +
          '</div>';
        var again = document.getElementById('qz-again');
        if (again) again.addEventListener('click', startNormal);
        focusResult();
        if (Arcade.ui && Arcade.ui.toast) {
          setTimeout(function () { Arcade.ui.toast(T('quiz.resultRank') + (isEn ? ': ' : '：') + (isEn ? r.en : r.zh), 'win'); }, 350);
        }
      }

      /* B2：#wrong 深链 —— 档案页错题卡直达练习模式 */
      if ((location.hash || '') === '#wrong' && QUIZ.wrongCount() > 0) startPractice();
      else renderStart();
    })();
  </script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
