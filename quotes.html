  <script>
    (function () {
      if (!window.Arcade || !Arcade.i18n || !window.QUOTES) return;
      Arcade.i18n.applyStatic();
      document.title = Arcade.i18n.t('quotes.title') + Arcade.i18n.t('app.titleSuffix');
      var T = Arcade.i18n.t;
      var isEn = Arcade.i18n.getLang() === 'en';
      var Q = window.QUOTES;

      var TAGS = ['all', 'security', 'history', 'math', 'privacy', 'war', 'science', 'philosophy', 'cracking'];
      var TAG_LABEL = {
        all: { zh: '全部', en: 'All' },
        security: { zh: '安全', en: 'Security' },
        history: { zh: '历史', en: 'History' },
        math: { zh: '数学', en: 'Math' },
        privacy: { zh: '隐私', en: 'Privacy' },
        war: { zh: '战争', en: 'War' },
        science: { zh: '科学', en: 'Science' },
        philosophy: { zh: '哲学', en: 'Philosophy' },
        cracking: { zh: '破译', en: 'Cracking' }
      };
      var state = { tag: 'all' };

      document.getElementById('qt-count').textContent = isEn
        ? Q.QUOTES.length + ' quotes · from Caesar to Schneier'
        : Q.QUOTES.length + ' 条名言 · 从凯撒到施奈尔';

      var tagBox = document.getElementById('qt-tags');
      var th = '';
      TAGS.forEach(function (t) {
        th += '<button class="qt-tag' + (t === 'all' ? ' on' : '') + '" data-tag="' + t + '">' + (isEn ? TAG_LABEL[t].en : TAG_LABEL[t].zh) + '</button>';
      });
      tagBox.innerHTML = th;

      var grid = document.getElementById('qt-grid');
      function render() {
        var list = Q.QUOTES.filter(function (q) { return state.tag === 'all' || q.tag === state.tag; });
        var h = '';
        list.forEach(function (q) {
          h += '<div class="qt-item">' +
            '<div class="qt-text">「' + (isEn ? q.en : q.zh) + '」</div>' +
            (isEn ? '<div class="qt-en">' + q.zh + '</div>' : '') +
            '<div class="qt-who">— ' + (isEn ? q.who.en : q.who.zh) + '<span class="qt-year">' + q.year + '</span></div>' +
            '<span class="qt-tagchip">' + (isEn ? TAG_LABEL[q.tag].en : TAG_LABEL[q.tag].zh) + '</span>' +
          '</div>';
        });
        grid.innerHTML = h || '<div class="qt-item" style="text-align:center;color:var(--text-dim)">' + (isEn ? 'No quotes in this tag' : '该主题暂无名言') + '</div>';
      }
      render();

      var tags = tagBox.querySelectorAll('.qt-tag');
      for (var i = 0; i < tags.length; i++) {
        (function (b) {
          b.addEventListener('click', function () {
            state.tag = b.getAttribute('data-tag');
            for (var j = 0; j < tags.length; j++) tags[j].classList.toggle('on', tags[j] === b);
            render();
          });
        })(tags[i]);
      }
    })();
  </script>
