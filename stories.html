  <script>

    if (window.Arcade && Arcade.i18n) {
      Arcade.i18n.applyStatic();
      document.title = T('st.pageTitle') + Arcade.i18n.t('app.titleSuffix');
      var d = document.querySelector('meta[name="description"]');
      if (d) d.setAttribute('content', Arcade.i18n.t('st.pageDesc'));
    }
    var stories = window.Arcade && Arcade.stories ? Arcade.stories : null;
    if (!stories) document.getElementById('st-timeline').textContent = 'stories 模块未加载';

    /* 进度 */
    document.getElementById('st-hero-sub').textContent = T('st.heroSub');
    var readN = stories.readCount(), totalN = stories.getAll().length, letterN = stories.letterTotal();
    var letters = stories.letterCount(), arts = stories.artifactsCount();
    document.getElementById('st-progress-lbl').textContent =
      T('st.progressF').replace('{r}', readN).replace('{t}', totalN);
    var prog = document.getElementById('st-progress');
    [['📖', readN + '/' + totalN, 'st.progRead'], ['🔑', letters + '/' + letterN, 'st.progLetters'], ['📎', arts + '/' + window.ARTIFACTS.length, 'st.progArts']].forEach(function (it) {
      var el = document.createElement('span');
      el.style.cssText = 'font-family:var(--font-pixel);font-size:11px;color:var(--neon-cyan)';
      el.textContent = it[0] + ' ' + it[1] + ' ' + T(it[2]);
      prog.appendChild(el);
    });

    /* 时间轴：章节主节点 + 历史事件次节点，按年份交织成一条时间线 */
    var tl = document.getElementById('st-timeline');
    var isEn = window.Arcade && Arcade.i18n && Arcade.i18n.getLang() === 'en';

    /* 章节 → 代表年份（用于排序定位） */
    var CH_YEAR = {
      dawn: -196, caesar: -50, arab: 850, bacon: 1623, ww1: 1914,
      bletchley: 1939, midway: 1942, purple: 1941, lorenz: 1943, venona: 1943, modern: 1948,
      quantum: 2024
    };
    /* 时间线中与章节重复的 story 节点 id（章节已由主节点呈现，次节点跳过） */
    var DUP_STORY = { dawn: 1, caesar: 1, arab: 1, bacon: 1, ww1: 1, bletchley: 1, midway: 1, purple: 1, lorenz: 1, venona: 1, modern: 1, quantum: 1 };

    function chapterYear(ch) { return CH_YEAR[ch.id] !== undefined ? CH_YEAR[ch.id] : 1900; }

    /* 组装节点列表：{ kind:'ch'|'ev', y, ... } */
    var nodes = [];
    stories.getAll().forEach(function (ch) {
      nodes.push({ kind: 'ch', y: chapterYear(ch), ch: ch });
    });
    var evSeen = {};
    (window.CRYPTO_TIMELINE || []).forEach(function (it) {
      if (it.link && it.link.type === 'story' && DUP_STORY[it.link.id]) return; // 章节重复节点跳过
      nodes.push({ kind: 'ev', y: it.y, ev: it });
    });
    /* 按年份排序（同年章节优先） */
    nodes.sort(function (a, b) { return a.y - b.y || (a.kind === 'ch' ? -1 : 1); });

    nodes.forEach(function (n) {
      if (n.kind === 'ch') {
        var ch = n.ch;
        var read = stories.isRead(ch.id);
        var a = document.createElement('a');
        a.className = 'st-chapter' + (read ? '' : ' locked');
        a.href = 'story.html?id=' + ch.id;
        var gamesCount = ch.games.length;
        a.innerHTML = '<span class="st-era">' + T(ch.era) + '</span>' +
          '<div class="st-name">' + T(ch.titleKey) + '</div>' +
          '<div class="st-one">' + T(ch.titleKey + '.one') + '</div>' +
          '<div class="st-meta">' +
          '<span>' + T('st.gamesCount').replace('{n}', gamesCount) + '</span>' +
          '<span class="' + (read ? 'ok' : 'lk') + '">' + (read ? '✓ ' + T('st.read') : T('st.unread')) + '</span>' +
          (stories.letters().indexOf(ch.id) >= 0 ? '<span class="ok">🔑 ' + T('st.letterGot') + '</span>' : '') +
          '</div>';
        tl.appendChild(a);
      } else {
        var it = n.ev;
        var label = isEn ? it.en : it.zh;
        var pre = window.__arcadePagePrefix || '';
        var href = null;
        if (it.link) {
          if (it.link.type === 'story') href = pre + 'story.html?id=' + it.link.id;
          else if (it.link.type === 'game') href = pre + 'games/' + it.link.id + '/index.html';
          else if (it.link.type === 'people') href = pre + 'people.html';
          else if (it.link.type === 'artifact') href = pre + 'artifacts.html';
          else if (it.link.type === 'page') href = pre + it.link.id + '.html';
          else if (it.link.type === 'term') href = pre + 'glossary.html';
        }
        var div = document.createElement(href ? 'a' : 'div');
        div.className = 'st-ev';
        if (href) div.href = href;
        var yearTxt = it.y < 0 ? 'BC ' + (-it.y) : it.y;
        div.innerHTML = '<span class="st-ev-year">' + yearTxt + '</span>' +
          '<span class="st-ev-ic">' + it.icon + '</span>' +
          '<span class="st-ev-tx">' + label + '</span>';
        tl.appendChild(div);
      }
    });

    /* 人物志与密件册已拆分为独立页面（people.html / artifacts.html），经全局导航访问 */
  </script>
