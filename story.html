  <script>
    /* 章节阅读背景音乐：破译主题曲 */
    if (window.Arcade && Arcade.music && Arcade.settings) {
      Arcade.music.setEnabled(Arcade.settings.get().music !== false);
      Arcade.music.play('cipher');
    }
    /* E3：阅读进度条 + 字号控制 + 方向键翻章 */
    (function () {
      var bar = document.querySelector('#sy-readbar i');
      function updBar() {
        var h = document.documentElement;
        var max = h.scrollHeight - h.clientHeight;
        var pct = max > 0 ? Math.min(100, Math.round(h.scrollTop / max * 100)) : 0;
        if (bar) bar.style.width = pct + '%';
      }
      window.addEventListener('scroll', updBar, { passive: true });
      updBar();

      /* 字号 A-/A+（14–20px，记忆于 localStorage） */
      var body = null;
      function applyFont(px) {
        if (!body) body = document.getElementById('sy-root');
        if (!body) return;
        body.style.fontSize = px + 'px';
        try { localStorage.setItem('arcade_story_font', String(px)); } catch (e) {}
      }
      var saved = 0;
      try { saved = parseInt(localStorage.getItem('arcade_story_font') || '0', 10); } catch (e) {}
      if (saved >= 13 && saved <= 22) applyFont(saved);
      var fm = document.getElementById('sy-fminus'), fp = document.getElementById('sy-fplus');
      if (fm) fm.addEventListener('click', function () {
        var cur = parseInt((body && getComputedStyle(body).fontSize) || '14', 10);
        applyFont(Math.max(13, cur - 1));
      });
      if (fp) fp.addEventListener('click', function () {
        var cur = parseInt((body && getComputedStyle(body).fontSize) || '14', 10);
        applyFont(Math.min(22, cur + 1));
      });

      /* ←/→ 翻章（输入态不劫持） */
      window.addEventListener('keydown', function (e) {
        var tag = ((e.target && e.target.tagName) || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea') return;
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        var links = document.querySelectorAll('.sy-nav a:not(.disabled)');
        if (links.length < 2) return;
        /* links[0]=prev links[1]=目录 links[2]=next */
        var target = e.key === 'ArrowLeft' ? links[0] : links[links.length - 1];
        if (target) window.location.href = target.getAttribute('href');
      });
    })();
  </script>
  <script src="assets/js/pwa.js"></script>
</body>
